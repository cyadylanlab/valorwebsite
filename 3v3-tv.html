<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3v3 Community Cup Live Standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..700&display=swap" rel="stylesheet">
<style>
/* IDEA: the standings page of a matchday program, blown up to fill a big screen at headquarters.
   A fixed 1920 x 1080 stage scaled to whatever TV it lands on. Standings never move; the right rail
   rotates between the gift drive story, the sponsors and what is on the fields now. */
:root{
  --ink:#101218;--ink-2:#3d434e;--muted:#5b6270;--line:#d9dee5;--soft:#f3f5f8;--paper:#fff;
  --blue:#00aeeb;--pink:#f345ad;--orange:#ff743d;--aqua:#9ce7e9;--pink-deep:#9c1a68;
  --sans:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#fff;cursor:none}
body{font-family:var(--sans);color:var(--ink);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--paper);overflow:hidden}
.wide{font-stretch:118%;font-weight:900;letter-spacing:-.03em;line-height:1}
.narrow{font-stretch:75%}
.spectrum{height:12px;background:linear-gradient(90deg,var(--blue) 0 30%,var(--pink) 30% 58%,var(--orange) 58% 79%,var(--aqua) 79% 100%)}

/* top */
.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:26px;align-items:center;height:112px;padding:0 40px;border-bottom:5px solid var(--ink)}
.top .crest{height:92px;width:auto;display:block}
.top h1{font-size:56px;text-transform:uppercase;letter-spacing:-.01em}
.top .sub{margin-top:6px;font-size:21px;font-weight:650;color:var(--ink-2)}
.status{text-align:right}
.clock{font-size:58px;font-weight:900;font-stretch:110%;letter-spacing:-.03em;line-height:.95}
.clock small{font-size:30px;margin-left:6px;font-weight:800}
.round{margin-top:4px;font-size:20px;font-weight:750}
.round b{display:inline-block;background:var(--orange);color:var(--ink);padding:2px 10px;margin-right:8px;font-weight:850}
.upd{margin-top:3px;font-size:16px;color:var(--muted);font-weight:600}
.upd i{display:inline-block;width:11px;height:11px;border-radius:50%;background:#20b26b;margin-right:7px;vertical-align:1px}
.upd.off i{background:#c3c8d2}

/* board */
.body{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:34px;padding:16px 40px 0;height:892px}
.left{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:14px;height:862px;min-width:0}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 28px;overflow:hidden;align-items:start}
.colm{min-width:0}
.div{margin-bottom:9px;border-top:6px solid var(--ink);position:relative}
.div h2{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:5px 0 3px;border-bottom:4px solid var(--c,var(--blue))}
.div h2 span{font-size:27px}
.div h2 em{font-style:normal;font-size:15px;font-weight:750;color:var(--muted);white-space:nowrap}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:right;padding:4px 0 2px}
th.tm{text-align:left}
td{font-size:20px;font-weight:700;padding:0;height:27px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
td.rk{width:25px;text-align:left;font-weight:900;font-size:19px;color:var(--muted)}
td.tm{text-align:left;overflow:hidden}
.nm{display:inline-block;overflow:hidden;vertical-align:middle;font-stretch:72%;font-weight:750;font-size:22px}
.on{display:inline-block;margin-left:6px;background:var(--orange);color:var(--ink);font-size:12px;font-weight:900;padding:1px 4px;vertical-align:3px;font-stretch:90%}
col.c-rk{width:25px}col.c-p{width:30px}col.c-gd{width:42px}col.c-pt{width:40px}
td.pt{font-weight:900;font-size:22px}
td.gd{color:var(--ink-2);font-weight:650}
td.p{color:var(--muted);font-weight:650}
tr.lead td.rk{color:var(--ink)}
tr.in td{background:rgba(156,231,233,.38)}
tr.in td.rk{box-shadow:inset 5px 0 0 var(--blue);padding-left:8px}
.foot{font-size:15px;font-weight:700;color:var(--ink-2);padding:5px 0 0;line-height:1.3}
.foot b{font-weight:850;color:var(--ink)}
.champ{margin-top:6px;background:var(--pink);color:#fff;padding:4px 8px 5px;display:flex;align-items:baseline;gap:9px;white-space:nowrap;overflow:hidden}
.champ small{font-size:13px;font-weight:850;text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}
.champ strong{font-size:21px;font-weight:900;font-stretch:80%;line-height:1.05;overflow:hidden;display:inline-block}

/* up next */
.next{display:grid;grid-template-columns:190px minmax(0,1fr);border:5px solid var(--ink);height:124px}
.next .lab{background:var(--ink);color:#fff;padding:12px 16px;display:flex;flex-direction:column;justify-content:center}
.next .lab small{font-size:15px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:var(--aqua)}
.next .lab b{font-size:40px;margin-top:6px}
.next .lab b small{font-size:18px;color:#fff;letter-spacing:0;margin-left:4px}
.next .lab em{font-style:normal;font-size:14px;font-weight:650;color:#c3c8d2;margin-top:6px;line-height:1.25}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:1fr;gap:4px 10px;padding:6px 12px}
.tile{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:center;min-width:0}
.tile .f{background:var(--blue);font-weight:900;font-size:19px;text-align:center;padding:6px 0;font-stretch:95%}
.tile.girls .f{background:var(--pink);color:#fff}
.tile.po .f{box-shadow:0 0 0 3px var(--ink)}
.tile .g small b{color:var(--ink);font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.tile .g{min-width:0;line-height:1.02;font-weight:800;font-stretch:76%;font-size:16px}
.tile .g span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .g span.v{color:var(--ink-2)}
.tile .g span.v i{font-style:normal;color:var(--muted);font-weight:650;margin-right:3px}
.tile .g small{display:block;font-size:11px;font-weight:750;color:var(--muted);font-stretch:100%;white-space:nowrap;overflow:hidden;margin-top:1px}
.next .msg{display:flex;align-items:center;padding:0 22px;font-size:26px;font-weight:800}

.mapw{margin-top:12px;flex:1;min-height:0;display:flex;justify-content:center}
.mapw svg{height:100%;width:auto;max-width:100%}
.slide p.mapn{margin-top:8px;font-size:17px;line-height:1.3}

/* new result banner, slides down over the header */
.flash{position:absolute;left:0;right:0;top:12px;height:112px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:28px;padding:0 40px;background:var(--ink);color:#fff;transform:translateY(-140%);transition:transform .55s cubic-bezier(.2,.8,.2,1);z-index:20;border-bottom:8px solid var(--blue)}
.flash.girls{border-bottom-color:var(--pink)}
.flash.show{transform:translateY(0)}
.flash .k{background:var(--blue);color:var(--ink);font-size:30px;font-weight:900;font-stretch:115%;letter-spacing:.02em;padding:10px 18px;text-transform:uppercase}
.flash.girls .k{background:var(--pink);color:#fff}
.flash.champ .k{background:#fff;color:var(--ink)}
.flash .m{min-width:0}
.flash .m small{display:block;font-size:20px;font-weight:800;color:var(--aqua);letter-spacing:.06em;text-transform:uppercase}
.flash .m b{display:block;font-size:46px;font-weight:900;font-stretch:90%;letter-spacing:-.02em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.flash .f{font-size:22px;font-weight:800;color:#c3c8d2;text-align:right;white-space:nowrap}
/* stats slide */
.bign{display:flex;align-items:baseline;gap:12px;margin-top:14px}
.bign b{font-size:84px;font-weight:900;font-stretch:110%;letter-spacing:-.04em;line-height:.9}
.bign span{font-size:21px;font-weight:800;color:var(--ink-2);line-height:1.2}
.stat{margin-top:16px;border-top:3px solid var(--ink);padding-top:8px}
.stat h4{font-size:15px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between}
.stat h4 em{font-style:normal;color:var(--muted);letter-spacing:0;text-transform:none;font-weight:750}
.stat p.names{margin-top:6px;font-size:17px;line-height:1.35;font-weight:700;color:var(--ink);font-stretch:85%}
.stat p.names i{font-style:normal;color:var(--muted);font-weight:650}
.stat p.sub{margin-top:4px;font-size:14px;color:var(--muted);font-weight:650}

/* photo moment */
.photo{position:absolute;inset:0;z-index:50;background:#fff;display:none;overflow:hidden}
.photo.show{display:block}
.photo .bars{position:absolute;left:0;right:0;height:26px;background:linear-gradient(90deg,var(--blue) 0 30%,var(--pink) 30% 58%,var(--orange) 58% 79%,var(--aqua) 79% 100%)}
.photo .bars.t{top:0}.photo .bars.b{bottom:0}
.photo .conf{position:absolute;inset:0;pointer-events:none}
.photo .conf i{position:absolute;display:block;width:18px;height:42px;opacity:.8;animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-120px) rotate(0)}to{transform:translateY(1200px) rotate(540deg)}}
.photo .inner{position:absolute;left:0;right:0;top:40px;bottom:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:0 70px}
.photo .crestbig{height:250px;width:auto;display:block;flex:none}
.photo .ev{margin-top:0;font-size:36px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.photo .word{display:inline-block;margin-top:2px;font-size:236px;font-weight:900;font-stretch:120%;letter-spacing:-.03em;line-height:.9;color:var(--pink);cursor:pointer;text-transform:uppercase}
.photo.fin .word{color:var(--blue)}
.photo .dv{margin-top:10px;font-size:56px;font-weight:850;color:var(--ink)}
.photo .tm{margin-top:2px;font-size:168px;font-weight:900;font-stretch:90%;letter-spacing:-.03em;line-height:1;color:var(--ink);white-space:nowrap;max-width:100%}
.photo .low{position:absolute;left:90px;right:90px;bottom:46px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.photo .low p{font-size:20px;font-weight:750;color:var(--ink-2);order:2}
.photo .low .lg{display:flex;gap:30px;align-items:center}
.photo .low .lg img{height:86px;width:auto}
.photo .close{position:absolute;right:24px;top:40px;font:inherit;font-size:18px;font-weight:800;background:var(--ink);color:#fff;border:0;padding:10px 16px;cursor:pointer;opacity:0;transition:opacity .3s}
.awake .photo .close{opacity:1}
/* photo picker */
.pick{position:absolute;inset:0;z-index:45;background:rgba(16,18,24,.92);display:none;padding:60px 80px;color:#fff;overflow:hidden}
.pick.show{display:block}
.pick h2{font-size:48px}
.pick p.h{margin-top:10px;font-size:20px;color:#c3c8d2;font-weight:600}
.pick .grid{margin-top:30px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px}
.pick .pd{background:#fff;color:var(--ink);padding:14px 16px 16px}
.pick .pd h3{font-size:22px;font-weight:900;font-stretch:110%;border-bottom:3px solid var(--ink);padding-bottom:6px}
.pick button{display:block;width:100%;text-align:left;font:inherit;border:0;cursor:pointer;margin-top:8px;padding:8px 10px;font-size:17px;font-weight:800;font-stretch:85%;background:var(--soft);color:var(--ink)}
.pick button small{display:block;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;font-stretch:100%;color:var(--muted)}
.pick button.c{background:var(--pink);color:#fff}.pick button.c small{color:#fff}
.pick button.f{background:var(--blue)}.pick button.f small{color:var(--ink)}
.pick button.o{font-size:14px;padding:5px 8px;margin-top:4px;font-weight:700}
.pick .x{position:absolute;right:60px;top:56px;width:auto;font-size:20px;background:#fff;padding:12px 20px}
.photobtn{position:absolute;right:40px;top:132px;z-index:15;font:inherit;font-size:15px;font-weight:850;letter-spacing:.06em;text-transform:uppercase;background:var(--pink);color:#fff;border:0;padding:6px 12px;cursor:pointer;opacity:0;transition:opacity .3s;pointer-events:none}
.awake .photobtn{opacity:1;pointer-events:auto}
.awake,.awake *{cursor:default}
.champ{cursor:pointer}

/* rail */
.rail{display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:14px;height:862px}
.feature{position:relative;border:5px solid var(--ink);background:var(--soft);overflow:hidden}
.slide{position:absolute;inset:0;padding:22px 24px 30px;opacity:0;transition:opacity .9s ease;display:flex;flex-direction:column}
.slide.show{opacity:1}
.kicker{display:inline-block;align-self:flex-start;background:var(--ink);color:#fff;font-size:15px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px}
.slide h3{margin-top:14px;font-size:36px}
.slide p{margin-top:12px;font-size:19.5px;line-height:1.38;color:var(--ink-2);font-weight:500}
.slide p b{color:var(--ink);font-weight:800}
.cl-logo{width:170px;height:auto;display:block;margin:14px 0 0}
.quote{margin-top:14px;border-left:8px solid var(--pink);padding:2px 0 2px 18px}
.quote q{display:block;font-size:26px;font-weight:850;font-stretch:95%;line-height:1.12;quotes:"\201C" "\201D"}
.quote cite{display:block;margin-top:10px;font-style:normal;font-size:16px;font-weight:750;color:var(--muted)}
.gift{margin-top:auto;background:var(--aqua);padding:10px 12px;font-size:18px;font-weight:750;line-height:1.3}
.big-logos{display:flex;gap:30px;align-items:flex-start;justify-content:center;margin-top:26px}
.big-logos img{width:140px;height:auto}
.slide .list{margin-top:10px;list-style:none}
.list li{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:3px 0;font-size:17px;font-weight:700}
.list li .f{font-weight:900;background:var(--ink);color:#fff;text-align:center;font-size:15px;padding:3px 0}
.list li .g{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-stretch:82%}
.list li .g small{display:block;font-size:12px;color:var(--muted);font-weight:700;font-stretch:100%}
.list li .s{font-weight:900;font-size:21px}
.dots{position:absolute;left:28px;right:28px;bottom:12px;display:flex;gap:8px}
.dots i{flex:1;height:5px;background:var(--line)}
.dots i.on{background:var(--ink)}
.sponsors{border-top:5px solid var(--ink);padding-top:10px}
.sponsors h4,.qr h4{font-size:15px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}
.sp-row{display:flex;gap:22px;align-items:flex-start;margin-top:10px}
.sp-row figure{display:flex;gap:12px;align-items:center}
.sp-row img{width:76px;height:auto}
.sp-row figcaption{font-size:15px;font-weight:800;line-height:1.15;max-width:96px}
.qr{display:grid;grid-template-columns:118px minmax(0,1fr);gap:18px;align-items:center;border-top:5px solid var(--ink);padding-top:12px}
.qr img{width:118px;height:118px;display:block}
.qr p{margin-top:6px;font-size:23px;font-weight:850;line-height:1.15}
.qr p span{display:block;font-size:17px;font-weight:650;color:var(--ink-2);margin-top:4px}

/* ticker */
.ticker{position:absolute;left:0;right:0;bottom:0;height:64px;background:var(--ink);color:#fff;display:flex;align-items:center;overflow:hidden}
.ticker .lab{flex:none;height:100%;display:flex;align-items:center;padding:0 22px;background:var(--pink);font-size:19px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;z-index:2}
.ticker .track{position:relative;flex:1;height:100%;overflow:hidden}
.ticker .run{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;white-space:nowrap;font-size:24px;font-weight:700;will-change:transform}
.ticker .run span{margin-right:44px}
.ticker .run span::before{content:"";display:inline-block;width:12px;height:12px;margin-right:16px;background:var(--c,var(--blue));vertical-align:2px}
.ticker .run b{font-weight:900}
</style>
</head>

const PLACE = /^(1st|2nd|3rd|4th) place$/i, SF = /^(Winner|Loser) SF([12])$/i;

function rankTable(rows, pool) {

    for (const g of pool) {
      if (!done2(g) || !rec[g.a] || !rec[g.b]) continue;
      const A = rec[g.a], B = rec[g.b];
      A.p++; B.p++; A.gf += g.sa; A.ga += g.sb; B.gf += g.sb; B.ga += g.sa;
      if (g.sa > g.sb) { A.w++; B.l++; A.pts += 3; } else if (g.sa < g.sb) { B.w++; A.l++; B.pts += 3; } else { A.d++; B.d++; A.pts++; B.pts++; }

function demoData(src) {
  const n = nowET().min; let seed = 7;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const d = JSON.parse(JSON.stringify(src));
  for (const g of d.games) { if (mins(g.time) + ROUND_MIN <= n) { g.sa = String(Math.floor(rnd() * 5)); g.sb = String(Math.floor(rnd() * 5)); if (g.stage !== "Pool" && g.sa === g.sb) g.sa = String(+g.sa + 1); } }
  return d;
}

/* ---------- rendering ---------- */
function roundInfo() {
  const n = nowET();
  if (n.date !== EVENT_DATE) return { pre: n.date < EVENT_DATE, post: n.date > EVENT_DATE, idx: -1 };
  let idx = -1; ROUNDS.forEach((t, i) => { if (n.min >= mins(t)) idx = i; });
  const playing = idx >= 0 && n.min < mins(ROUNDS[idx]) + ROUND_MIN;
  return { idx, playing, before: idx < 0, after: idx === ROUNDS.length - 1 && !playing, next: ROUNDS[idx + 1] || null, min: n.min };
}

function fmtLine(D, M) {
  const po = D.po;
  const fin = po.find(g => g.stage === "Final");
  const sfs = po.filter(g => /^Semifinal/.test(g.stage));
  if (!po.length) return `No final. <b>First place after the last game wins.</b>`;
  if (fin && fin.A.fixed && fin.B.fixed) return `<b>Final ${short(fin.time)} on ${esc(fin.field)}:</b> ${esc(fin.A.name)} vs ${esc(fin.B.name)}`;
  if (sfs.length) return `All ${D.names.length} play semifinals at ${short(sfs[0].time)}. <b>Final ${short(fin.time)} on ${esc(fin.field)}.</b>`;
  return `Top two play the <b>final at ${short(fin.time)} on ${esc(fin.field)}</b>.`;
}
function champion(D) {
  const fin = D.po.find(g => g.stage === "Final");
  if (fin) { if (!(fin.A.fixed && fin.B.fixed)) return null; const w = winnerOf(fin); return w ? (w === "a" ? fin.A.name : fin.B.name) : null; }
  if (!D.po.length && D.poolDone && D.table[0] && !D.table[0].toss) return D.table[0].team;
  return null;
}

  for (const d of M.divs) if (!cols.flat().includes(d)) cols.reduce((a, c) => c.length < a.length ? c : a).push(d);
  const card = (d) => { const i = ORDER.indexOf(d) < 0 ? 0 : ORDER.indexOf(d); {

/* ---------- fun stats (no single-game scorelines, so nobody is singled out) ---------- */
function funStats(M) {
  const rec = {}; let goals = 0, played = 0;
  const get = (n, d) => rec[n] || (rec[n] = { name: n, div: d, p: 0, l: 0, cs: 0 });
  for (const g of M.games) {
    if (!done2(g) || !g.A.fixed || !g.B.fixed) continue;
    played++; goals += g.sa + g.sb;
    const A = get(g.A.name, g.division), B = get(g.B.name, g.division);
    A.p++; B.p++;
    const w = winnerOf(g);
    if (w === "a") B.l++; else if (w === "b") A.l++;
    if (g.sb === 0) A.cs++;
    if (g.sa === 0) B.cs++;
  }
  const all = Object.values(rec).sort((a, b) => ORDER.indexOf(a.div) - ORDER.indexOf(b.div) || a.name.localeCompare(b.name));
  return { goals, played, unbeaten: all.filter(r => r.p && !r.l), wall: all.filter(r => r.cs).sort((a, b) => b.cs - a.cs || ORDER.indexOf(a.div) - ORDER.indexOf(b.div)) };
}
function listNames(rows, max, counts) {
  const shown = rows.slice(0, max).map(r => `${esc(r.name)}${counts && r.cs > 1 ? ` <i>x${r.cs}</i>` : ""}`).join(", ");
  return shown + (rows.length > max ? ` <i>and ${rows.length - max} more</i>` : "");
}

let seen = null; const flashQ = []; let flashing = false;
function checkNew(M) {
  const now = new Map();
  for (const g of M.games) if (done2(g) && g.A.fixed && g.B.fixed) now.set(g.time + "|" + g.field, g);
  if (!seen) { seen = new Map([...now].map(([k, g]) => [k, g.sa + "-" + g.sb])); return; }
  for (const [k, g] of now) {
    const s = g.sa + "-" + g.sb;
    if (seen.get(k) !== s) { seen.set(k, s); flashQ.push(g); }
  }
  if (!flashing) nextFlash();
}
function nextFlash() {
  const el = document.getElementById("flash");

  flashing = true;
  const girls = /girls/i.test(g.division);
  const champ = g.stage === "Final" && winnerOf(g);
  const win = champ ? (winnerOf(g) === "a" ? g.A.name : g.B.name) : null;
  const pk = done2(g) && g.sa === g.sb && g.stage !== "Pool" && winnerOf(g) ? `, ${esc(win || (winnerOf(g) === "a" ? g.A.name : g.B.name))} advance on golden goal or penalties` : "";

}

  else line = `<b>Next</b>Round ${R.idx + 2} kicks off at ${esc(R.next)}`;
  document.getElementById("round").innerHTML = line;
  const u = document.getElementById("upd");
  if (DEMO) { u.className = "upd"; u.innerHTML = "<i></i>Preview with made-up scores"; }
  else if (live && lastOk) { u.className = "upd"; u.innerHTML = `<i></i>Scores updated ${lastOk.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: "America/New_York" })}`; }
  else { u.className = "upd off"; u.innerHTML = "<i></i>Showing the posted schedule"; }
}

function sideTxt(r) { return r.fixed ? r.name : r.name; }
function renderNext(M, R) {
  const el = document.getElementById("next");
  let round = null, kicker = "Up next", note = "Next teams, warm up beside your pitch";
  const last = ROUNDS.length - 1;
  if (R.post || R.after) { el.innerHTML = `<div class="lab"><small>Full time</small><b class="wide">Thanks</b></div><div class="msg">That is the day. Thank you for playing, and for every gift you brought for DC Candlelighters.</div>`; return; }
  if (R.pre || R.before) { round = ROUNDS[0]; kicker = "First games"; note = R.pre ? "Saturday, November 28" : "Check in 30 minutes before kickoff"; }
  else if (R.playing && R.idx === last) { round = ROUNDS[last]; kicker = "On now"; note = "Last round of the day"; }
  else round = ROUNDS[R.playing ? R.idx + 1 : R.idx + 1];
  const gs = M.games.filter(g => g.time === round).sort((a, b) => a.field.localeCompare(b.field));
  const [hm, ap] = round.split(" ");
  el.innerHTML = `<div class="lab"><small>${kicker}</small><b class="wide">${hm}<small>${ap}</small></b><em>${note}</em></div>
    <div class="tiles">${gs.map(g => `<div class="tile${g.stage !== "Pool" ? " po" : ""}${/girls/i.test(g.division) ? " girls" : ""}"><span class="f">${esc(g.field)}</span><div class="g"><span>${esc(sideTxt(g.A))}</span><span class="v"><i>vs</i>${esc(sideTxt(g.B))}</span><small>${esc(g.division)}${g.stage !== "Pool" ? " <b>" + esc(g.stage) + "</b>" : ""}</small></div></div>`).join("")}</div>`;
  for (const s of el.querySelectorAll(".tile .g span")) {
    let z = 16; s.style.fontSize = z + "px";
    while (s.scrollWidth > s.clientWidth && z > 11) { z -= 0.5; s.style.fontSize = z + "px"; }
  }
}

let tickerKey = "";
function renderTicker(M) {
  const doneG = M.games.filter(done2).sort((a, b) => mins(b.time) - mins(a.time)).slice(0, 14);
  const divColor = d => COLORS[(ORDER.indexOf(d) + 4) % 4];
  const items = doneG.map(g => `<span style="--c:${divColor(g.division)}">${esc(g.division)}: <b>${esc(g.A.name)} ${g.sa}</b>, <b>${esc(g.B.name)} ${g.sb}</b></span>`);
  const notes = [
    `<span style="--c:var(--pink)">Bring a gift for DC Candlelighters to headquarters</span>`,
    `<span style="--c:var(--aqua)">Scores post here after each game is reported to the scorer's table</span>`,
    `<span style="--c:var(--orange)">Thank you, Moda Cafe &amp; Restaurant and Barr Tea</span>`
  ];
  const all = items.length ? items.concat(notes) : notes.concat([`<span style="--c:var(--blue)">Two 12-minute halves. No offside, no keeper, kick-ins</span>`]);
  document.getElementById("tlab").textContent = items.length ? "Latest" : "Today";
  const key = all.join("");
  if (key === tickerKey) return; tickerKey = key;
  const run = document.getElementById("run");
  run.innerHTML = key + key;
  const w = run.scrollWidth / 2;
  run.getAnimations().forEach(a => a.cancel());
  run.animate([{ transform: "translateX(0)" }, { transform: `translateX(${-w}px)` }], { duration: w / 70 * 1000, iterations: Infinity });
}

function render() {
  const M = model(), R = roundInfo();
  renderTop(R); renderBoard(M, R); renderNext(M, R); renderRail(M, R); renderTicker(M); checkNew(M);
}
function scale() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  const st = document.getElementById("stage");
  st.style.transform = `scale(${s})`;
  st.style.left = (innerWidth - 1920 * s) / 2 + "px";
  st.style.top = (innerHeight - 1080 * s) / 2 + "px";
}
async function load() {
  if (DEMO) { data = demoData(normalize(SNAPSHOT)); render(); return; }
  try {
    const r = await fetch(DATA_URL, { cache: "no-store" });
    const j = await r.json();
    if (j && j.games && j.games.length && j.teams && j.teams.length) { data = normalize(j); live = true; lastOk = new Date(); }
  } catch (e) { live = false; }
  render();
}
addEventListener("resize", scale);
document.getElementById("photobtn").onclick = openPick;
scale();
if (DEMO) data = demoData(normalize(SNAPSHOT));
render();
document.fonts && document.fonts.ready.then(fit);
load();
setInterval(load, REFRESH_MS);
setInterval(() => renderTop(roundInfo()), 15000);
setInterval(nextSlide, 14000);
window.__next = nextSlide;
}
</script>
</body>
