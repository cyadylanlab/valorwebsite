<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #000000;
    --ink: #0B0B0B;
    --white: #FFFFFF;
    --gold: #8B7A4C;
    --brass: #C8B98F;
    --grey: #B9B9B9;
  }
  html, body { background: transparent; height: 100%; }
  body { font-family: 'Barlow', sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }

  .strip {
    position: relative;
    display: grid;
    grid-template-columns: auto auto 1fr auto;
    align-items: center;
    column-gap: 28px;
    min-height: 100%;
    padding: 18px 40px;
    background: var(--black);
    color: var(--white);
    text-decoration: none;
    overflow: hidden;
    opacity: 0;
    transition: opacity .25s ease;
  }
  .strip.ready { opacity: 1; }

  /* Oversized outlined wordmark running off the right edge */
  .watermark {
    position: absolute;
    right: -40px;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 260px;
    line-height: 1;
    letter-spacing: 6px;
    color: transparent;
    -webkit-text-stroke: 1.5px rgba(200,185,143,0.14);
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
    transition: transform .6s ease;
  }
  .strip:hover .watermark { transform: translate(-24px, -50%); }

  .crest { position: relative; width: 82px; height: 82px; object-fit: contain; display: block; }

  .rule { position: relative; width: 2px; align-self: stretch; background: var(--gold); margin: 6px 0; }

  .copy { position: relative; min-width: 0; }
  .headline {
    font-family: 'Bebas Neue', sans-serif;
    font-weight: 400;
    font-size: 54px;
    line-height: .92;
    letter-spacing: 2px;
    color: var(--white);
  }
  .sub {
    margin-top: 8px;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.35;
    color: var(--grey);
  }
  .sub b { color: var(--brass); font-weight: 700; }

  .cta {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 17px 26px;
    background: var(--gold);
    color: var(--black);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 1.6px;
    line-height: 1;
    white-space: nowrap;
    border-radius: 2px;
    overflow: hidden;
    transition: background .25s ease, color .25s ease;
  }
  .cta svg { width: 20px; height: 20px; transition: transform .25s ease; }
  .strip:hover .cta, .strip:focus-visible .cta { background: var(--brass); }
  .strip:hover .cta svg { transform: translateX(5px); }

  /* Brass line that draws across the bottom edge on load */
  .edge {
    position: absolute;
    left: 0; bottom: 0;
    height: 3px;
    width: 100%;
    background: var(--gold);
    transform-origin: left center;
    transform: scaleX(0);
  }
  .strip.ready .edge { animation: draw 1.1s cubic-bezier(.6,.05,.2,1) .15s forwards; }
  @keyframes draw { to { transform: scaleX(1); } }

  .strip:focus-visible { outline: 3px solid var(--brass); outline-offset: -3px; }

  /* Tablet */
  @media (max-width: 900px) {
    .strip { column-gap: 20px; padding: 16px 24px; }
    .crest { width: 66px; height: 66px; }
    .headline { font-size: 44px; }
    .sub { font-size: 14.5px; }
    .cta { font-size: 21px; padding: 15px 20px; }
    .watermark { font-size: 200px; }
  }

  /* Mobile: crest + headline on one row, then copy, then full-width button */
  @media (max-width: 640px) {
    .strip {
      grid-template-columns: auto 1fr;
      grid-template-areas:
        "crest copy"
        "cta   cta";
      row-gap: 16px;
      column-gap: 16px;
      padding: 20px 18px 22px;
    }
    .crest { grid-area: crest; width: 64px; height: 64px; align-self: start; }
    .rule { display: none; }
    .copy { grid-area: copy; }
    .headline { font-size: 40px; }
    .sub { font-size: 14px; margin-top: 6px; }
    .cta { grid-area: cta; justify-content: space-between; width: 100%; font-size: 22px; padding: 16px 18px; }
    .watermark { font-size: 150px; right: -30px; top: 34%; }
  }

  @media (max-width: 360px) {
    .crest { width: 52px; height: 52px; }
    .headline { font-size: 34px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .strip.ready .edge { animation: none; transform: scaleX(1); }
    .watermark, .cta svg { transition: none; }
  }
</style>
</head>

<script>
/* ---------------------------------------------------------------
   SETTINGS
   DESKTOP_URL / MOBILE_URL: where the strip sends visitors.
   Wix serves the desktop and mobile layouts of a page from the
   same address, so both point to the tryout page by default.
   If the mobile version ever lives at its own address, change
   MOBILE_URL only.
   LINK_TARGET: '_top' opens the page in the same tab (replaces
   the homepage). Use '_blank' to open a new tab instead.
---------------------------------------------------------------- */
const DESKTOP_URL = 'https://www.virginiavalorfc.org/2026-2027tryoutschedule';
const MOBILE_URL  = 'https://www.virginiavalorfc.org/2026-2027tryoutschedule';
const LINK_TARGET = '_top';

(function () {
  // Decide by the visitor's device, not the embed width (the Wix box is narrow on both).
  const ua = navigator.userAgent || '';
  const isMobile =
    /Mobi|Android|iPhone|iPad|iPod/i.test(ua) ||
    (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua)) ||
    Math.min(screen.width, screen.height) < 768;

  const link = document.getElementById('join');
  link.href = isMobile ? MOBILE_URL : DESKTOP_URL;
  link.target = LINK_TARGET;
  if (LINK_TARGET === '_blank') link.rel = 'noopener';

  const show = () => link.classList.add('ready');
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(show);
    setTimeout(show, 800);
  } else {
    show();
  }
})();
</script>
