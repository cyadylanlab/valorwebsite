<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hudl Camera Dashboard | Virginia Valor FC</title>
<style>
  :root { --ink: #0d0d0d; --paper: #fff; --gold: #8B7A4C; --brass: #C8B98F; --muted: #555; --hair: #d9d9d9;
          --green: #1B7F3B; --red: #C62828; --sans: Arial, Helvetica, sans-serif; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 18px/1.4 var(--sans); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }
  .rqgrid, .hgrid { display: grid; gap: 0; }
  .big { font-size: 32px; font-weight: 700; line-height: 1.1; }
  .muted { color: var(--muted); }

  .mast { background: var(--ink); color: #fff; padding: 16px 0 14px; border-bottom: 3px solid var(--gold); }
  .brand { display: flex; align-items: center; gap: 12px; }
  .crest { height: 44px; width: auto; display: block; flex: 0 0 auto; }
  .club { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--brass); font-weight: 700; }
  .mast h1 { margin: 2px 0 0; font-size: 26px; line-height: 1.1; }
  .who { display: flex; justify-content: space-between; gap: 12px; margin-top: 14px; padding-top: 12px; border-top: 1px solid #2d2d2d; color: #e6e6e6; font-size: 15px; }
  .linkbtn { background: none; border: 0; padding: 6px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; color: var(--brass); }

  .signin { padding: 0 0 48px; display: flex; justify-content: center; }
  .tag { width: 100%; max-width: 420px; margin-top: 34px; background: #fff; border: 1px solid var(--hair); border-top: 10px solid var(--gold); padding: 26px 22px 24px; }
  .tag .kicker { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
  .tag .word { display: block; width: 190px; max-width: 72%; height: auto; margin: 14px 0 10px; }
  .tag h2 { margin: 0; padding: 0; border: 0; font-size: 26px; line-height: 1.1; }
  .tag .sub { margin: 10px 0 22px; color: var(--muted); }
  .rule { height: 1px; background: var(--hair); margin: 0 0 20px; }
  label { display: block; font-weight: 700; margin-bottom: 8px; }
  input[type="email"] { width: 100%; min-height: 56px; padding: 10px 12px; font: 400 18px var(--sans); border: 2px solid var(--ink); border-radius: 0; }
  .btn { display: block; width: 100%; min-height: 56px; margin-top: 14px; border: 2px solid var(--ink); border-radius: 0;
    background: var(--ink); color: #fff; cursor: pointer; font-weight: 700; }
  .btn:disabled { opacity: .45; }
  .err { margin: 16px 0 0; padding: 10px 0 10px 12px; border-left: 5px solid var(--red); color: var(--red); font-weight: 700; }
  .err:empty { display: none; }
  .tagfoot { display: flex; align-items: center; justify-content: space-between; gap: 14px;
    margin: 22px 0 0; padding-top: 14px; border-top: 1px solid var(--hair); font-size: 14px; color: var(--muted); }
  .hudl { height: 18px; width: auto; display: block; flex: 0 0 auto; }
  .foot { display: flex; align-items: center; gap: 10px; }
  .foot .hudl { height: 16px; }

  section { margin: 0 0 36px; }
  h2 { margin: 36px 0 12px; padding-top: 8px; border-top: 4px solid var(--ink); font-size: 18px; font-weight: 700; }
  h2.alert { border-top-color: var(--red); color: var(--red); }
  h2.good { border-top-color: var(--green); color: var(--green); }
  .tw { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 700; padding: 8px 10px 8px 0; border-bottom: 2px solid var(--ink); vertical-align: bottom; }
  td { padding: 11px 10px 11px 0; border-bottom: 1px solid var(--hair); vertical-align: top; }
  tbody tr:nth-child(even) td { background: #faf9f6; }
  th.n, td.n { text-align: right; padding-right: 0; padding-left: 10px; }
  td.n { white-space: nowrap; }
  td.k { white-space: nowrap; font-weight: 700; }
  .flag { font-weight: 700; color: var(--red); }
  .in { font-weight: 700; color: var(--green); }
  .out { font-weight: 700; color: var(--red); }
  .off { font-weight: 700; color: var(--muted); }
  .list { margin: 0; padding: 0; list-style: none; }
  .list li { padding: 10px 0; border-bottom: 1px solid var(--hair); }
  .list li:first-child { border-top: 1px solid var(--hair); }
  details { margin-top: 10px; }
  summary { cursor: pointer; padding: 6px 0; text-decoration: underline; text-underline-offset: 3px; }
  .hfilter { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 8px; }
  .hfilter input { flex: 1 1 220px; min-height: 48px; padding: 8px 12px; font: 400 16px var(--sans); border: 2px solid var(--ink); border-radius: 0; }
  .hcount { color: var(--muted); font-size: 15px; }
  .hrow { padding: 14px 0; border-bottom: 1px solid var(--hair); }
  .hhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .hcam { font-size: 19px; font-weight: 700; }
  .hdate { font-weight: 700; }
  .hwhere { margin-top: 2px; color: var(--muted); }
  .hgame { margin-top: 6px; padding-left: 12px; border-left: 3px solid var(--brass); }
  .hwho { margin-top: 8px; }
  .hwho span { display: inline-block; margin-right: 16px; }
  .hnote { margin-top: 6px; color: var(--muted); font-size: 14px; }
  .banner { margin: 16px 0 0; padding: 12px 14px; border-left: 8px solid var(--gold); background: #faf7f0; }
  .rq { padding: 12px 0; border-bottom: 1px solid var(--hair); }
  .rqrow { display: flex; gap: 10px; margin-top: 10px; }
  .rqrow select { flex: 0 0 38%; }
  .rqrow .btn { margin-top: 0; min-height: 52px; }
  select { min-height: 52px; padding: 6px 10px; font: 400 18px var(--sans); border: 2px solid var(--ink); border-radius: 0; background: #fff; color: var(--ink); }
  details input[type="text"] { width: 100%; min-height: 48px; padding: 8px 10px; font: 400 16px var(--sans); border: 2px solid var(--ink); border-radius: 0; margin: 6px 0; }
  .btn.go { background: var(--green); border-color: var(--green); }
  .btn.stop { background: var(--red); border-color: var(--red); }
  section .btn { margin-top: 12px; }
  .foot { margin: 28px 0 48px; color: var(--muted); }

  /* Desktop. The phone layout above stays untouched below 900px. */
  @media (min-width: 900px) {
    body { font-size: 17px; }
    .wrap { max-width: 1240px; padding: 0 28px; }
    main.wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 0 40px; align-items: start; }
    main.wrap > .span { grid-column: 1 / -1; }
    section { margin: 0 0 30px; }
    h2 { margin: 30px 0 14px; font-size: 19px; }
    .crest { height: 54px; }
    .mast h1 { font-size: 30px; }
    .rqgrid { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 0 32px; }
    .hgrid { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 0 32px; }
    .btn.wide { max-width: 420px; }
    .tw { max-width: 640px; }
    .list, section > p { max-width: 760px; }
    .hfilter input { flex: 0 1 420px; }
    td, th { padding-right: 18px; }
  }
  @media (min-width: 1400px) {
    .wrap { max-width: 1400px; }
    .hgrid { grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); }
  }
  .linkbtn { padding: 11px 6px; min-height: 44px; }
  summary { padding: 11px 0; min-height: 44px; }
  button, summary, select, input { touch-action: manipulation; -webkit-tap-highlight-color: rgba(139,122,76,.25); }
  .toast { padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
</style>
</head>

          games: [{ time: '2:00 PM', team: 'ECNL RL B2012/13', coach: 'Cory Fick', division: 'ECNL RL' }, { time: '3:45 PM', team: 'ECNL RL B2009/10', coach: 'Cory Fick', division: 'ECNL RL' }] },
        { date: d(3), field: 'Fair Oaks Field 1', requestedBy: ['Rob Olson'], suggested: 'Hudl 2', free: ['Hudl 2', 'Hudl 4'],
          games: [{ time: '9:00 AM', team: 'NCSL G2010/11', coach: 'Rob Olson', division: 'NCSL' }] }],
      log: [
        { date: d(-1), camera: 'Hudl 2', field: 'Robinson HS Stadium', division: 'ECNL RL', state: 'returned',
          outBy: 'Oscar Hernandez', outAt: '11/10/26 8:12 AM', inBy: 'Cory Fick', inAt: '11/10/26 2:40 PM', note: '',
          games: [{ time: '9:00 AM', team: 'ECNL RL G2012/13', coach: 'Oscar Hernandez', opponent: 'BRYC Academy' },
                  { time: '11:00 AM', team: 'ECNL RL G2011/12', coach: 'Cory Fick', opponent: 'BRYC Academy' }] },
        { date: d(-8), camera: 'Hudl 5', field: 'Westfield High School Stadium', division: 'ECNL RL', state: 'open',
          outBy: 'Juan Vasquez', outAt: '11/3/26 1:20 PM', inBy: '', inAt: '', note: 'Left in the equipment room.',
          games: [{ time: '2:00 PM', team: 'ECNL RL B2009/10', coach: 'Juan Vasquez', opponent: 'Great Falls Reston' }] },
        { date: d(-9), camera: 'Hudl 7', field: 'EC Lawrence Park Field #3A', division: 'NCSL', state: 'none',
          outBy: '', outAt: '', inBy: '', inAt: '', note: '',
          games: [{ time: '8:00 AM', team: 'B2017/18 Silver', coach: 'Alec Mitchell', opponent: 'GFR U9B Gold' }] }],
      recent: [{ at: '8:12 AM', name: 'Oscar Hernandez', camera: 'Hudl 2', date: 'today', action: 'pickup', note: '' }]
    } };
  }

  // ---------- sign in ----------
  function renderSignIn() {
    var input = h('input', { type: 'email', id: 'em', autocomplete: 'email', inputmode: 'email', autocapitalize: 'off', spellcheck: 'false', required: true, value: email || '' });
    var btn = h('button', { type: 'submit', class: 'btn' }, 'Continue');
    var form = h('form', { onsubmit: function (e) {
      e.preventDefault();
      email = input.value.trim().toLowerCase();
      if (!email) return;
      btn.disabled = true; btn.textContent = 'Checking';
      load(true);
    } }, h('label', { for: 'em' }, 'Your Valor email'), input, btn, h('p', { class: 'err', role: 'alert' }, signInError));
    app.replaceChildren(masthead(false), h('main', { class: 'wrap signin' }, h('div', { class: 'tag' },
      h('div', { class: 'kicker' }, 'Club admins'),
      h('img', { class: 'word', src: VALOR_WORD, alt: 'Virginia Valor FC' }),
      h('h2', null, 'Camera dashboard'),
      h('p', { class: 'sub' }, 'Requests waiting, who has what, and who returns it.'),
      h('div', { class: 'rule' }),
      form,
      h('div', { class: 'tagfoot' }, h('span', null, 'Same sign in as the coach page.'), hudlMark()))));
  }
  function hudlMark() {
    return h('img', { class: 'hudl', src: HUDL_LOGO, alt: 'Hudl' });
  }
  function crest() { return h('img', { class: 'crest', src: VALOR_CREST, alt: 'Virginia Valor FC' }); }
  function masthead(signedIn) {
    return h('header', { class: 'mast' }, h('div', { class: 'wrap' },
      h('div', { class: 'brand' }, crest(), signedIn ? h('div', null,
        h('div', { class: 'club' }, 'Virginia Valor FC'),
        h('h1', null, 'Hudl camera dashboard')) : null),
      signedIn ? h('div', { class: 'who' }, h('span', null, 'Updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })),
        h('span', null, h('button', { class: 'linkbtn', onclick: function () { load(false); } }, 'Refresh'), '  ', h('button', { class: 'linkbtn', onclick: signOut }, 'Switch'))) : null));
  }
  function load(fromSignIn) {
    api().then(function (r) {
      if (r && r.ok) { dash = r.dash; signInError = ''; store('hudl_email', email); render(); }
      else {
        signInError = (r && r.message) || 'Could not sign in.';
        if (fromSignIn || !dash) { dash = null; store('hudl_email', null); renderSignIn(); }
      }
    }).catch(function () {
      signInError = 'Could not reach the server. Check your connection and try again.';
      if (!dash) renderSignIn();
    });
  }
  function signOut() { store('hudl_email', null); email = null; dash = null; signInError = ''; renderSignIn(); }

  // ---------- dashboard ----------
  function table(cols, rows) {
    return h('div', { class: 'tw' }, h('table', null,
      h('thead', null, h('tr', null, cols.map(function (c) { return h('th', { class: c.n ? 'n' : '' }, c.t); }))),
      h('tbody', null, rows.map(function (r) {
        return h('tr', null, r.map(function (cell, i) {
          var cls = (cols[i].n ? 'n' : '') + (cols[i].k ? ' k' : '');
          return h('td', { class: cls.trim() }, cell);
        }));
      }))));
  }

  var msg = '', working = false, hq = '', hShown = 25;
  function send(payload) {
    if (working) return;
    working = true;
    api(payload).then(function (r) {
      working = false;
      if (r && r.dash) dash = r.dash;
      msg = (r && r.message) || '';
      render();
    }).catch(function () { working = false; msg = 'Could not reach the server. Nothing was saved.'; render(); });
  }

  function requestCards() {
    var reqs = dash.requests || [];
    if (!reqs.length) return h('p', { class: 'in' }, 'No requests waiting.');
    var cards = reqs.map(function (g) {
      var sel = h('select', { 'aria-label': 'Camera for ' + g.field }, g.free.map(function (c) { return h('option', { value: c, selected: c === g.suggested }, c); }));
      var note = h('input', { type: 'text', maxlength: '200', placeholder: 'Reason (optional)', 'aria-label': 'Reason for declining' });
      return h('article', { class: 'rq' },
        h('div', null, h('b', null, dayText(g.date)), '  ', g.field),
        g.games.map(function (x) { return h('div', { class: 'muted' }, x.time + ', ' + x.team + ', ' + x.coach); }),
        g.free.length
          ? h('div', { class: 'rqrow' }, sel, h('button', { class: 'btn go', onclick: function () { send({ action: 'assign', date: g.date, field: g.field, camera: sel.value }); } }, 'Assign'))
          : h('p', { class: 'flag' }, 'No cameras are free that day.'),
        h('details', null, h('summary', null, 'Decline'), note,
          h('button', { class: 'btn stop', onclick: function () { send({ action: 'decline', date: g.date, field: g.field, note: note.value }); } }, 'Decline request')));
    });
    return [h('div', { class: 'rqgrid' }, cards), h('button', { class: 'btn wide', onclick: function () { send({ action: 'assign_all' }); } }, 'Assign all with suggested cameras')];
  }

  function render() {
    var out = [];
    if (dash.emailMode && dash.emailMode !== 'on') {
      out.push(h('div', { class: 'banner span' }, h('b', null, dash.emailMode === 'off' ? 'Email is off.' : 'Email is in test mode.'), ' ',
        dash.emailMode === 'off' ? 'Nothing is being sent to anyone.' : 'Everything goes to admins instead of coaches.',
        ' Change Email mode on the Settings tab when you are ready.'));
    }

    // Requests
    var dl = (dash.closes || []).map(function (c) { return dayText(c.date) + ': ' + (c.closed ? 'closed' : 'closes ' + c.text); });
    out.push(h('section', { class: 'span' }, h('h2', { class: (dash.requests || []).length ? 'alert' : 'good' }, 'Camera requests'),
      dash.mode === 'selfserve' ? h('p', { class: 'muted' }, 'Camera mode is Self-serve. Coaches pick their own cameras.') : null,
      msg ? h('p', { class: 'in', role: 'status' }, msg) : null,
      requestCards(),
      dl.length ? h('p', { class: 'muted' }, 'Deadlines. ' + dl.join('. ') + '.') : null));

    // Needs attention
    var items = [];
    dash.open.forEach(function (o) {
      items.push(h('li', null, h('span', { class: 'flag' }, o.camera + ' has not been returned. '), 'With ' + o.by + ' since ' + o.at + '.'));
    });
    if (dash.needsCamera.length) {
      items.push(h('li', null, h('span', { class: 'flag' }, dash.needsCamera.length + ' game' + (dash.needsCamera.length === 1 ? '' : 's') + ' in the next 14 days with no camera. '),
        'No request has come in for these yet.',
        h('details', null, h('summary', null, 'See the games'),
          table([{ t: 'Day' }, { t: 'Game' }], dash.needsCamera.map(function (g) {
            return [dayText(g.date), g.time + ', ' + g.field + ', ' + g.team + ', ' + g.coach];
          })))));
    }
    out.push(h('section', { class: 'span' }, h('h2', { class: items.length ? 'alert' : 'good' }, 'Needs attention'),
      items.length ? h('ul', { class: 'list' }, items) : h('p', { class: 'in' }, 'Nothing needs attention.')));

    // Right now
    out.push(h('section', null, h('h2', null, 'Right now'),
      table([{ t: 'Camera', k: true }, { t: 'Status' }, { t: 'Today' }], dash.now.map(function (c) {
        var status = !c.active ? h('span', { class: 'off' }, 'Out of service') : c.holder ? h('span', { class: 'out' }, 'Out with ' + c.holder + ' since ' + c.since) : h('span', { class: 'in' }, 'Available');
        var today = c.today ? c.today.field + ', ' + c.today.firstTime + (c.today.lastTime !== c.today.firstTime ? ' to ' + c.today.lastTime : '') : 'Not scheduled';
        return [c.camera, status, today];
      }))));

    // Next days
    if (dash.upcoming.length) {
      out.push(h('section', null, h('h2', null, 'Coming up'),
        table([{ t: 'Day', k: true }, { t: 'Games', n: true }, { t: 'No camera', n: true }], dash.upcoming.map(function (u) {
          return [dayText(u.date), u.games, u.withoutCamera ? h('span', { class: 'flag' }, u.withoutCamera) : 0];
        }))));
    }

    // History
    var tot = dash.history.reduce(function (a, r) {
      a.c += r.cameras; a.p += r.pickedUp; a.r += r.returned; return a;
    }, { c: 0, p: 0, r: 0 });
    out.push(h('section', null, h('h2', null, 'Last 60 days'),
      dash.history.length
        ? [h('p', null, tot.c + ' camera days. ' + tot.p + ' picked up, ' + tot.r + ' returned.'),
           table([{ t: 'Day', k: true }, { t: 'Picked up', n: true }, { t: 'Returned', n: true }, { t: 'Missed', n: true }],
             dash.history.slice(0, 14).map(function (r) {
               return [dayText(r.date), r.pickedUp + ' of ' + r.cameras, r.returned + ' of ' + r.cameras, r.noRecord || r.notReturned ? h('span', { class: 'flag' }, r.noRecord + r.notReturned) : 0];
             }))]
        : h('p', null, 'History builds as coaches start checking cameras out and in.')));

    // Coaches
    out.push(h('section', null, h('h2', null, 'Coaches'),
      dash.coaches.length
        ? table([{ t: 'Coach' }, { t: 'Done', n: true }, { t: 'Covered', n: true }, { t: 'Missed', n: true }],
            dash.coaches.map(function (c) { return [c.name, c.doneByThem + ' of ' + c.duties, c.coveredByOthers, c.missed ? h('span', { class: 'flag' }, c.missed) : 0]; }))
        : h('p', null, 'No past games with camera duties yet.'),
      dash.coaches.length ? h('p', { class: 'muted' }, 'Duties are pick ups and returns. Covered means someone else did it.') : null));

    // Recent
    var ACT = { pickup: 'picked up', 'return': 'returned', undo_pickup: 'undid pick up of', undo_return: 'undid return of', claim: 'claimed', note: 'added a note on' };
    // Checkout history
    var log = dash.log || [];
    var hBody = h('div');
    var hCount = h('div', { class: 'hcount' });
    var hInput = h('input', { type: 'search', placeholder: 'Filter by coach, camera, team or field', 'aria-label': 'Filter history', value: hq });
    var shown = hShown;
    function drawHistory() {
      var q = hq.trim().toLowerCase();
      var rows = log.filter(function (r) {
        if (!q) return true;
        var hay = [r.camera, r.field, r.division, r.outBy, r.inBy, r.date].concat(
          r.games.map(function (g) { return g.team + ' ' + g.coach + ' ' + (g.opponent || ''); })).join(' ').toLowerCase();
        return hay.indexOf(q) >= 0;
      });
      hCount.textContent = rows.length + (rows.length === 1 ? ' checkout ' : ' checkouts ') +
        (q ? (rows.length === 1 ? 'matches your filter' : 'match your filter') : 'on record');
      var slice = rows.slice(0, shown);
      var items = slice.map(function (r) {
        var state = r.state === 'returned' ? h('span', { class: 'in' }, 'Returned')
                  : r.state === 'open' ? h('span', { class: 'out' }, 'No return recorded')
                  : h('span', { class: 'off' }, 'No record');
        return h('article', { class: 'hrow' },
          h('div', { class: 'hhead' }, h('span', { class: 'hcam' }, r.camera), h('span', { class: 'hdate' }, dayText(r.date)), state),
          h('div', { class: 'hwhere' }, r.field + (r.division ? ', ' + r.division : '')),
          r.games.map(function (g) {
            return h('div', { class: 'hgame' }, h('b', null, g.time || 'All weekend'), '  ', g.team,
              h('div', { class: 'muted' }, g.coach + (g.opponent ? ' vs ' + g.opponent : '')));
          }),
          h('div', { class: 'hwho' },
            h('span', null, h('b', null, 'Out: '), r.outBy ? r.outBy + (r.outAt ? ', ' + r.outAt : '') : 'not recorded'),
            h('span', null, h('b', null, 'In: '), r.inBy ? r.inBy + (r.inAt ? ', ' + r.inAt : '') : 'not recorded')),
          r.note ? h('div', { class: 'hnote' }, r.note) : null);
      });
      hBody.replaceChildren(h('div', { class: 'hgrid' }, items));
      if (rows.length > shown) hBody.appendChild(h('button', { class: 'btn wide', onclick: function () { shown += 25; hShown = shown; drawHistory(); } }, 'Show 25 more'));
      if (!rows.length) hBody.replaceChildren(h('p', { class: 'muted' }, 'Nothing matches that filter.'));
    }
    hInput.addEventListener('input', function () { hq = hInput.value; shown = 25; hShown = 25; drawHistory(); });
    drawHistory();
    out.push(h('section', { class: 'span' }, h('h2', null, 'Checkout history'),
      h('div', { class: 'hfilter' }, hInput, hCount), hBody));

    out.push(h('section', { class: 'span' }, h('h2', null, 'Recent activity'),
      dash.recent.length
        ? h('ul', { class: 'list' }, dash.recent.map(function (r) {
            return h('li', null, r.at + '  ' + r.name + ' ' + (ACT[r.action] || r.action) + ' ' + r.camera + (r.note ? ' (' + r.note + ')' : ''));
          }))
        : h('p', null, 'No activity yet.')));

    app.replaceChildren(masthead(true), h('main', { class: 'wrap' }, out,
      h('div', { class: 'foot span' }, hudlMark(), h('span', null, DEMO ? 'Sample data.' : 'Valor cameras are Hudl Focus units.'))));
  }

  setInterval(function () { if (dash && !document.hidden) load(false); }, 120000);
  if (DEMO) email = 'demo@example.org';
  if (email) load(false); else renderSignIn();
})();
</script>
</body>
</html>
