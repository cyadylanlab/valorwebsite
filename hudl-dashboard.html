<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camera dashboard | Virginia Valor FC</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#15140f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f3f0e7; --soft:#a8a295; --faint:#7b756b;
    --page:#111110; --card:#1b1a17; --line:#302d27; --raise:#232119;
    --gold:#C8B98F; --deep:#8B7A4C; --brass:#C8B98F; --sand:#232119;
    --go:#49b771; --gobg:rgba(73,183,113,.13); --stop:#e8626a; --stopbg:rgba(232,98,106,.14);
    --sans:'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --sh:0 1px 0 rgba(255,255,255,.03) inset, 0 10px 26px -14px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--page);color:var(--ink);font:400 17px/1.45 var(--sans);
    -webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:4px}
  button,summary,select,input{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:1340px;margin:0 auto;padding:0 18px}
  .muted{color:var(--soft)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* masthead */
  .mast{background:#15140f;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:40}
  .mrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0}
  .word{height:32px;width:auto;display:block}
  .me{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--soft)}
  .me b{color:var(--ink);font-size:15px;font-weight:600}
  .ghostbtn{background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:8px 14px;
    font-size:14px;font-weight:600;cursor:pointer;color:var(--gold);min-height:40px}
  .ghostbtn:active{transform:scale(.97)}

  /* status band */
  .band{margin:18px 0 0;padding:16px 18px;border-radius:14px;box-shadow:var(--sh);background:var(--card);border:1px solid var(--line);
    border-left:6px solid var(--brass);display:flex;align-items:center;gap:14px}
  .band .dot{width:12px;height:12px;border-radius:50%;background:var(--brass);flex:0 0 auto}
  .band h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
  .band p{margin:3px 0 0;color:var(--soft);font-size:15px}
  .band.go{border-left-color:var(--go);background:linear-gradient(100deg,var(--gobg),var(--card) 62%)}
  .band.go .dot{background:var(--go)}
  .band.stop{border-left-color:var(--stop);background:linear-gradient(100deg,var(--stopbg),var(--card) 62%)}
  .band.stop .dot{background:var(--stop)}
  .band.todo{border-left-color:var(--gold);background:linear-gradient(100deg,var(--sand),var(--card) 62%)}
  .band.todo .dot{background:var(--gold)}

  h2{margin:34px 0 14px;font-size:12px;letter-spacing:.17em;text-transform:uppercase;color:var(--gold);
    font-weight:800;font-family:var(--mono)}
  .h2row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:34px 0 14px}
  .h2row h2{margin:0}

  /* jobs */
  .jobs{display:grid;gap:14px}
  .job{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);overflow:hidden;
    border-top:4px solid var(--brass);animation:rise .32s ease both}
  .job.now{border-top-color:var(--gold)}
  .job.late{border-top-color:var(--stop)}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .jtop{display:flex;gap:16px;padding:16px 18px 0;align-items:flex-start}
  .jshot{flex:0 0 96px;height:58px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 130%, rgba(200,185,143,.18), rgba(255,255,255,0) 72%);border-radius:10px;border:1px solid var(--line)}
  .jshot img{width:84px;height:auto;display:block}
  .jmeta{flex:1;min-width:0}
  .jnum{font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--gold)}
  .jmeta h3{margin:2px 0 0;font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
  .jwhen{margin:4px 0 0;color:var(--soft);font-size:15px}
  .jnote{margin:10px 18px 0;padding:10px 12px;background:var(--sand);border-radius:10px;
    font-size:14px;color:var(--soft)}
  .jact{padding:14px 18px 16px}
  .btn{display:block;width:100%;min-height:56px;border:0;border-radius:12px;background:var(--gold);color:#17160f;
    font-size:17px;font-weight:700;cursor:pointer;letter-spacing:.01em;transition:transform .12s ease, filter .12s ease}
  .btn:active{transform:scale(.985);filter:brightness(1.07)}
  .btn.go{background:var(--go)}
  .btn.stop{background:var(--stop)}
  .btn.quiet{background:transparent;color:var(--gold);border:1.5px solid var(--deep);min-height:50px;font-size:16px}
  .btn[disabled]{opacity:.45;cursor:default}
  .linkbtn{background:none;border:0;padding:9px 0;cursor:pointer;color:var(--gold);font-weight:600;
    font-size:14px;text-decoration:underline;text-underline-offset:3px;min-height:42px}
  details.more{margin-top:4px}
  details.more>summary{cursor:pointer;list-style:none;padding:9px 0;color:var(--gold);font-weight:600;
    font-size:14px;text-decoration:underline;text-underline-offset:3px;min-height:42px}
  details.more>summary::-webkit-details-marker{display:none}
  .fld{width:100%;min-height:50px;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;
    margin-bottom:9px;background:var(--raise);color:var(--ink)}
  .fld:focus{border-color:var(--gold)}
  .row2{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

  /* weeks */
  .weeks{display:grid;gap:14px}
  .wk{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);overflow:hidden}
  .wkhd{padding:13px 16px;background:var(--sand);border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .wkhd b{font-size:15px;font-weight:800;letter-spacing:-.01em}
  .wkhd span{font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.05em}
  .wkbody{padding:6px 16px 14px}
  .gm{padding:12px 0;border-bottom:1px solid var(--line)}
  .gm:last-child{border-bottom:0}
  .gmtop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
  .gmday{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;color:var(--gold)}
  .gmteam{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
  .gmwhere{margin:2px 0 0;color:var(--soft);font-size:14px;line-height:1.35}
  .gmcam{margin:3px 0 0;font-family:var(--mono);font-size:12px;letter-spacing:.05em;color:var(--faint)}
  .minibtn{margin-top:9px;background:transparent;border:1.5px solid var(--deep);color:var(--gold);
    border-radius:9px;padding:9px 13px;font-size:14px;font-weight:700;cursor:pointer;min-height:42px}
  .minibtn:active{transform:scale(.98)}
  .needs{display:grid;gap:12px}
  .need{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);
    border-radius:14px;box-shadow:var(--sh);padding:14px 16px}
  .need .gmtop{margin-bottom:6px}
  .askrow{display:flex;gap:10px;align-items:stretch;margin-top:12px;flex-wrap:wrap}
  .askrow .picker{flex:0 0 auto}
  .askrow .btn{flex:1;min-width:190px;min-height:48px;font-size:15px}
  .tally{margin:0 0 13px;font-family:var(--mono);font-size:13px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--faint)}
  .tally b{color:var(--ink);font-weight:600}
  .picker{background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:9px;
    padding:9px 11px;min-height:44px;max-width:100%}
  .tag{flex:0 0 auto;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.07em;
    text-transform:uppercase;padding:5px 9px;border-radius:7px;white-space:nowrap}
  .tag.go{background:var(--gobg);color:var(--go)}
  .tag.stop{background:var(--stopbg);color:var(--stop)}
  .tag.wait{background:var(--sand);color:var(--gold)}
  .tag.none{background:#2a2821;color:var(--soft)}
  .wkempty{padding:18px 16px;color:var(--faint);font-size:15px}
  .wk.quiet{box-shadow:none;background:transparent;border:1px dashed var(--line)}
  .wk.quiet .wkhd{background:transparent;border-bottom-color:transparent;padding-bottom:0}
  .wk.quiet .wkhd b{color:var(--faint);font-weight:600}
  .gmact{margin-top:10px}

  /* camera grid */
  .days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch;
    scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:9px 13px;
    cursor:pointer;min-height:48px;text-align:center;line-height:1.15;transition:all .14s ease}
  .day small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--faint)}
  .day b{font-size:15px;font-weight:700}
  .day[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#17160f}
  .day[aria-pressed="true"] small{color:#4a4126}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .cam{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:hidden;
    display:flex;flex-direction:column;border-top:4px solid #3a362d}
  .cam.free{border-top-color:var(--go)}
  .cam.busy{border-top-color:var(--stop)}
  .cam.mine{border-top-color:var(--gold)}
  .shot{position:relative;padding:16px 10px 2px;
    background:radial-gradient(ellipse at 50% 140%, rgba(200,185,143,.16), rgba(255,255,255,0) 70%)}
  .shot img{width:100%;max-width:88px;height:auto;display:block;margin:0 auto;
    filter:drop-shadow(0 5px 8px rgba(20,19,15,.15))}
  .cam.off .shot img{filter:grayscale(1) opacity(.4)}
  .cam.busy .shot img{filter:grayscale(.75) opacity(.72)}
  .num{position:absolute;top:8px;left:11px;font-family:var(--mono);font-weight:600;font-size:12px;
    letter-spacing:.05em;color:var(--ink)}
  .state{display:flex;align-items:center;gap:6px;padding:8px 12px 0;font-size:11px;font-weight:600;
    font-family:var(--mono);letter-spacing:.09em;text-transform:uppercase}
  .state i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:0 0 auto}
  .cam.free .state{color:var(--go)} .cam.free .state i{background:var(--go)}
  .cam.busy .state{color:var(--stop)} .cam.busy .state i{background:var(--stop)}
  .cam.mine .state{color:var(--gold)} .cam.mine .state i{background:var(--gold)}
  .cam.off .state{color:var(--faint)}
  .camact .flat.gold{color:var(--gold)}
  .who{padding:2px 11px 12px;font-size:13px;color:var(--soft);line-height:1.3;min-height:16px}
  .camact{padding:0 10px 11px;margin-top:auto}
  .camact .btn{min-height:44px;font-size:14px;border-radius:9px;line-height:1.2;padding:6px 8px;white-space:normal}
  .camact .flat{text-align:center;font-size:12px;color:var(--faint);padding:0 0 6px;
    font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase}

  /* sign in */
  .signin{display:flex;justify-content:center;padding:0 0 56px}
  .panel{width:100%;max-width:430px;margin-top:38px;background:var(--card);border:1px solid var(--line);border-radius:20px;
    box-shadow:0 28px 60px -28px rgba(0,0,0,.9);padding:34px 26px;text-align:center}
  .panel .crest{width:104px;height:auto;margin:0 auto 16px;display:block}
  .panel h1{margin:0 0 6px;font-size:27px;font-weight:800;letter-spacing:-.02em}
  .panel p{margin:0 0 24px;color:var(--soft)}
  .panel form{text-align:left}
  label{display:block;font-weight:700;margin-bottom:8px;font-size:15px}
  .panel .btn{margin-top:14px}
  .panel .shot{border-radius:12px;margin-bottom:18px;padding:10px}
  .panel .shot img{max-width:190px}
  .err{margin:14px 0 0;padding:11px 13px;background:var(--stopbg);color:var(--stop);font-weight:600;
    border-radius:10px;font-size:15px}
  .err:empty{display:none}

  .toast{position:fixed;left:16px;right:16px;bottom:18px;background:var(--gold);color:#17160f;padding:15px 17px;
    border-radius:13px;box-shadow:0 14px 34px -10px rgba(0,0,0,.5);z-index:60;font-weight:600;font-size:16px;
    animation:pop .26s ease both}
  @keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .foot{display:flex;align-items:center;gap:10px;margin:40px 0 46px;color:var(--faint);font-size:13px}
  .hudl{height:15px;width:auto;display:block;opacity:.9}

  @media (min-width:640px){
    .grid{grid-template-columns:repeat(3,1fr)}
    .jobs{grid-template-columns:repeat(2,1fr)}
  }
  @media (min-width:900px){
    .grid{grid-template-columns:repeat(6,1fr)}
    .needs{grid-template-columns:repeat(2,1fr)}
    .weeks{grid-template-columns:repeat(2,1fr);align-items:start}
  }
  @media (min-width:1150px){
    body{font-size:18px}
    .wrap{padding:0 28px}
    .word{height:40px}
    .band h1{font-size:25px}
    .grid{grid-template-columns:repeat(6,1fr)}   /* two rows of six */
    .needs{grid-template-columns:repeat(3,1fr)}
    .weeks{grid-template-columns:repeat(4,1fr)}
    .jobs{grid-template-columns:repeat(3,1fr)}
    .toast{left:auto;right:28px;max-width:430px}
  }

  /* dashboard only */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:18px}
  .tile{background:var(--card);border:1px solid var(--line);border-top:4px solid #3a362d;border-radius:14px;
    padding:15px 13px;text-align:center;box-shadow:var(--sh)}
  .tile.good{border-top-color:var(--go)} .tile.warn{border-top-color:var(--gold)} .tile.bad{border-top-color:var(--stop)}
  .tile .n{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.02em}
  .tile.good .n{color:var(--go)} .tile.warn .n{color:var(--gold)} .tile.bad .n{color:var(--stop)}
  .tile .l{font-size:12px;color:var(--soft);margin-top:7px;font-family:var(--mono);letter-spacing:.07em;
    text-transform:uppercase;line-height:1.3}
  .ask{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:14px;
    box-shadow:var(--sh);padding:15px 16px}
  .ask .who{padding:0;font-size:14px;color:var(--soft)}
  .ask .gl{margin:9px 0 0;padding:9px 0 0;border-top:1px solid var(--line)}
  .ask .gl div{padding:3px 0;font-size:15px}
  .ask .pref{margin-top:8px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--gold)}
  .ctrl{display:flex;gap:10px;margin-top:13px;flex-wrap:wrap}
  .ctrl .picker{flex:0 0 auto}
  .ctrl .btn{flex:1;min-width:160px;min-height:48px;font-size:15px}
  .list{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:0 16px}
  .line{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
  .line:last-child{border-bottom:0}
  .line .m{flex:1;min-width:0}
  .line b{font-size:16px;font-weight:700;letter-spacing:-.01em}
  .line .sub{margin:3px 0 0;color:var(--soft);font-size:14px;line-height:1.35}
  .line a{color:var(--gold);font-weight:700;text-underline-offset:3px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--faint);font-weight:600;padding:0 12px 9px 0;border-bottom:1px solid var(--line)}
  td{padding:11px 12px 11px 0;border-bottom:1px solid var(--line);font-size:15px}
  tr:last-child td{border-bottom:0}
  th.n,td.n{text-align:right;padding-right:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .bad{color:var(--stop);font-weight:700}
  .ok{color:var(--go);font-weight:700}
  .panelbox{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:16px}
  .hcard{background:var(--card);border:1px solid var(--line);border-left:4px solid #3a362d;border-radius:12px;
    padding:13px 15px}
  .hcard.ok{border-left-color:var(--go)} .hcard.open{border-left-color:var(--stop)}
  .hgrid{display:grid;gap:11px}
  .hfilter{display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin-bottom:13px}
  .hfilter input{flex:1 1 240px;min-height:48px;padding:10px 13px;border:1.5px solid var(--line);
    border-radius:10px;background:var(--raise);color:var(--ink)}
  details.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 16px;margin-bottom:11px}
  details.box>summary{cursor:pointer;list-style:none;padding:15px 0;font-weight:700;font-size:16px;color:var(--ink)}
  details.box>summary::-webkit-details-marker{display:none}
  details.box>summary::after{content:' +';color:var(--gold);font-family:var(--mono)}
  details.box[open]>summary::after{content:' -'}
  details.box .inner{padding:0 0 16px}
  .cam .camact{padding:0 10px 10px}
  .cam details.more>summary{font-size:11px;color:var(--faint);text-decoration:none;font-family:var(--mono);
    letter-spacing:.06em;text-transform:uppercase;padding:6px 0;min-height:34px;text-align:center}
  .cam details.more>summary:hover{color:var(--gold)}
  .cam details.more .fld{font-size:14px;min-height:42px;margin-top:4px}
  .subhead{margin:0 0 11px;font-family:var(--mono);font-size:11px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--gold);font-weight:600}
  @media (min-width:900px){
    .tiles{gap:16px}
    .tile{padding:20px 16px}
    .tile .n{font-size:44px}
    .asks{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .hgrid{grid-template-columns:repeat(2,1fr)}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:0 36px;align-items:start}
  }
  @media (min-width:1150px){
    .asks{grid-template-columns:repeat(3,1fr)}
    .hgrid{grid-template-columns:repeat(3,1fr)}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  'use strict';

  function store(k,v){
    try{ if(v===undefined) return localStorage.getItem(k);
      if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }
    catch(e){ if(v===undefined) return mem[k]||null; mem[k]=v; }

  function h(tag,props){
    var n=document.createElement(tag); props=props||{};
    Object.keys(props).forEach(function(k){
      var v=props[k];

      else if(k.indexOf('on')===0) n.addEventListener(k.slice(2),v);
      else if(v===true) n.setAttribute(k,'');

  function monthOf(k){ return MON[parseKey(k).getMonth()]; }
  function first(n){ return String(n||'').trim().split(/\s+/)[0]||''; }
  function camNum(c){ var m=String(c).match(/(\d+)/); return m?+m[1]:999; }
  function squash(x){ return String(x||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
  function placeName(field,team){
    var m=String(field||'').match(/^(.*?)\s*\(([^()]*)\)\s*$/);
    if(!m) return field;
    var inner=squash(m[2]), t=squash(team);
    if(t&&inner&&(inner.indexOf(t)>=0||t.indexOf(inner)>=0)) return m[1];
    return field;
  }

  function api(p){
    p=p||{action:'dashboard'}; p.email=email;
    if(DEMO) return Promise.resolve(demoApi(p));
    return fetch(CONFIG.API_URL,{method:'POST',body:JSON.stringify(p)}).then(function(r){return r.json();});
  }

  function renderSignIn(){
    var input=h('input',{type:'email',id:'em',class:'fld',autocomplete:'email',inputmode:'email',
      autocapitalize:'off',spellcheck:'false',required:true,value:email||''});
    var btn=h('button',{type:'submit',class:'btn'},'Continue');
    app.replaceChildren();
    add(app,[
      h('header',{class:'mast'},h('div',{class:'wrap'},h('div',{class:'mrow'},
        h('img',{class:'word',src:VALOR_WORD,alt:'Virginia Valor FC'})))),
      h('main',{class:'wrap signin'},h('div',{class:'panel'},
        h('img',{class:'crest',src:VALOR_CREST,alt:''}),
        h('h1',null,'Camera dashboard'),
        h('p',null,'For Craig and Dylan. Same sign in as the coach page.'),
        h('form',{onsubmit:function(e){
          e.preventDefault();
          email=input.value.trim().toLowerCase();
          if(!email) return;
          btn.disabled=true; btn.textContent='Checking';
          load(true);
        }}, h('label',{for:'em'},'Your Valor email'), input, btn,
            h('p',{class:'err',role:'alert'},signInError))))]);
  }

  function load(fromSignIn){
    api().then(function(r){
      if(r&&r.ok){ dash=r.dash; signInError=''; store('hudl_email',email); render(); }
      else{
        signInError=(r&&r.message)||'Could not sign in.';
        if(fromSignIn||!dash){ dash=null; store('hudl_email',null); renderSignIn(); }
      }
    }).catch(function(){
      signInError='Could not reach the server. Check your connection and try again.';
      if(!dash) renderSignIn();
    });
  }
  function signOut(){ store('hudl_email',null); email=null; dash=null; signInError=''; renderSignIn(); }
  function send(p){
    if(working) return;
    working=true;
    api(p).then(function(r){
      working=false;
      if(r&&r.dash) dash=r.dash;
      msg=(r&&r.message)||'';
      render();
      if(msg) setTimeout(function(){ msg=''; var t=document.querySelector('.toast'); if(t) t.remove(); },4200);
    }).catch(function(){ working=false; msg='Could not reach the server. Nothing was saved.'; render(); });
  }

  // ---------- pieces ----------
  function masthead(){
    return h('header',{class:'mast'},h('div',{class:'wrap'},h('div',{class:'mrow'},
      h('img',{class:'word',src:VALOR_WORD,alt:'Virginia Valor FC'}),
      h('div',{class:'me'},
        h('b',null,'Dashboard'),
        h('button',{class:'ghostbtn',onclick:function(){ load(false); }},'Refresh')))));
  }

  function headline(){
    var late=dash.open.length, asks=(dash.requests||[]).length;
    if(late&&asks) return {cls:'stop',h:late+(late===1?' camera is out past its day':' cameras are out past their day'),
      p:asks+(asks===1?' request is':' requests are')+' also waiting on you.'};
    if(late) return {cls:'stop',h:late===1?'A camera has not come back':late+' cameras have not come back',
      p:'Chase them below. Each one names who to ask.'};
    if(asks) return {cls:'todo',h:asks===1?'One request is waiting':asks+' requests are waiting',
      p:'Assign a camera to each and the coach gets an email.'};
    return {cls:'go',h:'Nothing is waiting on you',p:'Every camera is accounted for and no requests are open.'};
  }

  function tiles(){
    var out=dash.now.filter(function(c){ return c.holder; }).length;
    var asks=(dash.requests||[]).length;
    var late=dash.open.length;
    var gaps=dash.needsCamera.length;
    return h('div',{class:'tiles'},
      h('div',{class:'tile '+(asks?'warn':'good')},h('div',{class:'n'},asks),
        h('div',{class:'l'},asks===1?'request waiting':'requests waiting')),
      h('div',{class:'tile '+(late?'bad':'good')},h('div',{class:'n'},late),
        h('div',{class:'l'},'not returned')),
      h('div',{class:'tile '+(gaps?'warn':'good')},h('div',{class:'n'},gaps),
        h('div',{class:'l'},'games with no camera')));
  }

  // ---------- requests ----------
  function requestCards(){
    var reqs=dash.requests||[];
    if(!reqs.length) return h('p',{class:'muted',style:'margin:0;font-size:15px'},
      'No requests waiting. Coaches appear here when they ask for a camera.');
    var cards=reqs.map(function(g){
      var sel=h('select',{class:'picker','aria-label':'Camera for '+g.field},
        g.free.map(function(c){ return h('option',{value:c,selected:c===g.suggested},c); }));
      var note=h('input',{type:'text',class:'fld',maxlength:'200',placeholder:'Reason, optional'});
      return h('article',{class:'ask'},
        h('div',{class:'gmtop'},
          h('span',{class:'gmday'},dayName(g.date)),
          h('span',{class:'tag wait'},'Waiting')),
        h('b',{class:'gmteam'},placeName(g.field,g.games[0]&&g.games[0].team)),
        h('p',{class:'who'},'Asked by '+g.requestedBy.join(', ')),
        h('div',{class:'gl'},g.games.map(function(x){
          return h('div',null,h('span',{class:'mono'},x.time||'All event'),'  ',x.team,
            h('span',{class:'muted'},'  '+first(x.coach)));
        })),
        g.asked?h('p',{class:'pref'},'Asked for '+g.asked):null,
        g.free.length
          ? h('div',{class:'ctrl'},sel,h('button',{class:'btn',onclick:function(){
              send({action:'assign',date:g.date,field:g.field,camera:sel.value}); }},'Assign'))
          : h('p',{class:'pref bad'},'No camera is free that day.'),
        h('details',{class:'more'},h('summary',null,'Turn this one down'),note,
          h('button',{class:'btn stop',onclick:function(){
            send({action:'decline',date:g.date,field:g.field,note:note.value}); }},'Decline')));
    });
    return [h('div',{class:'asks'},cards),
      reqs.length>1?h('button',{class:'btn quiet',style:'margin-top:12px;max-width:420px',
        onclick:function(){ send({action:'assign_all'}); }},'Assign every one with the suggested camera'):null];
  }

  // ---------- chasing ----------
  function chasing(){
    var items=[];
    dash.open.forEach(function(o){
      var links=[h('span',null,'Chase ')];
      links.push(o.byEmail?h('a',{href:'mailto:'+o.byEmail+'?subject='+encodeURIComponent(o.camera+' has not been returned')},o.by)
                          :h('span',null,o.by));
      if(o.due){
        links.push(h('span',null,' or '));
        links.push(o.dueEmail?h('a',{href:'mailto:'+o.dueEmail+'?subject='+encodeURIComponent(o.camera+' has not been returned')},o.due)
                             :h('span',null,o.due));
        links.push(h('span',{class:'muted'},', last game that day'));
      }
      items.push(h('div',{class:'line'},
        h('span',{class:'m'},h('b',null,o.camera+' is still out'),
          h('div',{class:'sub'},'Signed out by '+o.by+', '+o.at+(o.field?'. '+placeName(o.field,''):'')),
          h('div',{class:'sub'},links)),
        h('span',{class:'tag stop'},'Overdue')));
    });
    if(dash.needsCamera.length){
      var byDay={};
      dash.needsCamera.forEach(function(g){ (byDay[g.date]=byDay[g.date]||[]).push(g); });
      Object.keys(byDay).sort().slice(0,6).forEach(function(d){
        var list=byDay[d];
        items.push(h('div',{class:'line'},
          h('span',{class:'m'},h('b',null,dayName(d)+': '+list.length+(list.length===1?' game':' games')+' with no camera'),
            h('div',{class:'sub'},list.slice(0,4).map(function(g){ return first(g.coach)+' · '+g.team; }).join('  |  ')
              +(list.length>4?'  and '+(list.length-4)+' more':''))),
          h('span',{class:'tag none'},'No request')));
      });
    }
    if(!items.length) return h('p',{class:'muted',style:'margin:0;font-size:15px'},
      'Nothing to chase. Every camera is back and every game is covered.');
    return h('div',{class:'list'},items);
  }

  // ---------- fleet ----------
  function dayOptions(){
    var out=[],seen={};
    for(var i=0;i<14;i++){ var d=addDays(dash.today,i); if(!seen[d]){seen[d]=1;out.push(d);} }
    return out;
  }
  function camOn(name,d){
    var hit=null;
    (dash.board||[]).forEach(function(b){
      if(b.camera!==name) return;
      if(b.date<=d&&(b.endDate||b.date)>=d) hit=b;
    });
    return hit;
  }

  function fleet(){
    if(!pickDay) pickDay=dash.today;
    var pills=h('div',{class:'days'},dayOptions().map(function(d){
      return h('button',{class:'day','aria-pressed':d===pickDay?'true':'false',
        onclick:function(){ pickDay=d; render(); }},
        h('small',null,d===dash.today?'Today':shortDay(d)),
        h('b',null,monthOf(d)+' '+dayNum(d)));
    }));
    var cams=(dash.cameras||[]).slice().sort(function(a,b){ return camNum(a.name)-camNum(b.name); });
    var nFree=0,nOut=0,nOff=0;
    var tiles=cams.map(function(cam){
      var live=null;
      dash.now.forEach(function(c){ if(c.camera===cam.name) live=c; });
      var bk=cam.active?camOn(cam.name,pickDay):null;
      var held=live&&live.holder&&pickDay<=dash.today;
      var cls,label,who='';
      if(!cam.active){ cls='off'; label='Out of service'; who=cam.notes||''; nOff++; }
      else if(held){ cls='busy'; label='Out'; who='With '+first(live.holder)+(live.until?', until '+dayName(live.until):''); nOut++; }
      else if(bk){ cls='mine'; label='Booked'; who=first(bk.coach)+' · '+placeName(bk.field,bk.team); nOut++; }
      else { cls='free'; label='In'; nFree++; }
      var noteFld=h('input',{type:'text',class:'fld',maxlength:'120',placeholder:'What is wrong with it',
        value:cam.active?'':(cam.notes||'')});
      return h('article',{class:'cam '+cls},
        h('div',{class:'shot'},h('span',{class:'num'},cam.name),h('img',{src:CAM_SHOT,alt:''})),
        h('div',{class:'state'},h('i'),label),
        h('div',{class:'who'},who),
        h('div',{class:'camact'},
          cam.active
            ? h('details',{class:'more'},h('summary',null,'Take out of service'),noteFld,
                h('button',{class:'btn stop',style:'min-height:42px;font-size:14px',onclick:function(){
                  send({action:'camera_state',camera:cam.name,outOfService:true,note:noteFld.value}); }},'Confirm'))
            : h('button',{class:'btn quiet',style:'min-height:40px;font-size:13px',onclick:function(){
                send({action:'camera_state',camera:cam.name,outOfService:false}); }},'Back in service')));
    });
    return [pills,
      h('p',{class:'tally'},h('b',null,nFree),' in  ',h('b',null,nOut),' committed',
        nOff?[' ',h('b',null,nOff),' out of service']:null),
      cams.length?h('div',{class:'grid'},tiles):h('p',{class:'muted'},'No cameras on the Cameras tab yet.')];
  }

  // ---------- history ----------
  function history(){
    var log=dash.log||[];
    var body=h('div'), count=h('span',{class:'muted sm'});
    var input=h('input',{type:'search',placeholder:'Filter by coach, camera, team, field or event',
      'aria-label':'Filter history',value:hq});
    function draw(){
      var q=hq.trim().toLowerCase();
      var rows=log.filter(function(r){
        if(!q) return true;
        var hay=[r.camera,r.field,r.division,r.outBy,r.inBy].concat(
          r.games.map(function(g){ return g.team+' '+g.coach+' '+(g.opponent||''); })).join(' ').toLowerCase();
        return hay.indexOf(q)>=0;
      });
      count.textContent=rows.length+(rows.length===1?' checkout':' checkouts')+(q?' match':' on record');
      var cards=rows.slice(0,hShown).map(function(r){
        var cls=r.state==='returned'?'ok':r.state==='open'?'open':'';
        var tag=r.state==='returned'?h('span',{class:'tag go'},'Back in')
               :r.state==='open'?h('span',{class:'tag stop'},'No sign in')
               :h('span',{class:'tag none'},'Unsigned');
        return h('article',{class:'hcard '+cls},
          h('div',{class:'gmtop'},h('span',{class:'gmday'},dayName(r.date)+'  '+r.camera),tag),
          h('p',{class:'gmwhere'},placeName(r.field,r.games[0]&&r.games[0].team)),
          h('div',{class:'gl'},r.games.map(function(g){
            return h('div',null,h('span',{class:'mono'},g.time||'All event'),'  ',g.team,
              h('span',{class:'muted'},'  '+first(g.coach)));
          })),
          h('p',{class:'gmcam'},'Out: '+(r.outBy?r.outBy+(r.outAt?', '+r.outAt:''):'nobody signed')),
          h('p',{class:'gmcam'},'In: '+(r.inBy?r.inBy+(r.inAt?', '+r.inAt:''):'nobody signed')),
          r.note?h('p',{class:'gmwhere'},r.note):null);
      });
      body.replaceChildren();
      if(!rows.length) add(body,h('p',{class:'muted'},'Nothing matches that filter.'));
      else{
        add(body,h('div',{class:'hgrid'},cards));
        if(rows.length>hShown) add(body,h('button',{class:'btn quiet',style:'margin-top:12px;max-width:320px',
          onclick:function(){ hShown+=18; draw(); }},'Show 18 more'));
      }
    }
    input.addEventListener('input',function(){ hq=input.value; hShown=18; draw(); });
    draw();
    return [h('div',{class:'hfilter'},input,count),body];
  }

      m=(p.camera||'A camera')+' assigned to '+p.field+'.';
    } else if(p.action==='decline'){
      demo.requests=demo.requests.filter(function(x){ return !(x.date===p.date&&x.field===p.field); });
      m='Declined. The coach has been told.';
    } else if(p.action==='assign_all'){ demo.requests=[]; m='Assigned every waiting request.'; }
    else if(p.action==='camera_state'){
      demo.cameras.forEach(function(c){ if(c.name===p.camera){ c.active=!p.outOfService; c.notes=p.outOfService?(p.note||''):''; } });
