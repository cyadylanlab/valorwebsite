<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Valor Way</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@600;700;800;900&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* Layout: Valor site template (white ground, ink rules, condensed caps). Sticky club bar, category rail on desktop, menu drawer on phones, stage selector that rewrites every cue to the coach's age group. Light-only by design to match virginiavalorfc.org. */
  :root{
    --white:#FFFFFF;
    --off:#F6F4EF;
    --line:#E3DFD5;
    --ink:#121216;
    --body:#3A3940;
    --soft:#67645D;
    --black:#0E0E10;
    --gold:#8B7A4C;
    --brass:#C8B98F;
    --onblack:#D9D6CE;
    --head:'Saira Extra Condensed',Impact,'Arial Narrow',sans-serif;
    --text:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    --maxw:1240px;
    --bar:64px;
    color-scheme:light;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html{scroll-behavior:smooth;scroll-padding-top:calc(var(--bar) + 16px)}
  body{background:var(--white);color:var(--body);font-family:var(--text);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
  img{display:block;max-width:100%}
  a{color:inherit}
  button{font:inherit;color:inherit}
  .label{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  /* ---------- CLUB BAR ---------- */
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--white);border-bottom:2px solid var(--ink)}
  .top-in{max-width:var(--maxw);margin:0 auto;padding:0 24px;height:var(--bar);display:flex;align-items:center;gap:16px}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex:0 0 auto}
  .brand img{width:38px;height:auto}
  .brand b{font-family:var(--head);font-weight:800;font-size:26px;line-height:1;text-transform:uppercase;color:var(--ink);letter-spacing:.01em}
  .brand b span{color:var(--gold)}
  .search{flex:1 1 auto;display:flex;justify-content:flex-end;min-width:0}
  .search label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .search input{width:100%;max-width:340px;height:42px;border:1.5px solid var(--line);border-radius:0;background:var(--off);padding:0 14px;font:500 15px var(--text);color:var(--ink);-webkit-appearance:none}
  .search input::placeholder{color:var(--soft)}
  .search input:focus{outline:none;border-color:var(--ink);background:var(--white)}
  .menu-btn{display:none;height:42px;padding:0 14px;border:2px solid var(--ink);background:var(--ink);color:var(--white);font:700 13px var(--text);letter-spacing:.14em;text-transform:uppercase;border-radius:0;cursor:pointer;flex:0 0 auto}

  /* ---------- SHELL ---------- */
  .shell{max-width:var(--maxw);margin:0 auto;padding:0 24px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:48px}
  .side{position:sticky;top:calc(var(--bar) + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - var(--bar));overflow-y:auto;padding-block:28px 40px}
  .side .label{margin:0 0 10px}
  .cats{list-style:none;border-top:2px solid var(--ink)}
  .cats a{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);text-decoration:none;font-family:var(--head);font-weight:700;font-size:21px;line-height:1.15;text-transform:uppercase;color:var(--soft);transition:color .15s ease}
  .cats a small{font-family:var(--text);font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--brass)}
  .cats a:hover{color:var(--ink)}
  .cats a[aria-current="page"]{color:var(--ink);box-shadow:inset 4px 0 0 var(--gold);padding-left:14px}
  main{min-width:0;padding-block:28px 72px}

  /* ---------- STAGE SELECTOR ---------- */
  .stagebar{border:2px solid var(--ink);margin:0 0 36px}
  .stagebar-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--ink);color:var(--white)}
  .stagebar-h .label{color:var(--brass)}
  .stagebar-h span:last-child{font-size:13px;color:var(--onblack)}
  .stages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
  .stages button{border:0;border-left:1px solid var(--line);background:var(--white);padding:10px 8px 11px;cursor:pointer;text-align:left;min-height:58px;transition:background .15s ease}
  .stages button:first-child{border-left:0}
  .stages button b{display:block;font-family:var(--head);font-weight:800;font-size:20px;line-height:1;text-transform:uppercase;color:var(--ink)}
  .stages button span{display:block;font-size:12px;font-weight:600;color:var(--soft);margin-top:4px;letter-spacing:.04em}
  .stages button:hover{background:var(--off)}
  .stages button[aria-pressed="true"]{background:var(--gold)}
  .stages button[aria-pressed="true"] b,.stages button[aria-pressed="true"] span{color:var(--white)}

  /* ---------- VIEW HEAD ---------- */
  .vhead{margin:0 0 30px;max-width:760px}
  .vhead h1{font-family:var(--head);font-weight:900;text-transform:uppercase;color:var(--ink);font-size:clamp(48px,7vw,88px);line-height:.88;margin:10px 0 0;text-wrap:balance}
  .vhead p.lead{font-size:clamp(17px,1.6vw,20px);margin:18px 0 0;color:var(--body)}
  .vhead p.lead b{color:var(--ink)}

  /* start hero */
  .hero{position:relative;overflow:hidden;margin:0 0 40px;padding:8px 0 28px;border-bottom:1px solid var(--line)}
  .hero .ghost{position:absolute;right:-.04em;bottom:-.16em;font-family:var(--head);font-weight:900;font-size:clamp(130px,22vw,300px);line-height:.8;text-transform:uppercase;color:transparent;-webkit-text-stroke:2px rgba(139,122,76,.16);pointer-events:none;user-select:none;white-space:nowrap}
  .hero h1{position:relative;font-family:var(--head);font-weight:900;text-transform:uppercase;color:var(--ink);font-size:clamp(60px,9.4vw,128px);line-height:.84;margin:14px 0 0}
  .hero h1 span{display:block}
  .hero h1 span:last-child{color:var(--gold)}
  .hero p{position:relative;max-width:560px;margin:22px 0 0;font-size:clamp(17px,1.7vw,20px)}
  .hero p b{color:var(--ink)}
  .chainbig{position:relative;margin:26px 0 0;font-family:var(--head);font-weight:800;font-size:clamp(20px,2.4vw,28px);line-height:1.2;text-transform:uppercase;color:var(--ink);letter-spacing:.02em}
  .chainbig i{font-style:normal;color:var(--gold);padding:0 .25em}

  /* ---------- BLOCKS ---------- */
  .block{margin:0 0 40px}
  .block>h2{font-family:var(--head);font-weight:800;text-transform:uppercase;color:var(--ink);font-size:clamp(25px,2.6vw,32px);line-height:1;margin:0 0 4px;letter-spacing:.01em;text-wrap:balance}
  .block .subh{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:22px 0 0}
  .block>p.sub{max-width:680px;margin:6px 0 0;color:var(--body)}
  .block>p.sub b{color:var(--ink)}
  .block>.rows,.block>.tablewrap,.block>.list,.block>.chain,.block>.stagegrid,.block>.cardset,.block>.rail,.block>.later{margin-top:18px}
  .prose{max-width:680px}
  .prose p+p{margin-top:12px}
  .prose b{color:var(--ink)}

  .chain{font-family:var(--head);font-weight:700;font-size:clamp(18px,1.9vw,22px);line-height:1.3;text-transform:uppercase;color:var(--ink);letter-spacing:.03em;border-left:3px solid var(--gold);padding:2px 0 2px 14px}
  .chain i{font-style:normal;color:var(--gold);padding:0 .4em}

  .list{max-width:700px;padding-left:1.2em}
  .list li{padding:4px 0 4px 4px}
  .list li::marker{color:var(--gold);font-weight:700}
  .list b{color:var(--ink)}

  /* ruled cue rows (template spec rows) */
  .rows{border-top:2px solid var(--ink)}
  .row{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;padding:13px 0;border-bottom:1px solid var(--line);align-items:baseline}
  .row dt{font-family:var(--head);font-weight:800;font-size:22px;line-height:1.05;text-transform:uppercase;color:var(--ink);letter-spacing:.015em}
  .row dt small{display:block;font-family:var(--text);font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--gold);margin-top:5px}
  .row dd{min-width:0;color:var(--ink)}
  .row dd .pair{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px}
  .row dd .pair+.pair{margin-top:6px}
  .row dd .pair span:first-child{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);padding-top:4px}
  .row dd .pair span:last-child{color:var(--body)}
  .row dd .pair.now span:last-child{color:var(--ink);font-weight:500}
  .row.hit dt{position:relative}
  .row.hit dt::before{content:"";position:absolute;left:-12px;top:1px;bottom:1px;width:3px;background:var(--gold)}
  .row dd .mark{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--white);background:var(--gold);padding:2px 7px;margin:0 0 6px}
  .later{font-size:14px;color:var(--soft);border-left:3px solid var(--line);padding:4px 0 4px 12px}
  .later b{font-family:var(--head);font-weight:700;font-size:17px;color:var(--body);letter-spacing:.02em}

  /* matrix */
  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-top:2px solid var(--ink)}
  table{width:100%;border-collapse:collapse;min-width:900px;font-size:14.5px;line-height:1.45}
  th,td{text-align:left;vertical-align:top;padding:12px 12px 12px 0;border-bottom:1px solid var(--line)}
  thead th{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);padding-top:12px}
  thead th small{display:block;color:var(--soft);letter-spacing:.08em;font-weight:600;margin-top:2px}
  tbody th{font-family:var(--head);font-weight:800;font-size:21px;line-height:1.05;text-transform:uppercase;color:var(--ink);width:150px}
  td{color:var(--ink)}
  td.na{color:var(--brass);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  .stack{display:none}
  .stack .scue{border-bottom:1px solid var(--line);padding:14px 0}
  .stack .scue h3{font-family:var(--head);font-weight:800;font-size:25px;line-height:1;text-transform:uppercase;color:var(--ink);margin:0 0 8px}
  .stack .scue p{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;font-size:15px;padding:3px 0;color:var(--ink)}
  .stack .scue p span:first-child{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);padding-top:3px}
  .stack .scue p.na span:last-child{color:var(--brass)}

  /* stage grid (one row per stage) */
  .stagegrid{border-top:2px solid var(--ink)}
  .sg{display:grid;grid-template-columns:170px minmax(0,1fr);gap:20px;padding:16px 0;border-bottom:1px solid var(--line)}
  .sg>div:first-child b{display:block;font-family:var(--head);font-weight:800;font-size:25px;line-height:1;text-transform:uppercase;color:var(--ink)}
  .sg>div:first-child span{display:block;font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--soft);margin-top:4px}
  .sg dl{display:grid;gap:8px;min-width:0}
  .sg dl div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px}
  .sg dt{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);padding-top:4px}
  .sg dd{color:var(--ink);min-width:0}
  .sg.single dl div{grid-template-columns:minmax(0,1fr)}
  .sg.dim{opacity:.42}
  .sg.mine{box-shadow:inset 4px 0 0 var(--gold);padding-left:16px;background:linear-gradient(90deg,rgba(200,185,143,.18),transparent 75%)}
  .sg.mine>div:first-child span::after{content:"  \00B7  Your stage";color:var(--gold);font-weight:700}

  /* pathway rail */
  .rail{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:2px solid var(--ink);align-items:end}
  .step{border-left:1px solid var(--line);padding:16px 14px 18px;display:flex;flex-direction:column;gap:6px;background:var(--white)}
  .step:first-child{border-left:0;padding-left:0}
  .step .n{font-family:var(--head);font-weight:900;font-size:56px;line-height:.8;color:var(--brass)}
  .step h3{font-family:var(--head);font-weight:800;font-size:28px;line-height:1;text-transform:uppercase;color:var(--ink)}
  .step .ages{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--gold)}
  .step p{font-size:14.5px;line-height:1.45;color:var(--body)}
  .step p b{color:var(--ink)}
  .rail .step:nth-child(1){padding-top:16px}
  .rail .step:nth-child(2){padding-top:44px}
  .rail .step:nth-child(3){padding-top:72px}
  .rail .step:nth-child(4){padding-top:100px}
  .rail .step:nth-child(5){padding-top:128px}
  .step.mine{background:var(--ink);padding-left:14px}
  .step.mine h3,.step.mine p b{color:var(--white)}
  .step.mine p{color:var(--onblack)}
  .step.mine .n{color:var(--gold)}
  .step.mine .ages{color:var(--brass)}

  /* static table rows (tiers etc.) */
  .grid3{border-top:2px solid var(--ink)}
  .g3{display:grid;grid-template-columns:180px repeat(3,minmax(0,1fr));gap:16px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px;color:var(--ink)}
  .g3.h{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);padding:10px 0}
  .g3>span:first-child{font-family:var(--head);font-weight:800;font-size:20px;line-height:1.1;text-transform:uppercase}
  .g3.h>span:first-child{font-family:var(--text);font-size:11px;font-weight:700}
  .g3 em{display:none;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}

  /* sideline cards */
  .cardset{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
  .card{background:var(--black);color:var(--onblack);padding:22px 22px 24px;position:relative;overflow:hidden;min-width:0}
  .card::after{content:"VALOR";position:absolute;right:-.05em;bottom:-.2em;font-family:var(--head);font-weight:900;font-size:120px;line-height:.8;color:transparent;-webkit-text-stroke:1.5px rgba(200,185,143,.14);pointer-events:none}
  .card header{display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(200,185,143,.35);padding-bottom:12px;margin-bottom:12px}
  .card header img{width:30px;height:auto}
  .card h3{font-family:var(--head);font-weight:800;font-size:28px;line-height:1;text-transform:uppercase;color:var(--white)}
  .card h3 small{display:block;font-family:var(--text);font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--brass);margin-top:4px}
  .card dl{position:relative;z-index:1;display:grid;gap:10px}
  .card dt{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
  .card dd{font-family:var(--head);font-weight:700;font-size:21px;line-height:1.2;text-transform:uppercase;color:var(--white);letter-spacing:.02em}
  .card.dim{opacity:.35}

  /* references */
  .refs{border-top:2px solid var(--ink)}
  .refs a{display:block;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none}
  .refs a b{display:block;font-family:var(--head);font-weight:800;font-size:22px;line-height:1.1;text-transform:uppercase;color:var(--ink);text-decoration:underline;text-decoration-color:var(--brass);text-decoration-thickness:2px;text-underline-offset:5px}
  .refs a span{display:block;font-size:15px;color:var(--body);margin-top:4px}
  .refs a:hover b{text-decoration-color:var(--ink)}

  /* start: find it fast */
  .jump{border-top:2px solid var(--ink)}
  .jump a{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;transition:background .15s ease}
  .jump a b{font-family:var(--head);font-weight:800;font-size:26px;line-height:1;text-transform:uppercase;color:var(--ink)}
  .jump a span{color:var(--body);font-size:15.5px}
  .jump a:hover{background:var(--off)}
  .jump a:hover b{color:var(--gold)}

  /* search results */
  .res-cat{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);text-decoration:underline;text-decoration-color:var(--brass);text-underline-offset:4px;display:inline-block;padding:4px 0}
  .empty{border-top:2px solid var(--ink);padding:24px 0;color:var(--soft)}
  mark{background:rgba(200,185,143,.55);color:inherit;padding:0 1px}

  /* back to all sections */
  .back{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 16px 0 12px;margin:0 0 22px;border:2px solid var(--ink);background:var(--white);color:var(--ink);text-decoration:none;font:700 13px var(--text);letter-spacing:.14em;text-transform:uppercase;transition:background .15s ease,color .15s ease}
  .back svg{width:14px;height:14px;flex:0 0 auto}
  .back:hover{background:var(--ink);color:var(--white)}
  .back.foot-back{margin:28px 0 0}

  /* pager */
  .pager{display:grid;grid-template-columns:1fr 1fr;gap:16px;border-top:2px solid var(--ink);padding-top:18px;margin-top:20px}
  .pager a{display:block;text-decoration:none;padding:6px 0;min-height:44px}
  .pager a span{display:block;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
  .pager a b{display:block;font-family:var(--head);font-weight:800;font-size:26px;line-height:1.05;text-transform:uppercase;color:var(--ink)}
  .pager a:hover b{color:var(--gold)}
  .pager .next{text-align:right}

  footer{border-top:1px solid var(--line);padding-block:30px}
  .foot{max-width:var(--maxw);margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .foot-l{display:flex;align-items:center;gap:14px}
  .foot-l img{width:44px;height:auto}
  .foot-l b{font-family:var(--head);font-weight:800;font-size:20px;text-transform:uppercase;color:var(--ink);line-height:1.1}
  .foot-r{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--soft)}

  /* mobile drawer */
  .drawer{position:fixed;inset:0;z-index:40;background:var(--white);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 24px calc(env(safe-area-inset-bottom,0px) + 32px)}
  .drawer-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px}
  .drawer .cats a{font-size:28px;padding:12px 0}

  /* ---------- RESPONSIVE ---------- */
  @media(max-width:980px){
    .shell{grid-template-columns:minmax(0,1fr);gap:0}
    .side{display:none}
    .menu-btn{display:inline-flex;align-items:center}
    .brand b{font-size:22px}
    .search input{max-width:none}
    .rail{grid-template-columns:minmax(0,1fr);align-items:stretch}
    .rail .step:nth-child(n){padding:14px 0 16px;border-left:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:56px minmax(0,1fr);column-gap:14px}
    .rail .step>*{grid-column:2}
    .rail .step .n{grid-column:1;grid-row:1 / span 6;font-size:48px}
    .step.mine{padding-left:14px!important;padding-right:14px!important}
    .cardset{grid-template-columns:minmax(0,1fr)}
  }
  @media(max-width:900px){
    .tablewrap.matrix{display:none}
    .stack{display:block;border-top:2px solid var(--ink);margin-top:18px}
  }
  @media(max-width:720px){
    body{font-size:16px}
    .top-in{padding:0 16px;gap:10px}
    .shell,.foot{padding:0 16px}
    .brand img{width:32px}
    .brand b{display:none}
    .stagebar{margin:0 -16px 30px;border-left:0;border-right:0}
    .stages{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .stages::-webkit-scrollbar{display:none}
    .stages button{flex:0 0 auto;min-width:104px}
    .stagebar-h span:last-child{display:none}
    .row,.sg,.jump a{grid-template-columns:minmax(0,1fr);gap:6px}
    .row dt{font-size:22px}
    .row{align-items:start}
    .sg dl div{grid-template-columns:minmax(0,1fr);gap:2px}
    .sg.mine{padding-left:12px}
    .g3.h{display:none}
    .g3{grid-template-columns:minmax(0,1fr);gap:8px}
    .g3 em{display:block}
    .g3>span:not(:first-child){display:grid;gap:1px}
    .pager a b{font-size:21px}
    .stack .scue p{grid-template-columns:96px minmax(0,1fr)}
  }

  /* ---------- STAGE PAGES ---------- */
  .side-stage{overflow-wrap:anywhere;font-family:var(--head);font-weight:900;font-size:36px;line-height:.9;text-transform:uppercase;color:var(--ink);margin:2px 0 14px}

  .btn-line{display:inline-flex;align-items:center;min-height:52px;padding:0 24px;background:var(--white);color:var(--ink);border:2px solid var(--ink);font:700 14px var(--text);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;cursor:pointer;border-radius:0}

    .fchips button{flex:0 0 auto}
    .find{max-width:none;flex:0 0 auto}
    .shero{margin:0 -16px 24px}
  }
  @media(prefers-reduced-motion:reduce){
    *{transition:none!important}
    html{scroll-behavior:auto}
  }
  @media print{
    .top,.side,.stagebar,.pager,footer,.drawer{display:none!important}
    .shell{display:block}
    .card{break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>

 {id:'game', name:'Game Model', blurb:'The four moments, the four Valor traits and the decision ladder.', lead:'Valor means courage, so the club identity is four kinds of bravery, one for each moment of the game. Pick a stage to see what the traits, the four moments and the decision ladder look like for your players.', blocks:[

 {id:'goalkeepers', name:'Goalkeepers', blurb:'The keeper pathway inside the same club language.', lead:'Goalkeepers use the same club language as every field player, in all four moments. Until Foundation, every player takes turns in goal and every keeper plays in the field.', blocks:[
   {t:'stagegrid', h:'Goalkeeper focus by stage', single:true, rows:[
     [['','Everyone rotates in goal. Catch, get up, roll it to a free teammate.']],
     [['','Set position, basic handling, distribute AROUND to a wide defender. Keepers still play field minutes.']],
     [['','SCAN before back-passes, CONNECT as an extra player, SWEEP behind the line, KEEPER and AWAY calls.']],
     [['','THROUGH, AROUND and BEYOND chosen on purpose; starting position set by ball pressure; organizes the back line.']],
     [['','Reads the press and sets build-up tempo; manages depth with the back line; leads set-piece organization.']]
   ]},
   {t:'simple', h:'Goalkeeper cues', rows:[
     ['KEEPER',0,'Claim the ball decisively with an early, loud call'],
     ['READY',1,'Prepare body and first touch to distribute; open to both sides'],
     ['AROUND',1,'Circulate outside the press to a wide defender or the other center back'],
     ['AWAY',1,'Defender must clear; the keeper cannot claim'],
     ['SCAN',2,'See pressure and next options before the back-pass arrives'],
     ['CONNECT',2,'Extra player in build-up, supporting behind the center backs'],
     ['TIME / MAN ON',2,'Early, specific information for the receiving defender'],
     ['SWEEP',2,'Protect the space behind the back line'],

 {id:'tiers', name:'Team Tiers', blurb:'Same age, different team levels: how the language scales.', lead:'Every Valor team in an age group uses the same words. Team tiers differ in three ways only: how many cues are active, how much pressure players execute them under, and how much the players lead the solving.', blocks:[
   {t:'grid3', h:'How the tiers differ', head:['','Development tier','Competitive tier','Premier tier'], rows:[
     ['Language base','The stage\'s core cues','Stage core plus a preview of the next stage','Stage core plus the next stage in full'],
     ['Cues per session','2-3','3-4','4-5'],
     ['Practice pressure','More time and space, success first','Match-realistic pressure','Above match pressure: smaller spaces, fewer touches'],
     ['Who solves it','Coach cues, then asks one question','Coach asks; players answer and show it','Players spot the problem and coach each other'],
     ['Game model detail','Principles','Principles plus team patterns','Principles, patterns and opponent-specific plans'],
     ['Video use','Clips of good examples','Players find the cue in clips','Players lead the review']
   ]},
   {t:'pairs', h:'One cue, three tiers: SCAN at U12', rows:[
     ['Development','Look over your shoulder before every pass comes to you. Coach counts scans in a rondo and praises each one.'],
     ['Competitive','Scan early and again while the ball travels. Players must call TURN or BOUNCE before receiving.'],
     ['Premier','Scan to find the third player. In a 9v9 game, players explain which line the scan told them they could break.']
   ]},
   {t:'pairs', h:'One concept, three tiers: through, around, beyond at U14', rows:[
     ['Development','Build mostly AROUND through the keeper and fullbacks. THROUGH when the 6 is clearly free. Calm, not rushed.'],
     ['Competitive','Recognize which of the three the press gives, and say it out loud before playing it.'],
     ['Premier','Attract the press on purpose to open a planned route; switch routes inside the same possession.']
   ]},
   {t:'list', h:'Moving between tiers', items:[
     'A player who moves up a tier hears the same words. The coach deepens the meaning; nothing is re-taught.',
     'A guest player from another tier should be able to follow every cue on day one. If not, that is a gap in the language, and the coach flags it to club technical staff.',
     'Tier coaches at the same age share session plans built on the same 3-5 priority cues each week, so players training up or down are never lost.'
   ]}
 ]},

 {id:'checkpoints', name:'Checkpoints', blurb:'What a player shows before moving up, and the four-level evaluation scale.', stageLead:'Rate each behavior on the four-level scale in evaluations and end-of-season conversations.', lead:'Before a player moves up, they should show these behaviors in games without being prompted. Use them in evaluations and end-of-season conversations with families; they describe readiness, not a pass or fail.', blocks:[
   {t:'evalscale', h:'Evaluation scale', sub:'Use the same four levels for every behavior, at every stage.'},
   {t:'stagegrid', h:'Ready to move up when they', rows:[

     [['In possession','Scan once before receiving; beat a player 1v1; pick drive, dribble or pass.'],['Out of possession and transition','Closest player presses; recover goal-side; first look after winning it is forward.'],['Language check','Can explain CLOSE, SLOW, SHOW, WIN.']],
     [['In possession','Support at angles; use wall pass and overlap; recognize when to switch.'],['Out of possession and transition','Press with cover; shift with the unit; choose hunt or delay on a loss.'],['Language check','Can say which of THROUGH, AROUND or BEYOND the press gives.']],

   ]}
 ]},

 {id:'sessions', name:'Training and Matchday', blurb:'Session design by stage and how to coach on game day.', lead:'Pick 3-5 priority cues per session (1-2 at Rising), design the practice so the behavior happens over and over, and coach with questions more than commands.', blocks:[

   ]},

/* routes: #start (setup), #club, #<club page>, #<stage>, #<stage>-<tab> */
function route(){
  var h = (location.hash || '').replace('#','');
  var m = h.match(/^(rising|foundation|connection|function|command)(?:-([a-z]+))?$/);
  if (m) {
    var p = m[2] || 'overview'; p = ALIAS[p] || p;
    if (!TABS.some(function(t){ return t.id === p; })) p = 'overview';
    return {stage:SLUG.indexOf(m[1]), page:p};
  }
  if (h === 'club') return {stage:-1, page:'club'};
  if (catById(h) && h !== 'start') return {stage:-1, page:h};
  return {stage:-1, page:'start'};
}

function cueName(cue){
  return CUECARDS[cue] ? '<button type="button" class="cue" data-card="'+esc(cue)+'">'+esc(cue)+'</button>' : esc(cue);

function cueChips(list){
  return '<span class="chips">'+list.map(function(c){ return '<span class="chip'+(CUECARDS[c]?' has':'')+'">'+cueName(c)+'</span>'; }).join('')+'</span>';

  var ctx = document.getElementById('ctx');
  if (r.stage >= 0) ctx.innerHTML = '<span class="ctx-k">Coaching</span><span class="ctx-v"><b>'+esc(sName(r.stage))+'</b> <span class="ctx-age">'+esc(STAGES[r.stage].ages)+' &middot; </span>'+esc(TIERS[tier].name)+'</span><span class="ctx-c">Change</span>';
  else if (r.page === 'start') ctx.innerHTML = '<span class="ctx-k">Set up</span><span class="ctx-v">Choose your team below</span>';
  else ctx.innerHTML = '<span class="ctx-k">Viewing</span><span class="ctx-v"><b>Club reference</b> all stages</span><span class="ctx-c">Change</span>';
  var tabs = document.getElementById('tabs'), bar = document.getElementById('bottombar');
  if (r.stage < 0) { tabs.hidden = true; bar.hidden = true; document.body.classList.remove('has-bar'); return; }
  var html = TABS.map(function(t){
    var k = tok(r.stage, t.id);
    return '<a href="#'+k+'" data-go="'+k+'"'+(t.id===r.page?' aria-current="page"':'')+'><span class="tl-long">'+esc(t.name)+'</span><span class="tl-short">'+esc(t.short)+'</span></a>';

  bar.innerHTML = html; bar.hidden = false; document.body.classList.add('has-bar');
}

/* ---------- one list of every word, tagged by moment ---------- */
var VOCAB_MOMENT = {SCAN:0,OPEN:0,TURN:0,DRIVE:0,COMMIT:0,RELEASE:0,CONNECT:0,STRETCH:0,BREAK:0,SWITCH:0,PRESS:2,COVER:2,COMPACT:2,SHIFT:2,STEP:2,DROP:2,DELAY:1,RECOVER:1,HUNT:1,SECURE:3};
var WORDS = (function(){
  var out = [], seen = {};
  LANG.forEach(function(id){
    var c = catById(id), chainH = null;
    c.blocks.forEach(function(b){
      if (b.t === 'chain') { chainH = b.h; return; }
      if (['progress','simple','matrix'].indexOf(b.t) === -1 || b.notCue) return;
      var group = b.h || chainH || c.name;
      b.rows.forEach(function(r){
        var moment;
        if (id === 'vocab') moment = MOMENTS[VOCAB_MOMENT[r[0]]];
        else if (id === 'technique' || id === 'attacking') moment = 'In possession';
        else if (id === 'defending') moment = 'Out of possession';
        else if (id === 'goalkeepers') moment = 'Goalkeeper';
        else moment = (chainH === 'Attack to defense') ? 'Loss of possession' : 'Win possession';
        var key = (moment === 'Goalkeeper' ? 'GK:' : '') + r[0];
        if (seen[key]) return; seen[key] = true;
        var w = {cue:r[0], moment:moment, group: id === 'vocab' ? 'Master words' : group};
        if (b.t === 'matrix') { w.m = r[1]; w.at = r[1].findIndex(function(x){ return x !== null; }); }
        else if (b.t === 'progress') { w.at = r[1]; w.early = r[2]; w.adv = r[3]; }
        else { w.at = r[1] === null ? 0 : r[1]; w.text = r[2].replace(/<[^>]+>/g,''); }
        out.push(w);
      });
    });
  });
  return out;
})();
function meaningAt(w, s){
  if (s < 0 || s > 4 || s < w.at) return null;
  if (w.m) return w.m[s];
  if (w.early) return s === w.at ? w.early : w.adv;
  return w.text;
}

  html += '<div class="wtools"><div class="fchips" role="group" aria-label="Filter by moment">'+filters.map(function(f){
    return '<button type="button" data-wf="'+esc(f)+'" aria-pressed="'+(wordsFilter===f)+'">'+esc(f === 'Goalkeeper' ? 'Goalkeepers' : f)+'</button>';
  }).join('')+'</div><label class="find"><span>Find a cue</span><input id="wfind" type="search" value="'+esc(wordsFind)+'" placeholder="scan, press, overlap" autocomplete="off" spellcheck="false"></label></div>';
  html += '<div id="wlist">'+wordsList()+'</div>';
  var laterW = WORDS.filter(function(w){ return w.at > s; });
  if (laterW.length) html += '<details class="laterbox"><summary>Taught at later stages ('+laterW.length+')</summary><p>'+laterW.map(function(w){ return esc(w.cue); }).join(', ')+'</p></details>';
  html += '<p class="clublink">See how every cue grows across all stages in the <a href="#vocab" data-go="vocab">club reference</a>.</p>';
  return html;
}
function wordsList(){
  var s = stage, f = wordsFind.trim().toLowerCase();
  var list = WORDS.filter(function(w){
    if (w.at > s) return false;
    if (tier === 0 && !isCore(w.cue)) return false;
    if (wordsFilter !== 'All' && w.moment !== wordsFilter) return false;
    if (f && (w.cue + ' ' + (meaningAt(w, s)||'')).toLowerCase().indexOf(f) === -1) return false;
    return true;
  });
  if (!list.length) return '<p class="empty">No cues match. Clear the search or pick All.</p>';
  var html = '';
  MOMENTS.concat(['Goalkeeper']).forEach(function(m){
    var inM = list.filter(function(w){ return w.moment === m; });
    if (!inM.length) return;
    html += '<section class="block"><h2>'+esc(m === 'Goalkeeper' ? 'Goalkeepers' : m)+'</h2>';
    var groups = []; inM.forEach(function(w){ if (groups.indexOf(w.group) === -1) groups.push(w.group); });
    groups.forEach(function(g){
      html += '<p class="subh">'+esc(g)+'</p><dl class="rows">'+inM.filter(function(w){ return w.group === g; }).map(function(w){
        var isNew = w.at === s && s > 0;
        var marks = (tier > 0 && isCore(w.cue) ? '<small class="core">Core</small>' : '')+(isNew ? '<small>New this stage</small>' : '');
        return '<div class="row'+(isNew?' hit':'')+'"><dt>'+cueName(w.cue)+marks+'</dt><dd>'+esc(meaningAt(w, s))+nextLine(meaningAt(w, s+1) !== meaningAt(w, s) ? meaningAt(w, s+1) : null)+'</dd></div>';
      }).join('')+'</dl>';
    });
    html += '</section>';
  });
  return html;
}

function tabPlay(){
  var game = catById('game'), html = pageHead('How we play', 'The Valor traits, the four moments and the decisions players make, as they look at '+esc(sName(stage))+'.');
  var titles = {'What each trait looks like':'The Valor traits', 'The four moments by stage':'The four moments', 'The decision ladder':'The decision ladder', 'Which steps each stage runs':'Game model steps'};
  game.blocks.forEach(function(b){
    if (b.club) return;
    if (b.t === 'matrix' || b.t === 'stagegrid') {
      var copy = {}; for (var k in b) copy[k] = b[k];
      copy.h = titles[b.h] || b.h; copy.sub = null;
      var inner = R[b.t](copy); if (inner) html += '<section class="block">'+inner+'</section>';
    }
  });
  html += R.roles();
  return html;
}

function tabPlan(){
  var sess = catById('sessions'), cp = catById('checkpoints');
  var html = pageHead('Plan', 'What to work on this season, how sessions should look, and how to evaluate players.');
  html += '<section class="block"><h2>This season</h2><p class="sub">'+['Development teams work the first two cues of each block.','Competitive teams work all three cues of each block.','Premier teams work all three cues and preview one from the next stage.'][tier]+'</p>'+R.season()+'</section>';
  var row = sess.blocks[0].rows[stage];
  html += '<section class="block"><h2>Sessions</h2><dl class="rows">'+row.map(function(x){ return '<div class="row"><dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd></div>'; }).join('')+
    '<div class="row"><dt>For '+esc(TIERS[tier].name)+'</dt><dd>'+esc(TIERS[tier].pressure)+'. '+esc(TIERS[tier].solve)+'. '+esc(TIERS[tier].cues)+'.</dd></div></dl></section>';
  html += '<section class="block">'+R.list(sess.blocks[1])+'</section>';
  html += '<section class="block"><h2>Evaluation</h2><p class="sub">Rate each behavior on the four-level scale.</p><dl class="rows">'+
    cp.blocks[1].rows[stage].map(function(x){ return '<div class="row"><dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd></div>'; }).join('')+'</dl>'+
    '<p class="scale">'+EVAL_SCALE.map(function(e){ return '<span><b>'+esc(e[0])+'</b> '+esc(e[1])+'</span>'; }).join('')+'</p></section>';
  return html;
}

/* ---------- setup screen and club index ---------- */
function setupPage(){
  if (pick.stage < 0) pick.stage = recalled();
  var html = '<div class="hero setup"><span class="ghost" aria-hidden="true">Valor</span>'+
    '<p class="label">Common Coaching Language &middot; <span class="nowrap">2026-27</span></p>'+
    '<h1><span>One club.</span><span>One language.</span></h1>'+
    '<p>Pick your age group and team level once. Every page then shows only what your team needs.</p></div>';
  html += '<section class="block" id="pickStage"><h2>1. Your age group</h2><div class="picks stages5" role="group" aria-label="Age group">'+STAGES.map(function(s,i){
    return '<button type="button" data-ps="'+i+'" aria-pressed="'+(pick.stage===i)+'"><b>'+esc(s.name)+'</b><span>'+esc(s.ages)+' &middot; '+esc(s.format)+'</span></button>';
  }).join('')+'</div></section>';
  html += '<section class="block"><h2>2. Your team level</h2><div class="picks tiers3" role="group" aria-label="Team level">'+TIERS.map(function(t,i){
    return '<button type="button" data-pt="'+i+'" aria-pressed="'+(pick.tier===i)+'"><b>'+esc(t.name)+'</b><span>'+esc(t.pressure)+'</span></button>';
  }).join('')+'</div></section>';
  html += '<div class="gobar">'+(pick.stage >= 0
    ? '<button type="button" class="btn-ink" id="goPick">Open '+esc(sName(pick.stage))+' &middot; '+esc(TIERS[pick.tier].name)+'</button>'
    : '<p class="sub">Choose an age group to continue.</p>')+'</div>';
  html += '<p class="clublink">Technical staff and planning: <a href="#club" data-go="club">club reference, all stages side by side</a>.</p>';
  return html;
}

function clubIndex(){
  var html = backBtn('start', 'Choose your team')+'<div class="vhead"><p class="label">Club reference &middot; All stages</p><h1>Club reference</h1><p class="lead">Every part of the language side by side across all five stages. For technical staff, planning across age groups and evaluations.</p></div>';
  html += '<label class="find wide"><span>Search everything</span><input id="q" type="search" placeholder="scan, press, countered" autocomplete="off" spellcheck="false"></label><div id="qres"></div>';
  html += '<nav class="jump" aria-label="Club reference sections">'+CLUB.map(function(id){ var c = catById(id); return '<a href="#'+id+'" data-go="'+id+'"><b>'+esc(c.name)+'</b><span>'+esc(c.blurb)+'</span></a>'; }).join('')+'</nav>';
  return html;
}

/* ---------- search (club reference) ---------- */
var INDEX = (function(){
  var out = [];
  WORDS.forEach(function(w){ out.push({id:'vocab', cue:w.cue, text:w.moment+'. '+(w.m ? w.m.filter(Boolean).join(' / ') : (w.early ? w.early+' / '+w.adv : w.text))}); });
  PROBLEMS.forEach(function(p){ out.push({id:'problems', cue:p.title, text:'Cues: '+p.cues.join(', ')}); });
  CORE.forEach(function(c){ out.push({id:'core', cue:c[0], text:c[2]}); });
  return out;
})();
function searchHtml(term){
  var t = term.toLowerCase();
  var hits = INDEX.filter(function(x){ return (x.cue+' '+x.text).toLowerCase().indexOf(t) !== -1; }).slice(0, 30);
  if (!hits.length) return '<p class="empty">Nothing matches that word.</p>';
  return '<dl class="rows">'+hits.map(function(x){ var c = catById(x.id); return '<div class="row"><dt>'+cueName(x.cue)+'</dt><dd>'+esc(x.text)+'<br><a class="res-cat" href="#'+x.id+'" data-go="'+x.id+'">'+esc(c.name)+'</a></dd></div>'; }).join('')+'</dl>';
}

/* ---------- page assembly ---------- */
function setPager(list, cur){
  var i = list.findIndex(function(x){ return x.token === cur; });
  var prev = list[i-1], next = list[i+1];
  pager.innerHTML = (prev?'<a class="prev" href="#'+prev.token+'" data-go="'+prev.token+'"><span>Previous</span><b>'+esc(prev.name)+'</b></a>':'<span></span>')+
                    (next?'<a class="next" href="#'+next.token+'" data-go="'+next.token+'"><span>Next</span><b>'+esc(next.name)+'</b></a>':'<span></span>');
  pager.hidden = false;
}

function draw(){
  var r = route();
  stage = r.stage; LATER = []; diaN = 0;
  chrome(r);
  var html = '';
  pager.hidden = true;
  if (r.stage >= 0) {
    save('valorWayStage', r.stage);
    html = ({overview:tabHome, problems:tabProblems, vocabulary:tabWords, play:tabPlay, plan:tabPlan})[r.page]();
    setPager(TABS.map(function(t){ return {token:tok(r.stage, t.id), name:t.name}; }), tok(r.stage, r.page));
  } else if (r.page === 'start') {
    html = setupPage();
  } else if (r.page === 'club') {
    html = clubIndex();
  } else {
    var c = catById(r.page);
    html = backBtn('club', 'Club reference')+'<div class="vhead"><p class="label">Club reference &middot; All stages</p><h1>'+esc(c.name)+'</h1>'+(c.lead?'<p class="lead">'+c.lead+'</p>':'')+'</div>';
    html += blocksHtml(c);
    setPager(CLUB.map(function(id){ return {token:id, name:catById(id).name}; }), c.id);
  }
  view.innerHTML = html;
}

/* ---------- events ---------- */
function go(token){
  if (location.hash.replace('#','') !== token) { location.hash = token; } else { draw(); }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', function(){ closeCard(); probFilter = 'All'; probFind = ''; wordsFilter = 'All'; wordsFind = ''; draw(); window.scrollTo(0,0); });

document.addEventListener('click', function(e){
  var t = e.target;
  if (!t.closest) return;
  var card = t.closest('[data-card]');
  if (card) { e.preventDefault(); openCard(card.getAttribute('data-card')); return; }
  if (t.closest('#pnClose') || t === panel) { closeCard(); return; }
  var a = t.closest('[data-go]');
  if (a) {
    e.preventDefault(); closeCard();
    var to = a.getAttribute('data-go');
    if (to === 'start' && route().page === 'start') {
      var pk = document.getElementById('pickStage');
      if (pk) { pk.scrollIntoView({behavior:'smooth', block:'start'}); var first = pk.querySelector('button[aria-pressed="true"]') || pk.querySelector('button'); if (first) first.focus({preventScroll:true}); }
      return;
    }
    go(to); return;
  }
  var ps = t.closest('[data-ps]');
  if (ps) { pick.stage = +ps.getAttribute('data-ps'); draw(); return; }
  var pt = t.closest('[data-pt]');
  if (pt) { pick.tier = +pt.getAttribute('data-pt'); draw(); return; }
  if (t.closest('#goPick')) { tier = pick.tier; save('valorWayTier', tier); go(SLUG[pick.stage]); return; }
  var pf = t.closest('[data-pf]');
  if (pf) {
    probFilter = pf.getAttribute('data-pf');
    document.querySelectorAll('[data-pf]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-pf') === probFilter)); });
    document.getElementById('plist').innerHTML = problemsList(); return;
  }
  var wf = t.closest('[data-wf]');
  if (wf) {
    wordsFilter = wf.getAttribute('data-wf');
    document.querySelectorAll('[data-wf]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-wf') === wordsFilter)); });
    document.getElementById('wlist').innerHTML = wordsList(); return;
  }
});
var qt;
document.addEventListener('input', function(e){
  var id = e.target.id;
  if (id === 'pfind') { probFind = e.target.value; document.getElementById('plist').innerHTML = problemsList(); }
  if (id === 'wfind') { wordsFind = e.target.value; document.getElementById('wlist').innerHTML = wordsList(); }
  if (id === 'q') { clearTimeout(qt); var v = e.target.value.trim(); qt = setTimeout(function(){ document.getElementById('qres').innerHTML = v.length >= 2 ? searchHtml(v) : ''; }, 120); }
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeCard(); });

draw();
})();
</script>
