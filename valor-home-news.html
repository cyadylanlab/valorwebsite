<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Club News | Virginia Valor FC</title>
<!--
  HOMEPAGE CLUB NEWS SECTION (replaces the "Updates - Announcements - News" slider)
  Embed with a Wix HTML iframe:
    https://cyadylanlab.github.io/valorwebsite/valor-home-news.html
  Wix iframe heights: desktop 820px, mobile 760px. Both stay the same at any width.
  The page never scrolls inside its own frame, so a frame a little taller than needed is safe.

  TO ADD, REMOVE OR REORDER NEWS: edit the NEWS list near the bottom of this file
  (look for "EDIT NEWS HERE"). Nothing else needs to change. Four to seven items fit best.

  Desktop: one item is open at a time and the row moves to the next one every 7 seconds
  (the gold line over the open item fills as it counts down). Hovering the row pauses it
  and opens whatever is under the cursor. Clicking an open item follows its link.
  Phones: one full card per item; swipe left or right between them.
  Videos play muted while open; the Sound button turns audio on and stops the auto-advance.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://static.wixstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0A0A0A;
    --ink: #141414;
    --gold: #8B7A4C;
    --gold-hi: #A2915F;
    --brass: #C8B98F;
    --paper: #FFFFFF;
    --bg: var(--black);
    --fg: #FFFFFF;
    --muted: rgba(255, 255, 255, .66);
    --line: rgba(255, 255, 255, .16);
    --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --pad-x: clamp(18px, 4.4vw, 72px);
    --rise: cubic-bezier(.16, 1, .3, 1);
    --swing: cubic-bezier(.65, 0, .2, 1);
    --dur: 7000ms;
    --tag-h: 42px;
    --media-h: 380px;
    --open-w: 320px; /* media height x 0.84, set by the script */
    --cap-h: 176px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); overflow-y: hidden; }
  body {
    font-family: var(--serif);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--gold-hi); outline-offset: 3px; }

  /* =========================================================
     SECTION SHELL
     ========================================================= */
  .nw {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    padding: 56px 0 48px;
    background: var(--bg);
  }
  .wrap {
    position: relative;
    z-index: 2;
    max-width: 1440px;
    margin: 0 auto;
    padding: 0 var(--pad-x);
  }

  /* =========================================================
     HEADER (same build as the Player Pathway header)
     ========================================================= */
  .head {
    display: grid;
    grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
    align-items: end;
    gap: 24px 48px;
    margin-bottom: 26px;
  }
  .kicker {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 8px;
    font-family: var(--display);
    font-weight: 800;
    font-size: 14px;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--gold-hi);
  }
  .kicker .vmark { height: 30px; width: auto; flex: none; margin: -6px 0 -4px; }
  .title {
    margin: 0;
    font-family: var(--display);
    font-weight: 900;
    font-size: 68px;
    line-height: .9;
    letter-spacing: -.005em;
    text-transform: uppercase;
    color: var(--fg);
  }
  .title .ln { display: inline-block; overflow: hidden; padding-bottom: .04em; vertical-align: bottom; }
  .title .ln > span { display: block; }
  .lede {
    margin: 0;
    max-width: 40ch;
    justify-self: end;
    font-size: 16px;
    line-height: 1.5;
    color: var(--muted);
    border-left: 3px solid var(--gold);
    padding-left: 18px;
  }

  /* =========================================================
     ITEMS (desktop: expanding panels, one open at a time)
     ========================================================= */
  .items {
    display: flex;
    gap: 10px;
    height: calc(var(--tag-h) + var(--media-h) + var(--cap-h));
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .item {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    overflow: hidden;
    cursor: pointer;
    contain: layout paint style;
    transition: flex-grow 900ms var(--swing);
  }
  .item.is-on { flex-grow: var(--g, 3); }
  .item.is-on.no-link { cursor: default; }

  /* Media keeps the open width at all times, so a panel resizing only changes how
     much of it shows. Nothing re-scales while the panels move. */
  .media {
    position: absolute;
    top: var(--tag-h);
    left: 50%;
    width: var(--open-w);
    height: var(--media-h);
    transform: translateX(-50%);
    background: #000;
    overflow: hidden;
  }
  .media img, .media video {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .fit-contain .media img { object-fit: contain; }
  .full { opacity: 0; transition: opacity 500ms ease; }
  .loaded .full { opacity: 1; }
  /* Black-and-white copy for closed panels: drawn once, then only faded */
  .mono {
    filter: grayscale(1) contrast(1.05);
    opacity: 0;
    transition: opacity 700ms ease;
  }
  .loaded:not(.is-on) .mono { opacity: 1; }
  .media::after {
    content: "";
    position: absolute;
    inset: 0;
    background: #000;
    opacity: .5;
    pointer-events: none;
    transition: opacity 600ms ease;
  }
  .item:not(.is-on):hover .media::after { opacity: .3; }
  .item.is-on .media::after { opacity: 0; }
  .media video { opacity: 0; transition: opacity 500ms ease; }
  .item.is-on video.playing { opacity: 1; }

  /* Gold edge across the top of the open item; it fills as the countdown runs */
  .item::before {
    content: "";
    position: absolute;
    z-index: 3;
    left: 0; top: var(--tag-h);
    height: 5px;
    width: var(--open-w);
    background: var(--gold-hi);
    transform: scaleX(0);
    transform-origin: left;
  }
  .item.is-on::before { transform: scaleX(1); transition: transform 700ms var(--rise) 200ms; }
  .auto .item.is-on::before {
    transform: scaleX(0);
    transition: none;
    animation: count var(--dur) linear forwards;
  }
  .auto .item.is-on.alt::before { animation-name: count2; }
  .auto.paused .item.is-on::before { animation-play-state: paused; }
  @keyframes count { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes count2 { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  /* Closed panels: short name reading up the side */
  .spine {
    position: absolute;
    z-index: 2;
    top: var(--tag-h);
    left: 0;
    right: 0;
    height: var(--media-h);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 22px 16px 24px;
    pointer-events: none;
    opacity: 1;
    transition: opacity 400ms ease 250ms;
  }
  .item.is-on .spine { opacity: 0; transition: opacity 200ms ease; }
  .spine-name {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(24px, 2.1vw, 34px);
    line-height: 1;
    letter-spacing: .02em;
    text-transform: uppercase;
    color: #fff;
    white-space: nowrap;
  }

  /* Label above each item; gold when open, quiet when closed */
  .tagbar {
    position: absolute;
    z-index: 2;
    top: 0;
    left: 0;
    right: 0;
    height: var(--tag-h);
    white-space: nowrap;
    overflow: hidden;
  }
  .tag {
    display: inline-block;
    margin: 0;
    padding: 5px 10px 4px;
    background: var(--gold);
    font-family: var(--display);
    font-weight: 800;
    font-size: 15px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #fff;
    transition: background-color 400ms ease, color 400ms ease;
  }
  .item:not(.is-on) .tag { background: #2B2925; color: #BDB7A8; }

  /* Caption under the open item, so nothing covers the flyer. It keeps the open
     width, so its text never re-wraps while panels move. */
  .plate {
    position: absolute;
    z-index: 2;
    left: 0;
    top: calc(var(--tag-h) + var(--media-h));
    width: var(--open-w);
    height: var(--cap-h);
    padding: 16px 0 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .plate > * {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 300ms ease, transform 700ms var(--rise);
  }
  .item.is-on .plate > * { opacity: 1; transform: none; transition: opacity 500ms ease, transform 700ms var(--rise); }
  .item.is-on .plate > :nth-child(1) { transition-delay: 260ms; }
  .item.is-on .plate > :nth-child(2) { transition-delay: 320ms; }
  .item.is-on .plate > :nth-child(3) { transition-delay: 380ms; }
  .plate h3 {
    margin: 0 0 6px;
    font-family: var(--display);
    font-weight: 900;
    font-size: 28px;
    line-height: .95;
    text-transform: uppercase;
    letter-spacing: .005em;
  }
  .plate p {
    margin: 0 0 14px;
    font-size: 15px;
    line-height: 1.45;
    color: var(--muted);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .go {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 11px 16px 10px;
    border: 1.5px solid var(--brass);
    font-family: var(--display);
    font-weight: 800;
    font-size: 15px;
    letter-spacing: .16em;
    text-transform: uppercase;
    text-decoration: none;
    white-space: nowrap;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(var(--gold), var(--gold)) no-repeat left / 0% 100%;
    transition: background-size 450ms var(--rise), border-color 300ms ease;
  }
  .go:hover, .go:focus-visible { background-size: 100% 100%; border-color: var(--gold); }
  .go .arrow { display: inline-block; width: 22px; height: 1.5px; background: currentColor; position: relative; transition: width 400ms var(--rise); }
  .go .arrow::after { content: ""; position: absolute; right: 0; top: -4px; width: 8px; height: 8px; border-top: 1.5px solid currentColor; border-right: 1.5px solid currentColor; transform: rotate(45deg); }
  .go:hover .arrow { width: 32px; }
  .go .snd { width: 16px; height: 16px; flex: none; }
  .go .snd .on { display: none; }
  .go[aria-pressed="true"] .snd .on { display: inline; }
  .go[aria-pressed="true"] .snd .off { display: none; }

  /* Invisible button over each item, so every item can be opened from the keyboard */
  .hit {
    position: absolute;
    z-index: 1;
    left: 0; top: 0;
    width: 100%;
    height: calc(var(--tag-h) + var(--media-h));
    margin: 0; padding: 0;
    border: 0;
    background: none;
    cursor: inherit;
  }
  .hit:focus-visible { outline-offset: -3px; }

  /* Counter and arrows in the open space under the closed items; they switch
     sides when the open item is underneath them */
  .body { position: relative; }
  .pager {
    position: absolute;
    z-index: 3;
    right: 0;
    top: calc(var(--tag-h) + var(--media-h) + 18px);
    display: flex;
    align-items: center;
    gap: 10px;
    transition: opacity 300ms ease;
  }
  .pager.left { right: auto; left: 0; }
  .pager.hide { opacity: 0; pointer-events: none; }
  .count {
    margin-right: 8px;
    font-family: var(--display);
    font-weight: 800;
    font-size: 15px;
    letter-spacing: .16em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .count b { color: var(--fg); font-weight: 800; }
  .step {
    width: 44px;
    height: 44px;
    padding: 0;
    border: 1.5px solid var(--line);
    background: none;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: border-color 300ms ease, background-color 300ms ease;
  }
  .step:hover { border-color: var(--brass); background: rgba(255, 255, 255, .05); }
  .step span { display: block; width: 9px; height: 9px; border-top: 1.5px solid #fff; border-right: 1.5px solid #fff; transform: rotate(45deg); margin-left: -4px; }
  .step.prev span { transform: rotate(-135deg); margin: 0 -4px 0 0; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* =========================================================
     ENTRANCE (runs once when the section scrolls into view)
     ========================================================= */
  .js .title .ln > span { transform: translateY(105%); transition: transform 1000ms var(--rise); }
  .js .title .ln + .ln > span { transition-delay: 120ms; }
  .js .kicker, .js .lede { opacity: 0; transition: opacity 800ms ease 300ms; }
  .js .item::after {
    content: "";
    position: absolute;
    z-index: 5;
    inset: 0;
    background: var(--bg);
    transform-origin: top;
    transition: transform 1100ms var(--rise);
    pointer-events: none;
  }
  .js .item:nth-child(2)::after { transition-delay: 70ms; }
  .js .item:nth-child(3)::after { transition-delay: 140ms; }
  .js .item:nth-child(4)::after { transition-delay: 210ms; }
  .js .item:nth-child(5)::after { transition-delay: 280ms; }
  .js .item:nth-child(6)::after { transition-delay: 350ms; }
  .js .item:nth-child(n+7)::after { transition-delay: 420ms; }
  .in .title .ln > span { transform: none; }
  .in .kicker, .in .lede { opacity: 1; }
  .in .item::after { transform: scaleY(0); }

  /* =========================================================
     PHONES: one full card per item, swipe left or right between them,
     with position bars underneath. Fixed height, so the frame never changes.
     ========================================================= */
  .mbar { display: none; }
  @media (max-width: 819px) {
    :root { --m-area: 600px; --m-bar: 42px; --tag-h: 34px; }
    .nw { padding: 34px 0 30px; }
    .head { grid-template-columns: 1fr; gap: 0; margin-bottom: 18px; }
    .title { font-size: clamp(34px, 12.4vw, 60px); white-space: nowrap; }
    .lede { display: none; }
    .spine, .hit, .mono, .pager { display: none; }
    .body { display: flex; flex-direction: column; }
    .mbar {
      order: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      height: var(--m-bar);
      padding-top: 10px;
    }
    .dots { display: flex; gap: 6px; }
    .dot {
      width: 22px;
      height: 22px;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      position: relative;
    }
    .dot::after {
      content: "";
      position: absolute;
      left: 2px; right: 2px; top: 50%;
      height: 3px;
      margin-top: -1.5px;
      background: var(--line);
      transition: background-color 300ms ease;
    }
    .dot.is-on::after { background: var(--gold-hi); }

    .items {
      display: flex;
      gap: 12px;
      height: calc(var(--m-area) - var(--m-bar));
      margin: 0 calc(var(--pad-x) * -1);
      padding: 0 var(--pad-x);
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-padding: 0 var(--pad-x);
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .items::-webkit-scrollbar { display: none; }
    .item {
      flex: 0 0 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      cursor: default;
      background: #161616;
    }
    .item.is-on { flex-grow: 0; }
    .tagbar { position: relative; flex: none; background: var(--bg); }
    .item:not(.is-on) .tag { background: var(--gold); color: #fff; }
    .media {
      position: relative;
      left: auto; top: auto;
      flex: 1 1 auto;
      min-height: 120px;
      height: auto;
      width: 100%;
      transform: none;
    }
    .media::after { display: none; }
    .item::before, .auto .item.is-on::before { width: 100%; transform: scaleX(1); animation: none; transition: none; }
    .item .media video.playing { opacity: 1; }
    .plate {
      position: relative;
      top: auto;
      width: 100%;
      height: var(--m-plate, auto); /* same on every card: set by the script to the tallest caption */
      flex: none;
      padding: 18px 18px 20px;
    }
    .plate h3 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .plate .go { margin-top: auto; }
    .plate > *, .item.is-on .plate > * { opacity: 1; transform: none; transition: none; }
    .plate h3 { font-size: 26px; }
    .plate p { font-size: 14.5px; -webkit-line-clamp: 2; color: rgba(255, 255, 255, .8); }
  }
  @media (max-width: 380px) {
    .plate { padding: 14px 14px 16px; }
    .plate h3 { font-size: 23px; margin-bottom: 4px; }
    .plate p { font-size: 13.5px; line-height: 1.4; margin-bottom: 12px; }
    .go { padding: 9px 13px 8px; font-size: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: 1ms !important; transition-delay: 0ms !important; }
  }
</style>
</head>
