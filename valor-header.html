<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virginia Valor FC Header</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0d0d0d;
    --gold:#8B7A4C;      /* Valor gold */
    --nav:#A39964;       /* matches the native Wix menu text */
    --brass:#C8B98F;
    --line:#e6e1d4;
    --k:1;               /* scale factor, drops on short embeds */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#fff;overflow:hidden}
  body{font-family:"Barlow Condensed","DIN Condensed","Arial Narrow",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}

  .vh{position:relative;height:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:stretch}
  /* gold rule along the bottom edge; the Join block sits over it */
  .vh::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--gold)}

  /* brand lockup */
  .brand{display:flex;align-items:center;gap:14px;padding:0 22px 0 clamp(10px,1.6vw,26px);border-right:1px solid var(--line)}
  .brand img{height:calc(100% - 10px);max-height:78px;width:auto;display:block;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  .brand:hover img{transform:rotate(-4deg) scale(1.04)}
  .brand .txt{display:flex;flex-direction:column;line-height:1}
  .brand .name{font-weight:700;font-size:25px;letter-spacing:.035em;text-transform:uppercase;white-space:nowrap}
  .brand .tag{margin-top:6px;font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
  .brand .tag i{font-style:normal;color:var(--brass);padding:0 .35em}

  /* logo rail */
  .rail{position:relative;overflow:hidden;display:flex;align-items:center;min-width:0}
  .track{--g:clamp(16px,2vw,34px);display:flex;align-items:center;list-style:none;margin:0;padding:0 18px;gap:var(--g);flex:none}
  .track li{flex:none;display:flex;align-items:center}
  .track img{display:block;height:calc(var(--h) * var(--k));width:auto;filter:grayscale(1) contrast(1.15) brightness(.85);opacity:.78;transition:filter .3s,opacity .3s,transform .3s}
  .track a:hover img,.track a:focus-visible img{filter:none;opacity:1;transform:translateY(-2px)}
  .track a:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
  .track .lbl{align-self:stretch;display:flex;align-items:center;padding-left:clamp(10px,1.2vw,18px);border-left:1px solid var(--line);margin-left:clamp(4px,.6vw,10px)}
  .track .lbl:first-child{border-left:0;padding-left:0;margin-left:0}
  .track .lbl span{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:600;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);line-height:1}

  /* ribbon-board ticker; set data-ticker="auto" on <body> to run it only when the logos do not fit */
  .rail.run .track{padding:0 var(--g) 0 0;animation:slide var(--dur,40s) linear infinite}
  .rail.run:hover .track{animation-play-state:paused}
  @keyframes slide{to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion:reduce){
    .rail{overflow-x:auto}
    .rail.run .track{animation:none}
  }

  /* join block: black, flush right, covers the gold rule so it runs into the black menu bar */
  .join{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;padding:0 clamp(16px,2vw,30px);background:var(--ink);color:var(--nav);overflow:hidden}
  .join::before{content:"";position:absolute;inset:auto 0 0 0;height:0;background:var(--gold);transition:height .35s cubic-bezier(.2,.8,.2,1);z-index:-1}
  .join:hover::before,.join:focus-visible::before{height:100%}
  .join:hover,.join:focus-visible{color:#fff}
  .join:focus-visible{outline:2px solid var(--brass);outline-offset:-4px}
  .join .big{font-weight:700;font-size:27px;letter-spacing:.05em;text-transform:uppercase;line-height:1;white-space:nowrap}
  .join .sub{margin-top:5px;font-weight:600;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);white-space:nowrap;transition:color .3s}
  .join:hover .sub,.join:focus-visible .sub{color:#fff}

  /* narrower desktops and tablets */
  @media (max-width:1180px){ .brand .tag{display:none} .brand .name{font-size:22px} }
  @media (max-width:820px){
    .brand .txt{display:none}
    .brand{padding-right:14px}
    .join .sub{display:none}
    .join .big{font-size:22px}
  }
  /* phones */
  @media (max-width:480px){
    .brand{padding:0 10px}
    .join{padding:0 14px}
    .join .big{font-size:19px}
    .track{--g:16px;padding:0 12px}
  }
  /* short embeds (for example a 60 to 66px mobile header) */
  @media (max-height:70px){ :root{--k:.86} .brand img{height:calc(100% - 8px)} }
</style>
</head>

<script>
(function(){
  var rail = document.querySelector('.rail');
  var track = rail.querySelector('.track');
  var source = track.innerHTML;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function hidden(html){
    var box = document.createElement('ul');
    box.innerHTML = html;
    box.querySelectorAll('li').forEach(function(li){ li.setAttribute('aria-hidden','true'); });
    box.querySelectorAll('a').forEach(function(a){ a.tabIndex = -1; });
    return box.innerHTML;
  }

  function fit(){
    rail.classList.remove('run');
    track.innerHTML = source;
    if (reduce) return;
    var auto = document.body.getAttribute('data-ticker') === 'auto';
    if (auto && track.scrollWidth <= rail.clientWidth + 1) return;   // everything fits, stay still
    // build one loop that is at least as wide as the rail, then duplicate it for a seamless scroll
    var copies = hidden(source), loop = source, n = 1;
    track.innerHTML = loop;
    while (track.scrollWidth < rail.clientWidth && n < 4) { loop += copies; track.innerHTML = loop; n++; }
    var w = track.scrollWidth;
    track.innerHTML = loop + hidden(loop);
    track.style.setProperty('--dur', Math.round(w / 32) + 's');
    rail.classList.add('run');
  }

  var t;
  window.addEventListener('resize', function(){ clearTimeout(t); t = setTimeout(fit, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  window.addEventListener('load', fit);
  fit();
})();
</script>
