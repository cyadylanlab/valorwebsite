<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virginia Valor FC Header</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0d0d0d;
    --gold:#8B7A4C;      /* Valor gold */
    --nav:#A39964;       /* matches the native Wix menu text */
    --brass:#C8B98F;
    --line:#e6e1d4;
    --k:1;               /* scale factor, drops on short embeds */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#fff;overflow:hidden}
  body{font-family:"Barlow Condensed","DIN Condensed","Arial Narrow",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}

  .vh{position:relative;height:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:stretch}
  /* gold rule along the bottom edge */
  .vh::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--gold)}

  /* brand lockup */
  .brand{display:flex;align-items:center;gap:14px;padding:0 22px 3px clamp(10px,1.6vw,26px);border-right:1px solid var(--line)}
  .brand img{height:calc(100vh - 18px);max-height:70px;width:auto;display:block;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  .brand:hover img{transform:rotate(-4deg) scale(1.04)}
  .brand .txt{display:flex;flex-direction:column;line-height:1}
  .brand .name{font-weight:700;font-size:25px;letter-spacing:.035em;text-transform:uppercase;white-space:nowrap}
  .brand .tag{margin-top:6px;font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
  .brand .tag i{font-style:normal;color:var(--brass);padding:0 .35em}

  /* if an image fails to load, keep its box and hide the alt text so nothing shifts */
  .brand img,.track img{font-size:0;color:transparent;overflow:hidden;object-fit:contain}
  .brand{min-width:0;overflow:hidden}
  .brand .txt{min-width:0}

  /* logo rail */
  .rail{position:relative;overflow:hidden;display:flex;align-items:center;min-width:0}
  .track{--g:clamp(16px,2vw,34px);display:flex;align-items:center;list-style:none;margin:0;padding:0 18px;gap:var(--g);flex:none}
  .track li{flex:none;display:flex;align-items:center}
  .track img{display:block;height:calc(var(--h) * var(--k));width:auto;filter:grayscale(1) contrast(1.15) brightness(.85);opacity:.78;transition:filter .3s,opacity .3s,transform .3s}
  .track a:hover img,.track a:focus-visible img{filter:none;opacity:1;transform:translateY(-2px)}
  .track a:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
  .track .lbl{align-self:stretch;display:flex;align-items:center;padding-left:clamp(10px,1.2vw,18px);border-left:1px solid var(--line);margin-left:clamp(4px,.6vw,10px)}
  .track .lbl:first-child{border-left:0;padding-left:0;margin-left:0}
  .track .lbl span{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:600;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);line-height:1}

  /* ribbon-board ticker; set data-ticker="auto" on <body> to run it only when the logos do not fit */
  .rail.run{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 36px,#000 calc(100% - 36px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 36px,#000 calc(100% - 36px),transparent 100%)}
  .rail.run .track{padding:0 var(--g) 0 0;animation:slide var(--dur,40s) linear infinite}
  .rail.run:hover .track{animation-play-state:paused}
  @keyframes slide{to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion:reduce){
    .rail{overflow-x:auto}
    .rail.run .track{animation:none}
  }

  /* join link: mirrors the brand lockup on the left (hairline divider, ink type, gold detail) */
  .join{position:relative;display:flex;flex-direction:column;justify-content:center;padding:0 clamp(18px,2.2vw,34px) 3px;border-left:1px solid var(--line);color:var(--ink)}
  .join .big{position:relative;align-self:flex-start;font-weight:700;font-size:25px;letter-spacing:.06em;text-transform:uppercase;line-height:1;white-space:nowrap;padding-bottom:5px}
  .join .big::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:34%;background:var(--gold);transition:width .35s cubic-bezier(.2,.8,.2,1)}
  .join:hover .big::after,.join:focus-visible .big::after{width:100%}
  .join:hover .big,.join:focus-visible .big{color:var(--gold)}
  .join .big{transition:color .3s}
  .join .sub{margin-top:5px;font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
  .join:focus-visible{outline:2px solid var(--gold);outline-offset:-6px}

  /* narrower desktops and tablets */
  @media (max-width:1180px){ .brand .tag{display:none} .brand .name{font-size:22px} }
  @media (max-width:820px){
    .brand .txt{display:none}
    .brand{padding-right:14px}
    .join .sub{display:none}
    .join .big{font-size:21px}
  }
  /* phones, short embed (about 60 to 90px): one row, crest | logo strip | join */
  @media (max-width:600px){
    .brand{padding:0 10px 3px}
    .brand img{height:min(52px,calc(100vh - 16px))}
    .join{padding:0 12px 3px}
    .join .big{font-size:18px;padding-bottom:4px}
    .track{--g:16px;padding:0 12px}
    .track .lbl{display:none}
  }
  /* phones, taller embed (about 96px and up): fixed-size rows, centered; crest + stacked name and Join on top, logo strip underneath */
  @media (max-width:600px) and (min-height:96px){
    .vh{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:62px 40px;align-content:center;
        grid-template-areas:"brand join" "rail rail"}
    .vh::after{display:none}            /* the Wix header already has its own gold bar on mobile */
    .brand{grid-area:brand;border-right:0;padding:0 0 0 14px;gap:10px}
    .brand img{height:48px}
    .brand .txt{display:flex}
    .brand .tag{display:none}
    .brand .n1{display:block;font-weight:600;font-size:11px;letter-spacing:.22em;color:var(--gold);margin-bottom:3px}
    .brand .n2{display:block;font-size:23px;letter-spacing:.04em}
    .join{grid-area:join;border-left:0;padding:0 14px 0 8px}
    .join .big{font-size:19px}
    .rail{grid-area:rail;border-top:1px solid var(--line)}
    .track img{height:calc(var(--h) * .68)}
  }
  /* short embeds (for example a 60 to 66px mobile header) */
  @media (max-height:70px){ :root{--k:.86} }
</style>
</head>
<body data-ticker="always">

<script>
(function(){
  var rail = document.querySelector('.rail');
  var track = rail.querySelector('.track');
  var source = track.innerHTML;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function hidden(html){
    var box = document.createElement('ul');
    box.innerHTML = html;
    box.querySelectorAll('li').forEach(function(li){ li.setAttribute('aria-hidden','true'); });
    box.querySelectorAll('a').forEach(function(a){ a.tabIndex = -1; });
    return box.innerHTML;
  }

  function fit(){
    rail.classList.remove('run');
    track.innerHTML = source;
    if (reduce) return;
    var auto = document.body.getAttribute('data-ticker') === 'auto';
    if (auto && track.scrollWidth <= rail.clientWidth + 1) return;   // everything fits, stay still
    // build one loop that is at least as wide as the rail, then duplicate it for a seamless scroll
    var copies = hidden(source), loop = source, n = 1;
    track.innerHTML = loop;
    while (track.scrollWidth < rail.clientWidth && n < 4) { loop += copies; track.innerHTML = loop; n++; }
    var w = track.scrollWidth;
    track.innerHTML = loop + hidden(loop);
    track.style.setProperty('--dur', Math.round(w / 32) + 's');
    rail.classList.add('run');
  }

  var t;
  window.addEventListener('resize', function(){ clearTimeout(t); t = setTimeout(fit, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  window.addEventListener('load', fit);
  fit();
})();
</script>
