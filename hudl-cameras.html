<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hudl Cameras | Virginia Valor FC</title>
<style>
  :root { --ink: #0d0d0d; --page: #f3f3f1; --card: #fff; --gold: #8B7A4C; --brass: #C8B98F; --muted: #555; --hair: #dcdcd8;
          --green: #1B7F3B; --red: #C62828; --sans: Arial, Helvetica, sans-serif; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 400 16px/1.4 var(--sans); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 14px; }
  .muted { color: var(--muted); }

  .mast { background: var(--ink); color: #fff; position: sticky; top: 0; z-index: 4; border-bottom: 3px solid var(--gold); }
  .mrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0 6px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .crest { height: 34px; width: auto; display: block; flex: 0 0 auto; }
  .title { font-size: 19px; font-weight: 700; line-height: 1.1; }
  .title span { display: block; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--brass); font-weight: 700; }
  .who { color: #e6e6e6; font-size: 14px; text-align: right; }
  .linkbtn { background: none; border: 0; padding: 6px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .mast .linkbtn { color: var(--brass); }
  .tabs { display: flex; gap: 24px; }
  .tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 0 7px; cursor: pointer; font-weight: 700; color: #bdbdbd; }
  .tab[aria-selected="true"] { color: #fff; border-bottom-color: var(--brass); }

  .signin { padding: 0 0 48px; display: flex; justify-content: center; }
  .tag { width: 100%; max-width: 420px; margin-top: 34px; background: var(--card); border: 1px solid var(--hair); border-top: 10px solid var(--gold); padding: 26px 22px 24px; }
  .tag .kicker { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
  .tag h1 { margin: 6px 0 0; font-size: 28px; line-height: 1.1; font-weight: 700; }
  .tag .sub { margin: 10px 0 22px; color: var(--muted); }
  .rule { height: 1px; background: var(--hair); margin: 0 0 20px; }
  label { display: block; font-weight: 700; margin-bottom: 8px; }
  input[type="email"], input[type="text"] { width: 100%; min-height: 52px; padding: 10px 12px; font: 400 16px var(--sans);
    border: 2px solid var(--ink); border-radius: 0; background: #fff; color: var(--ink); }
  .signin .btn { margin-top: 14px; }
  .err { margin: 16px 0 0; padding: 10px 0 10px 12px; border-left: 5px solid var(--red); color: var(--red); font-weight: 700; }
  .err:empty { display: none; }
  .tagfoot { display: flex; align-items: center; justify-content: space-between; gap: 14px;
    margin: 22px 0 0; padding-top: 14px; border-top: 1px solid var(--hair); font-size: 14px; color: var(--muted); }
  .hudl { height: 18px; width: auto; display: block; flex: 0 0 auto; }
  .foot { display: flex; align-items: center; gap: 10px; }
  .foot .hudl { height: 16px; }

  .strip { display: flex; gap: 8px; overflow-x: auto; padding: 12px 14px 10px; margin: 0 -14px; scrollbar-width: thin; }
  .chip { flex: 0 0 auto; min-width: 66px; padding: 7px 6px 6px; background: var(--card); border: 2px solid var(--hair); border-radius: 0; cursor: pointer; text-align: center; line-height: 1.2; }
  .chip .dw { display: block; font-size: 13px; color: var(--muted); }
  .chip .dn { display: block; font-size: 20px; font-weight: 700; }
  .chip .fr { display: block; font-size: 13px; font-weight: 700; color: var(--green); }
  .chip .fr.none { color: var(--red); }
  .chip[aria-selected="true"] { border-color: var(--ink); box-shadow: inset 0 -4px 0 var(--ink); }
  .chip.late { border-color: var(--red); }
  .chip.late .dn, .chip.late .fr { color: var(--red); }

  .filter { display: flex; align-items: center; gap: 10px; padding-top: 10px; }
  .filter label { margin: 0; }
  select { min-height: 44px; padding: 6px 10px; font: 400 16px var(--sans); border: 2px solid var(--ink); border-radius: 0; background: #fff; color: var(--ink); }
  .dayhead { margin: 8px 0 10px; }
  .dayhead .dt { font-size: 20px; font-weight: 700; }
  .dayhead .av { margin-top: 2px; font-weight: 700; }
  .dayhead .av b { color: var(--green); }
  .dayhead .av b.none { color: var(--red); }
  .cams { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .cm { min-width: 34px; padding: 3px 6px; text-align: center; font-size: 14px; font-weight: 700; border: 2px solid var(--green); color: var(--green); background: #fff; }
  .cm.used { border-color: var(--hair); color: #777; background: #ebebe8; font-weight: 400; }
  .legend { margin: 6px 0 0; font-size: 14px; color: var(--muted); }

  .card { margin: 0 0 10px; background: var(--card); border: 1px solid var(--hair); border-left: 8px solid var(--ink); padding: 10px 12px 12px; }
  .card.in { border-left-color: var(--green); }
  .card.out { border-left-color: var(--red); }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .cam { font-size: 22px; font-weight: 700; }
  .st { font-weight: 700; text-align: right; }
  .st.in { color: var(--green); }
  .st.out { color: var(--red); }
  .game { padding: 6px 0; border-top: 1px solid var(--hair); }
  .head + .game { margin-top: 6px; }
  .game.mine { box-shadow: inset 4px 0 0 var(--gold); padding-left: 10px; margin-left: -2px; }
  .line { margin: 6px 0 0; }
  .sm { font-size: 14px; }

  .row { display: flex; gap: 10px; align-items: stretch; margin-top: 10px; }
  .btn { display: block; width: 100%; min-height: 52px; border: 2px solid var(--ink); border-radius: 0;
    background: var(--ink); color: #fff; cursor: pointer; font-weight: 700; }
  .row .btn { flex: 1; }
  .btn.go { background: var(--green); border-color: var(--green); }
  .btn.stop { background: var(--red); border-color: var(--red); }
  .btn.sm2 { min-height: 46px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .claims { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .more { margin-top: 8px; }
  details { margin-top: 8px; }
  summary { cursor: pointer; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }
  details input { margin-top: 6px; }
  .acts { display: flex; flex-direction: column; align-items: flex-start; gap: 0; margin-top: 2px; }

  .empty { padding: 24px 0 16px; max-width: 30ch; }
  .foot { margin: 20px 0 40px; color: var(--muted); }
  .toast { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 14px; background: var(--ink); color: var(--brass);
    font-weight: 700; transform: translateY(110%); visibility: hidden; transition: transform .15s ease-out, visibility 0s .15s; }
  .toast.show { transform: none; visibility: visible; transition: transform .15s ease-out; }
  .toast .wrap { padding: 0; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
  .linkbtn { padding: 11px 6px; min-height: 44px; }
  summary { padding: 11px 0; min-height: 44px; }
  button, summary, select, input { touch-action: manipulation; -webkit-tap-highlight-color: rgba(139,122,76,.25); }
  .toast { padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"><div class="wrap" id="toastText"></div></div>

  function demoSnapshot() {
    var s = JSON.parse(JSON.stringify(demo)), me = 'Cory Fick';
    s.coach = { name: me, email: 'demo@example.org', admin: false };
    s.chains.forEach(function (c) { c.outEmail = c.outBy ? 'demo@example.org' : ''; c.inEmail = c.inBy ? 'demo@example.org' : ''; });
    s.mode = demo.mode; s.newbie = false; s.closes = {}; s.closes[addDays(s.today, 1)] = { text: addDays(s.today, 0).slice(5).replace('-', '/') + ' 4:00 PM', closed: false };
    s.unassigned.forEach(function (g) { var r = demo.requested[g.date + '|' + g.field + '|' + g.team]; if (r) { g.req = 'requested'; g.reqBy = r; } });
    s.avail = {};

  function demoApi(p) {
    if (!demo) demoInit();
    if (p.action === 'signin' || p.action === 'state') return { ok: true, state: demoSnapshot() };
    var me = 'Cory Fick', msg = '';
    if (p.action === 'request') {
      demo.unassigned.forEach(function (g) { if (g.date === p.date && g.field === p.field && g.coach === me) demo.requested[g.date + '|' + g.field + '|' + g.team] = me; });
      return { ok: true, message: 'Request sent for ' + p.field + '. You will get an email when a camera is assigned.', state: demoSnapshot() };
    }
    if (p.action === 'cancel_request') {
      Object.keys(demo.requested).forEach(function (k) { if (k.indexOf(p.date + '|' + p.field + '|') === 0) delete demo.requested[k]; });
      return { ok: true, message: 'Request cancelled.', state: demoSnapshot() };
    }
    if (p.action === 'claim') {
      demo.unassigned = demo.unassigned.filter(function (g) {
        if (g.date === p.date && g.field === p.field) {
          var c = demo.chains.filter(function (x) { return x.camera === p.camera && x.date === p.date; })[0];
          if (!c) { c = { date: p.date, camera: p.camera, status: 'waiting', overdue: false, outBy: '', outAt: '', inBy: '', inAt: '', notes: '', prior: null, games: [] }; demo.chains.push(c); }
          c.games.push({ time: g.time, field: g.field, team: g.team, coach: g.coach, opponent: g.opponent, role: 'hold' });
          return false;
        }
        return true;
      });
      demo.chains.forEach(function (c) { var n = c.games.length; c.games.forEach(function (g, i) { g.role = n === 1 ? 'only' : i === 0 ? 'pickup' : i === n - 1 ? 'return' : 'hold'; }); });
      demo.free[p.date] = (demo.free[p.date] || []).filter(function (x) { return x !== p.camera; });
      demo.claimed[p.date + '|' + fkey(p.field)] = p.camera;
      return { ok: true, message: p.camera + ' is claimed for ' + p.field + '.', state: demoSnapshot() };
    }
    if (p.action === 'release') {
      var cm = demo.claimed[p.date + '|' + fkey(p.field)];
      var ch = demo.chains.filter(function (x) { return x.camera === cm && x.date === p.date; })[0];
      if (ch) {
        ch.games = ch.games.filter(function (g) {
          if (g.field !== p.field) return true;
          demo.unassigned.push({ date: p.date, time: g.time, field: g.field, team: g.team, coach: g.coach, opponent: g.opponent }); return false;
        });
        if (!ch.games.length) demo.chains.splice(demo.chains.indexOf(ch), 1);
        demo.free[p.date] = (demo.free[p.date] || []).concat([cm]).sort();
      }
      delete demo.claimed[p.date + '|' + fkey(p.field)];
      return { ok: true, message: cm + ' is given back.', state: demoSnapshot() };
    }
    var c = demo.chains.filter(function (x) { return x.camera === p.camera && x.date === p.date; })[0];
    if (!c) return { ok: false, message: 'That camera is not assigned on that date.' };
    var who = p.sub ? p.sub + ' (for ' + me + ')' : me;
    if (p.action === 'pickup') { c.status = 'out'; c.outBy = who; c.outAt = stampNow(); c.prior = null; msg = p.sub ? c.camera + ' is with ' + p.sub + '.' : c.camera + ' is yours.'; }
    else if (p.action === 'return') { c.status = 'returned'; c.inBy = who; c.inAt = stampNow(); c.overdue = false; msg = c.camera + ' is returned. Thank you.'; }
    else if (p.action === 'undo_pickup') { c.status = 'waiting'; c.outBy = ''; c.outAt = ''; msg = 'Undone.'; }
    else if (p.action === 'undo_return') { c.status = 'out'; c.inBy = ''; c.inAt = ''; msg = 'Undone.'; }
    if (p.note) c.notes = (c.notes ? c.notes + ' | ' : '') + me + ': ' + p.note;
    return { ok: true, message: msg, state: demoSnapshot() };
  }

  function claimCard(date, f) {
    var free = state.free[date] || [], admin = state.coach.admin, selfServe = state.mode === 'selfserve';
    var mineHere = f.games.some(function (g) { return g.mine; });
    var status = f.games.filter(function (g) { return g.req === 'requested'; });
    var declined = f.games.filter(function (g) { return g.req === 'declined'; });
    var cl = state.closes && state.closes[date];
    var max = state.maxClaims || 0, used = 0;
    Object.keys(state.claimed || {}).forEach(function (k) { if (k.indexOf(date + '|') === 0) used++; });
    var head = 'Unassigned', body = [];

    function claimButtons() {
      if (!free.length) return h('p', { class: 'line' }, 'No cameras are free that day. Ask Craig or Dylan.');
      if (max && used >= max) return h('p', { class: 'line' }, 'You have claimed ' + used + ' cameras for this day, the most one coach can hold. Give one back or ask Craig or Dylan.');
      return [h('p', { class: 'line' }, 'Pick a camera for this field:'),
        h('div', { class: 'claims' }, free.map(function (cam) {
          return h('button', { class: 'btn sm2', onclick: function () { claim(date, f.field, cam); } }, cam);
        }))];
    }

    if (status.length) {
      head = 'Requested';
      body.push(h('p', { class: 'line' }, 'Requested by ' + status[0].reqBy + '. You will get an email when a camera is assigned.'));
      if (admin || status.some(function (g) { return g.mine; })) {
        body.push(h('div', { class: 'acts' }, h('button', { class: 'linkbtn', onclick: function () { send({ action: 'cancel_request', date: date, field: f.field }); } }, 'Cancel request')));
      }
      if (admin && free.length) body.push(claimButtons());
    } else if (selfServe || admin) {
      if (!mineHere && !admin) body.push(h('p', { class: 'line muted' }, 'Only a coach with a game here can take a camera for this field.'));
      else body.push(claimButtons());
      if (!selfServe && admin) {
        body.push(h('div', { class: 'row' }, h('button', { class: 'btn', onclick: function () { send({ action: 'request', date: date, field: f.field }); } }, 'Request a camera')));
      }
    } else if (!mineHere) {
      body.push(h('p', { class: 'line muted' }, 'Only a coach with a game here can ask for a camera for this field.'));
    } else if (state.newbie) {
      body.push(h('p', { class: 'line' }, 'Meet Craig or Dylan to get set up on the Hudl app. They will turn requests on for you.'));
    } else if (cl && cl.closed) {
      body.push(h('p', { class: 'line flag-out' }, 'Requests for this day are closed. Ask Craig or Dylan.'));
    } else {
      if (declined.length) body.push(h('p', { class: 'line' }, 'Not assigned this time.' + (declined[0].reqNote ? ' ' + declined[0].reqNote : '')));
      body.push(h('div', { class: 'row' }, h('button', { class: 'btn', onclick: function () { send({ action: 'request', date: date, field: f.field }); } },
        declined.length ? 'Request again' : 'Request a camera')));
      if (cl) body.push(h('p', { class: 'line muted sm' }, 'Requests close ' + cl.text + '.'));
    }
    return h('article', { class: 'card' },
      h('div', { class: 'head' }, h('span', { class: 'cam' }, 'No camera'), h('span', { class: 'st' }, head)),
      f.games.map(function (g) { return gameLine(g, true); }), body);
  }

  // ---------- actions ----------
  function setBusy(b) { busy = b; Array.prototype.forEach.call(document.querySelectorAll('.btn'), function (x) { x.disabled = b; }); }
  function send(payload) {
    if (busy) return;
    setBusy(true);
    api(payload).then(function (r) {
      if (r && r.state) state = r.state;
      toast((r && r.message) || 'Done.');
      busy = false; renderApp();
    }).catch(function () { busy = false; setBusy(false); toast('Could not reach the server. Nothing was saved. Try again.'); });
  }
  function act(c, action, note, sub) { send({ action: action, camera: c.camera, date: c.date, note: (note || '').trim(), sub: (sub || '').trim() }); }
  function claim(date, field, cam) { send({ action: 'claim', camera: cam, date: date, field: field }); }
  function refresh() { if (!busy) { load(false); toast('Updated.'); } }
  function signOut() { store('hudl_email', null); email = null; state = null; signInError = ''; renderSignIn(); }

  document.addEventListener('visibilitychange', function () { if (!document.hidden && state && !busy) load(false); });
  setInterval(function () { if (state && !busy && !document.hidden) load(false); }, 120000);

  if (DEMO) email = 'demo@example.org';
  if (email) load(false); else renderSignIn();
})();
</script>
</body>
</html>
