<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hudl cameras | Virginia Valor FC</title>
<style>
  :root { --ink:#111; --page:#f4f3f0; --card:#fff; --gold:#8B7A4C; --brass:#C8B98F; --muted:#5a5a56; --hair:#e1e0db;
          --green:#16793A; --greenbg:#eaf4ed; --red:#C0272D; --redbg:#fbecec; --goldbg:#f8f4ea;
          --sans:Arial, Helvetica, sans-serif; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--page); color:var(--ink); font:400 17px/1.45 var(--sans); }
  button, input, select { font:inherit; color:inherit; }
  :focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  button, summary, select, input { touch-action:manipulation; -webkit-tap-highlight-color:rgba(139,122,76,.2); }
  .wrap { max-width:760px; margin:0 auto; padding:0 16px; }
  .muted { color:var(--muted); }
  .sm { font-size:15px; }

  /* masthead */
  .mast { background:#fff; border-bottom:3px solid var(--gold); position:sticky; top:0; z-index:5; }
  .mrow { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 0; }
  .word { height:34px; width:auto; display:block; }
  .who { text-align:right; font-size:14px; color:var(--muted); line-height:1.3; }
  .who b { display:block; color:var(--ink); font-size:16px; }
  .linkbtn { background:none; border:0; padding:6px 0; cursor:pointer; color:var(--gold); font-weight:700;
    text-decoration:underline; text-underline-offset:3px; min-height:44px; }
  .tabs { display:flex; gap:4px; }
  .tab { flex:1; background:none; border:0; border-bottom:4px solid transparent; padding:12px 6px; cursor:pointer;
    font-weight:700; color:var(--muted); min-height:48px; }
  .tab[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--gold); }

  /* status band */
  .band { padding:20px 0; border-bottom:1px solid var(--hair); }
  .band.go { background:var(--greenbg); }
  .band.todo { background:var(--goldbg); }
  .band.stop { background:var(--redbg); }
  .band .big { font-size:24px; font-weight:700; line-height:1.2; }
  .band.go .big { color:var(--green); }
  .band.stop .big { color:var(--red); }
  .band .sub { margin-top:4px; color:var(--muted); }

  h2 { margin:28px 0 12px; font-size:14px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:700; }

  /* action card */
  .act { background:var(--card); border:1px solid var(--hair); border-radius:3px; padding:16px; margin-bottom:12px;
    box-shadow:0 1px 2px rgba(0,0,0,.05); }
  .act.late { border-color:var(--red); border-top:5px solid var(--red); }
  .act.today { border-top:5px solid var(--gold); }
  .act .cam { font-size:30px; font-weight:700; line-height:1; }
  .act .where { margin-top:8px; font-weight:700; }
  .act .when { color:var(--muted); }
  .btn { display:block; width:100%; min-height:60px; margin-top:14px; border:0; border-radius:3px;
    background:var(--ink); color:#fff; cursor:pointer; font-weight:700; font-size:18px; }
  .btn.go { background:var(--green); }
  .btn.stop { background:var(--red); }
  .btn.ghost { background:#fff; color:var(--ink); border:2px solid var(--ink); }
  .btn:disabled { opacity:.45; cursor:default; }
  .more { margin-top:10px; }
  summary { cursor:pointer; padding:10px 0; min-height:44px; color:var(--gold); font-weight:700;
    text-decoration:underline; text-underline-offset:3px; font-size:15px; }
  .more input[type="text"] { width:100%; min-height:52px; padding:10px 12px; border:2px solid var(--ink);
    border-radius:3px; background:#fff; margin-bottom:8px; }
  .acts { display:flex; flex-wrap:wrap; gap:18px; }
  .acts .linkbtn { font-size:15px; }

  /* day list */
  .day { background:var(--card); border:1px solid var(--hair); border-radius:3px; margin-bottom:10px; overflow:hidden; }
  .day > summary { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px;
    color:var(--ink); text-decoration:none; font-weight:700; }
  .day > summary::-webkit-details-marker { display:none; }
  .day > summary::after { content:'Show'; color:var(--gold); font-size:14px; font-weight:700; }
  .day[open] > summary::after { content:'Hide'; }
  .day .dnum { color:var(--muted); font-weight:400; font-size:15px; }
  .daybody { padding:0 16px 14px; }

  .row { display:flex; align-items:baseline; gap:10px; padding:11px 0; border-top:1px solid var(--hair); }
  .row .t { font-weight:700; white-space:nowrap; }
  .row .m { flex:1; min-width:0; }
  .chip { flex:0 0 auto; font-size:13px; font-weight:700; padding:3px 8px; border-radius:2px; white-space:nowrap; }
  .chip.go { background:var(--greenbg); color:var(--green); }
  .chip.stop { background:var(--redbg); color:var(--red); }
  .chip.wait { background:var(--goldbg); color:var(--gold); }
  .chip.none { background:#eceae5; color:var(--muted); }

  /* camera board */
  .board { display:grid; grid-template-columns:repeat(auto-fill, minmax(104px,1fr)); gap:10px; }
  .cell { background:var(--card); border:1px solid var(--hair); border-top:5px solid var(--hair); border-radius:3px; padding:10px; }
  .cell.free { border-top-color:var(--green); }
  .cell.out { border-top-color:var(--red); }
  .cell.book { border-top-color:var(--gold); }
  .cell.book .s { color:var(--gold); }
  .cell.off { opacity:.55; }
  .cell .n { font-size:20px; font-weight:700; }
  .cell .s { font-size:13px; font-weight:700; margin-top:2px; }
  .cell.free .s { color:var(--green); }
  .cell.out .s { color:var(--red); }
  .cell .w { font-size:13px; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; }
  .pick { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0 0 16px; }
  select { min-height:48px; padding:8px 12px; border:2px solid var(--ink); border-radius:3px; background:#fff; }

  /* sign in */
  .signin { display:flex; justify-content:center; padding:0 0 48px; }
  .panel { width:100%; max-width:420px; margin-top:32px; background:var(--card); border:1px solid var(--hair);
    border-radius:4px; padding:28px 22px; text-align:center; box-shadow:0 2px 10px rgba(0,0,0,.06); }
  .panel .crest { width:110px; height:auto; margin:0 auto 14px; display:block; }
  .panel h1 { margin:0 0 6px; font-size:26px; line-height:1.15; }
  .panel p { margin:0 0 22px; color:var(--muted); }
  .panel form { text-align:left; }
  label { display:block; font-weight:700; margin-bottom:8px; }
  input[type="email"] { width:100%; min-height:54px; padding:10px 12px; border:2px solid var(--ink); border-radius:3px; background:#fff; }
  .err { margin:14px 0 0; padding:10px 12px; background:var(--redbg); color:var(--red); font-weight:700; border-radius:3px; }
  .err:empty { display:none; }

  .empty { background:var(--card); border:1px solid var(--hair); border-radius:3px; padding:22px 16px; color:var(--muted); }
  .foot { display:flex; align-items:center; gap:10px; margin:30px 0 44px; color:var(--muted); font-size:14px; }
  .hudl { height:16px; width:auto; display:block; }
  .toast { position:fixed; left:0; right:0; bottom:0; z-index:9; padding:16px;
    padding-bottom:calc(16px + env(safe-area-inset-bottom)); background:var(--ink); color:#fff; font-weight:700;
    transform:translateY(110%); visibility:hidden; transition:transform .15s ease-out, visibility 0s .15s; }
  .toast.show { transform:none; visibility:visible; transition:transform .15s ease-out; }
  .toast .wrap { padding:0; }
  @media (prefers-reduced-motion:reduce) { .toast { transition:none; } }

  @media (min-width:860px) {
    body { font-size:18px; }
    .wrap { max-width:1100px; padding:0 32px; }
    .word { height:42px; }
    .tabs { gap:36px; }
    .tab { flex:0 0 auto; padding:12px 2px; }
    .band { padding:28px 0; }
    .band .big { font-size:30px; }
    .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); gap:14px; }
    .act { margin-bottom:0; }
    .board { grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); }
    .toast { left:auto; right:32px; bottom:32px; max-width:460px; border-radius:3px; }
  }
</style>
</head>

      h('button', { class: 'btn ' + (j.kind === 'pickup' ? 'go' : 'stop'),

        (j.kind === 'pickup' ? 'Pick up ' : 'Return ') + c.camera),
      j.kind === 'pickup' ? h('div', { class: 'when sm', style: 'margin-top:8px' }, 'Charge the camera and battery pack to 100%.') : null,
      j.kind === 'return' && state.place ? h('div', { class: 'when sm', style: 'margin-top:8px' }, 'Goes back to ' + state.place + '.') : null,
      h('details', { class: 'more' }, h('summary', null, 'Someone else is doing it, or add a note'), sub, note),
      small.length ? h('div', { class: 'acts' }, small) : null);
  }

  // One compact row per game in the coach's own schedule.
  function myDays() {
    var byDate = {};
    function bucket(d) { return byDate[d] || (byDate[d] = []); }
    state.chains.forEach(function (c) {
      c.games.forEach(function (g) {
        if (!g.mine) return;
        var role = g.role === 'hold' ? 'none' : (g.role === 'pickup' ? 'pickup' : g.role === 'return' ? 'return' : 'both');
        bucket(c.date).push({ time: c.multi ? 'All event' : g.time, field: g.field, team: g.team,
          camera: c.camera, status: c.status, role: role, div: g.division,
          from: g.from, to: g.to, multi: c.multi, endDate: c.endDate });
      });
    });
    state.unassigned.forEach(function (g) {
      if (!g.mine) return;
      bucket(g.date).push({ time: g.time, field: g.field, team: g.team, camera: '', req: g.req, reqNote: g.reqNote, div: g.division });
    });
    return Object.keys(byDate).sort().map(function (d) {
      var rows = byDate[d].sort(function (a, b) { return String(a.time) < String(b.time) ? -1 : 1; });
      return { date: d, rows: rows };
    });
  }

  function rowChip(r) {
    if (!r.camera) {
      if (r.req === 'requested') return h('span', { class: 'chip wait' }, 'Requested');
      if (r.req === 'declined') return h('span', { class: 'chip none' }, 'Not assigned');
      return h('span', { class: 'chip none' }, 'No camera');
    }
    if (r.status === 'returned') return h('span', { class: 'chip go' }, 'Returned');
    if (r.status === 'out') return h('span', { class: 'chip stop' }, 'Out');
    if (r.role === 'none') return h('span', { class: 'chip none' }, r.to && !isMe(r.to) ? 'Hand to ' + first(r.to) : 'You keep it');
    return h('span', { class: 'chip wait' }, r.role === 'return' ? 'You return it' : 'You pick it up');
  }

  function requestBlock(d, field, games) {
    var av = (state.avail && state.avail[d]) || null;
    var selfServe = state.mode === 'selfserve', admin = state.coach.admin;
    var free = state.free[d] || [];
    var cl = state.closes && state.closes[d];
    var requested = games.some(function (g) { return g.req === 'requested'; });
    var body = [];
    if (requested) {
      body.push(h('div', { class: 'when' }, 'Requested. You will get an email when a camera is assigned.'));
      body.push(h('div', { class: 'acts' }, h('button', { class: 'linkbtn', onclick: function () { send({ action: 'cancel_request', date: d, field: field }); } }, 'Cancel request')));
    } else if (state.newbie && !admin) {
      body.push(h('div', { class: 'when' }, 'Meet Craig or Dylan to get set up on the Hudl app first.'));
    } else if (cl && cl.closed && !admin) {
      body.push(h('div', { class: 'when' }, 'Requests for this day are closed. Ask Craig or Dylan.'));
    } else if (selfServe || admin) {
      if (!free.length) body.push(h('div', { class: 'when' }, 'No cameras are free that day.'));
      else body.push(h('button', { class: 'btn ghost', onclick: function () { claim(d, field, free[0]); } }, 'Take ' + free[0]));
    } else {
      if (games.some(function (g) { return g.req === 'declined' && g.reqNote; })) {
        body.push(h('div', { class: 'when' }, games.filter(function (g) { return g.reqNote; })[0].reqNote));
      }
      body.push(h('button', { class: 'btn ghost', onclick: function () { send({ action: 'request', date: d, field: field }); } }, 'Request a camera'));
      if (av) body.push(h('div', { class: 'when sm', style: 'margin-top:8px' }, av.free + ' of ' + av.total + ' cameras free that day' + (cl ? '. Requests close ' + cl.text : '')));
    }
    return body;
  }

  function renderMe() {
    var list = jobs(), out = [band(list)], main = [];
    if (list.length) {
      main.push(h('h2', null, list.length === 1 ? 'Your job' : 'Your jobs'));
      main.push(h('div', { class: 'cards' }, list.map(jobCard)));
    }
    var days = myDays();
    if (days.length) {
      main.push(h('h2', null, 'Your schedule'));
      if (!openTouched) {
        var firstOpen = 0;
        for (var di = 0; di < days.length; di++) { if (days[di].date >= state.today) { firstOpen = di; break; } }
        if (days[firstOpen]) openDays[days[firstOpen].date] = true;
        openTouched = true;
      }
      days.forEach(function (d, i) {
        var needs = {};
        d.rows.forEach(function (r) { if (!r.camera) (needs[r.field] = needs[r.field] || []).push(r); });
        main.push(h('details', { class: 'day', open: !!openDays[d.date],
            ontoggle: function (e) { openDays[d.date] = e.target.open; } }, h('summary', null,
            h('span', null, dayName(d.date), ' ', h('span', { class: 'dnum' }, d.rows.length + (d.rows.length === 1 ? ' game' : ' games')))),
          h('div', { class: 'daybody' },
            d.rows.map(function (r) {
              return h('div', { class: 'row' },
                h('span', { class: 't' }, r.time || 'All weekend'),
                h('span', { class: 'm' }, r.team, h('div', { class: 'muted sm' }, r.field + (r.camera ? '  ·  ' + r.camera : ''))),
                rowChip(r));
            }),
            Object.keys(needs).map(function (f) {
              return h('div', { style: 'margin-top:14px' }, h('div', { class: 'where' }, 'No camera for ' + f), requestBlock(d.date, f, needs[f]));
            }))));
      });
    }
    if (!list.length && !days.length) {
      main.push(h('div', { class: 'empty' }, 'You have no games in the next three weeks. Anything Craig adds will show up here.'));
    }
    out.push(h('main', { class: 'wrap' }, main, foot()));
    return out;
  }

  function renderAll() {
    var dates = [];
    state.chains.forEach(function (c) { if (c.date >= state.today && dates.indexOf(c.date) < 0) dates.push(c.date); });
    state.unassigned.forEach(function (g) { if (dates.indexOf(g.date) < 0) dates.push(g.date); });
    dates.sort();
    if (!dates.length) dates = [state.today];
    if (dates.indexOf(boardDay) < 0) boardDay = dates.indexOf(state.today) >= 0 ? state.today : dates[0];

    var av = (state.avail && state.avail[boardDay]) || null;
    var held = {};
    state.chains.forEach(function (c) {
      if (c.date !== boardDay) return;
      held[c.camera] = { status: c.status, who: c.status === 'out' ? first(c.outBy) : c.first.coach, field: c.first.field };
    });
    var names = [];
    if (av) av.cameras.forEach(function (n) { names.push(n); });
    Object.keys(held).forEach(function (n) { if (names.indexOf(n) < 0) names.push(n); });
    names.sort(function (a, b) { return camNum(a) - camNum(b); });

    var board = names.map(function (n) {
      var e = held[n];
      var cls = !e ? 'free' : e.status === 'out' ? 'out' : e.status === 'returned' ? 'free' : 'book';
      var label = !e ? 'Free' : e.status === 'out' ? 'Out' : e.status === 'returned' ? 'Back in' : 'Booked';
      return h('div', { class: 'cell ' + cls },
        h('div', { class: 'n' }, n),
        h('div', { class: 's' }, label),
        e ? h('div', { class: 'w' }, e.who) : null);
    });

    return [h('main', { class: 'wrap' },
      h('h2', null, 'Cameras'),
      h('div', { class: 'pick' },
        h('label', { for: 'bd', style: 'margin:0' }, 'Day'),
        h('select', { id: 'bd', onchange: function (e) { boardDay = e.target.value; render(); } },
          dates.map(function (d) { return h('option', { value: d, selected: d === boardDay }, dayName(d)); }))),
      av ? h('p', { class: 'muted', style: 'margin-top:0' }, dayName(boardDay) + ': ' + av.free + ' of ' + av.total + ' cameras free') : null,
      board.length ? h('div', { class: 'board' }, board) : h('div', { class: 'empty' }, 'No cameras are in service.'),
      foot())];
  }

  function foot() {
    return h('div', { class: 'foot' }, h('img', { class: 'hudl', src: HUDL_LOGO, alt: 'Hudl' }),
      h('span', null, DEMO ? 'Sample data. Nothing here is saved.' : 'Valor cameras are Hudl units.'));
  }

  function render() {
    app.replaceChildren();
    add(app, masthead());
    add(app, tab === 'me' ? renderMe() : renderAll());
  }

  // ---------- actions ----------
  function setBusy(b) {
    busy = b;
    Array.prototype.forEach.call(document.querySelectorAll('.btn'), function (x) { x.disabled = b; });
  }
  function send(payload) {
    if (busy) return;
    setBusy(true);
    api(payload).then(function (r) {
      if (r && r.state) state = r.state;
      toast((r && r.message) || 'Done.');
      busy = false; render();
    }).catch(function () { busy = false; setBusy(false); toast('Could not reach the server. Nothing was saved. Try again.'); });
  }
  function act(c, action, note, sub) {
    send({ action: action, camera: c.camera, date: c.date, note: (note || '').trim(), sub: (sub || '').trim() });
  }
  function claim(date, field, cam) { send({ action: 'claim', camera: cam, date: date, field: field }); }
  function refresh() { if (!busy) { load(false); toast('Updated.'); } }
  function signOut() { store('hudl_email', null); email = null; state = null; signInError = ''; renderSignIn(); }

  function load(fromSignIn) {
    api({ action: 'signin' }).then(function (r) {
      if (r && r.ok) {
        state = r.state;
        // first and last game of each chain, used all over
        state.chains.forEach(function (c) { c.first = c.games[0]; c.last = c.games[c.games.length - 1]; });
        signInError = ''; store('hudl_email', email); render();
      } else {
        signInError = (r && r.message) || 'Could not sign in.';
        if (fromSignIn || !state) { state = null; store('hudl_email', null); renderSignIn(); }
      }
    }).catch(function () {
      signInError = 'Could not reach the server. Check your connection and try again.';
      if (!state) renderSignIn(); else toast(signInError);
    });
  }

  document.addEventListener('visibilitychange', function () { if (!document.hidden && state && !busy) load(false); });
  setInterval(function () { if (state && !busy && !document.hidden) load(false); }, 120000);

  // ---------- sample data, only when API_URL is empty ----------
  var demo = null;
  function stampNow() {
    var d = new Date(), hr = d.getHours(), ap = hr >= 12 ? 'PM' : 'AM';
    hr = hr % 12 || 12;
    return (d.getMonth() + 1) + '/' + d.getDate() + '/' + String(d.getFullYear()).slice(2) + ' ' + hr + ':' + ('0' + d.getMinutes()).slice(-2) + ' ' + ap;
  }
  function demoInit() {
    var t = keyOf(new Date()), tm = addDays(t, 1), y = addDays(t, -1);
    function mk(date, cam, games, extra) {
      var c = { date: date, camera: cam, status: 'waiting', overdue: false, outBy: '', outAt: '', inBy: '', inAt: '',
        notes: '', outEmail: '', inEmail: '', prior: null,
        games: games.map(function (g) { return { time: g[0], field: g[1], team: g[2], coach: g[3], opponent: 'Sample', division: 'ECNL RL', role: 'hold' }; }) };
      var n = c.games.length;
      c.games.forEach(function (g, i) {
        g.role = n === 1 ? 'only' : i === 0 ? 'pickup' : i === n - 1 ? 'return' : 'hold';
        g.from = i > 0 ? c.games[i - 1].coach : '';
        g.to = i < n - 1 ? c.games[i + 1].coach : '';
      });
      Object.keys(extra || {}).forEach(function (k) { c[k] = extra[k]; });
      return c;
    }
    demo = { today: t, chains: [
      mk(y, 'Hudl 5', [['2:00 PM', 'Westfield High School Stadium', 'ECNL RL B2009/10', 'Cory Fick']],
        { status: 'out', outBy: 'Cory Fick', outAt: '11/10/26 1:20 PM', outEmail: 'demo@example.org', overdue: true }),
      mk(t, 'Hudl 4', [['4:30 PM', 'Chantilly High School Stadium', 'ECNL RL G2011/12', 'Cory Fick']]),
      mk(tm, 'Hudl 2', [['9:00 AM', 'Robinson HS Stadium', 'ECNL RL G2012/13', 'Oscar Hernandez'],
                        ['11:00 AM', 'Robinson HS Stadium', 'ECNL RL G2011/12', 'Cory Fick'],
                        ['1:00 PM', 'Robinson HS Stadium', 'ECNL RL G2013/14', 'Cory Fick']]),
      mk(tm, 'Hudl 3', [['10:00 AM', 'Robinson HS Upper Turf', 'ECNL RL B2011/12', 'Rob Olson'],
                        ['12:00 PM', 'Robinson HS Upper Turf', 'ECNL RL B2010/11', 'Rob Olson']]),
      mk(tm, 'Hudl 7', [['', 'Hunt Country Classic (U13 ECNL-RL G2013/14)', 'ECNL RL G2013/14', 'Cory Fick']],
        { multi: true, endDate: addDays(t, 3) })
    ], unassigned: [
      { date: tm, time: '2:00 PM', field: 'Sully Highlands 2', team: 'ECNL RL B2012/13', coach: 'Cory Fick', division: 'ECNL RL', req: '' },
      { date: tm, time: '3:45 PM', field: 'Sully Highlands 2', team: 'ECNL RL B2009/10', coach: 'Cory Fick', division: 'ECNL RL', req: '' }
    ], free: {}, claimed: {}, maxClaims: 2, mode: 'approval', requested: {}, place: 'the equipment cage at the Fieldhouse' };
    demo.free[tm] = ['Hudl 1', 'Hudl 6', 'Hudl 7'];
  }
  function demoSnapshot() {
    var s = JSON.parse(JSON.stringify(demo)), me = 'Cory Fick';
    s.coach = { name: me, email: 'demo@example.org', admin: false };
    s.newbie = false;
    s.closes = {}; s.closes[addDays(s.today, 1)] = { text: 'tonight at 4:00 PM', closed: false };
    s.chains.forEach(function (c) {
      c.games.forEach(function (g) { g.mine = g.coach === me; });
      c.mine = c.games.some(function (g) { return g.mine; });
      c.first = c.games[0]; c.last = c.games[c.games.length - 1];
    });
    s.unassigned.forEach(function (g) {
      g.mine = g.coach === me;
      var r = demo.requested[g.date + '|' + fkey(g.field)];
      if (r) { g.req = 'requested'; g.reqBy = r; }
    });
    s.avail = {};
    for (var i = 0; i < 21; i++) {
      var k = addDays(s.today, i), used = {};
      s.chains.forEach(function (c) { if (c.date === k) used[c.camera] = 1; });
      var all = []; for (var n = 1; n <= 12; n++) if (n !== 8) all.push('Hudl ' + n);
      var fr = all.filter(function (x) { return !used[x]; });
      s.avail[k] = { total: 11, free: fr.length, cameras: fr };
      if (s.unassigned.some(function (g) { return g.date === k; })) s.free[k] = fr;
    }
    return s;
  }
  function demoApi(p) {
    if (!demo) demoInit();
    if (p.action === 'signin' || p.action === 'state') return { ok: true, state: demoSnapshot() };
    var me = 'Cory Fick', msg = '';
    if (p.action === 'request') {
      demo.unassigned.forEach(function (g) { if (g.date === p.date && fkey(g.field) === fkey(p.field)) demo.requested[g.date + '|' + fkey(g.field)] = me; });
      return { ok: true, message: 'Request sent for ' + p.field + '.', state: demoSnapshot() };
    }
    if (p.action === 'cancel_request') {
      delete demo.requested[p.date + '|' + fkey(p.field)];
      return { ok: true, message: 'Request cancelled.', state: demoSnapshot() };
    }
    if (p.action === 'claim') {
      var moved = [];
      demo.unassigned = demo.unassigned.filter(function (g) {
        if (g.date === p.date && fkey(g.field) === fkey(p.field)) { moved.push(g); return false; }
        return true;
      });
      if (moved.length) {
        var c = { date: p.date, camera: p.camera, status: 'waiting', overdue: false, outBy: '', outAt: '', inBy: '', inAt: '',
          notes: '', outEmail: '', inEmail: '', prior: null,
          games: moved.map(function (g) { return { time: g.time, field: g.field, team: g.team, coach: g.coach, opponent: '', division: g.division, role: 'hold' }; }) };
        var n = c.games.length;
        c.games.forEach(function (g, i) { g.role = n === 1 ? 'only' : i === 0 ? 'pickup' : i === n - 1 ? 'return' : 'hold'; });
        demo.chains.push(c);
        demo.free[p.date] = (demo.free[p.date] || []).filter(function (x) { return x !== p.camera; });
        demo.claimed[p.date + '|' + fkey(p.field)] = p.camera;
      }
      return { ok: true, message: p.camera + ' is yours for ' + p.field + '.', state: demoSnapshot() };
    }
    var ch = demo.chains.filter(function (x) { return x.camera === p.camera && x.date === p.date; })[0];
    if (!ch) return { ok: false, message: 'That camera is not assigned on that date.' };
    var who = p.sub ? p.sub + ' (for ' + me + ')' : me;
    if (p.action === 'pickup') { ch.status = 'out'; ch.outBy = who; ch.outAt = stampNow(); ch.outEmail = 'demo@example.org'; ch.prior = null; msg = p.sub ? p.camera + ' is with ' + p.sub + '.' : p.camera + ' is yours.'; }
    else if (p.action === 'return') { ch.status = 'returned'; ch.inBy = who; ch.inAt = stampNow(); ch.overdue = false; msg = p.camera + ' is signed back in. Thank you.'; }
    else if (p.action === 'undo_pickup') { ch.status = 'waiting'; ch.outBy = ''; ch.outAt = ''; msg = 'Undone.'; }
    else if (p.action === 'release') {
      demo.chains = demo.chains.filter(function (x) { return x !== ch; });
      ch.games.forEach(function (g) { demo.unassigned.push({ date: ch.date, time: g.time, field: g.field, team: g.team, coach: g.coach, division: g.division, req: '' }); });
      demo.free[ch.date] = (demo.free[ch.date] || []).concat([ch.camera]).sort();
      delete demo.claimed[ch.date + '|' + fkey(ch.first.field)];
      msg = ch.camera + ' is given back.';
    }
    if (p.note) ch.notes = (ch.notes ? ch.notes + ' | ' : '') + me + ': ' + p.note;
    return { ok: true, message: msg, state: demoSnapshot() };
  }

  if (DEMO) email = 'demo@example.org';
  if (email) load(false); else renderSignIn();
})();
</script>
</body>
</html>
