<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Virginia Valor FC</title>
<!--
  VIDEO FILES
  The hero loads its video from these three addresses (search this file for them to change them):
    https://cyadylanlab.github.io/valorwebsite/media/hero-desktop.mp4   (required)
    https://cyadylanlab.github.io/valorwebsite/media/hero-mobile.mp4    (optional; phones fall back to the desktop file if it is missing)
    https://cyadylanlab.github.io/valorwebsite/media/hero-poster.jpg    (shown while the video loads)
  Full addresses are used so the hero also works when this file is opened from your computer.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000000;
    --gold: #8B7A4C;
    --brass: #C8B98F;
    --white: #FFFFFF;
    --mist: rgba(255, 255, 255, 0.8);
    --graphite: #4A4A4A;
    --v: clamp(26px, 5.5vw, 84px);
    --pad-x: clamp(20px, 4.2vw, 64px);
    --display: "Big Shoulders Display", "Oswald", "Arial Narrow", Impact, sans-serif;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--white); }
  body {
    font-family: var(--serif);
    color: var(--black);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--brass); outline-offset: 3px; }

  /* ---------- Hero shell ---------- */
  .hero {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100svh;
    background: var(--white);
  }

  .stage-wrap {
    position: relative;
    flex: 1 1 auto;
    min-height: 600px;
    display: flex;
  }

  .stage {
    position: relative;
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(76px, 9vh, 104px) var(--pad-x) calc(var(--v) + clamp(40px, 6vh, 72px));
    background:
      url("https://cyadylanlab.github.io/valorwebsite/media/hero-poster.jpg") center / cover no-repeat,
      radial-gradient(120% 90% at 20% 60%, #1c1a14 0%, var(--black) 70%);
    color: var(--white);
    overflow: hidden;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - var(--v)), 50% 100%, 0 calc(100% - var(--v)));
  }

  .stage-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }

  .stage-shade {
    position: absolute;
    inset: 0;
    z-index: 1;
    background:
      linear-gradient(to top, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.3) 48%, rgba(0,0,0,0.4) 100%),
      linear-gradient(to right, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 62%);
    pointer-events: none;
  }

  .stage-top { z-index: 4; }
  .stage-body { position: relative; z-index: 2; }

  .stage-top {
    position: absolute;
    top: clamp(20px, 3vw, 40px);
    right: var(--pad-x);
  }
  /* If the video can't load, the control has nothing to control */
  .stage.no-video .stage-top { display: none; }

  /* ---------- Video control ---------- */
  .motion-toggle {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px 8px 10px;
    border: 1px solid rgba(255,255,255,0.55);
    border-radius: 2px;
    background: rgba(0,0,0,0.25);
    color: var(--white);
    font: 400 14px/1 var(--serif);
    cursor: pointer;
  }
  .motion-toggle:hover { background: rgba(0,0,0,0.5); border-color: var(--white); }
  .motion-icon {
    position: relative;
    width: 10px;
    height: 12px;
  }
  .motion-icon::before,
  .motion-icon::after {
    content: "";
    position: absolute;
    top: 0;
    width: 3px;
    height: 12px;
    background: currentColor;
  }
  .motion-icon::before { left: 0; }
  .motion-icon::after { right: 0; }
  .motion-toggle[aria-pressed="true"] .motion-icon::before {
    width: 0;
    height: 0;
    background: none;
    border-style: solid;
    border-width: 6px 0 6px 10px;
    border-color: transparent transparent transparent currentColor;
  }
  .motion-toggle[aria-pressed="true"] .motion-icon::after { display: none; }

  /* ---------- Crest lockup: the crest leads, the club's words sit beside it ---------- */
  .lockup {
    display: flex;
    align-items: center;
    gap: clamp(24px, 3vw, 44px);
  }
  .brand { margin: 0; line-height: 0; flex: none; }
  .crest {
    display: block;
    height: clamp(180px, 34vh, 320px);
    width: auto;
    filter: drop-shadow(0 10px 30px rgba(0,0,0,0.55));
  }
  .lockup-rule {
    align-self: stretch;
    flex: none;
    width: 2px;
    margin: 18px 0;
    background: var(--gold);
  }
  .lockup-text { min-width: 0; }
  .tagline {
    margin: 0;
    font: 800 clamp(22px, 2.2vw, 32px)/1.15 var(--display);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--white);
    text-shadow: 0 2px 16px rgba(0,0,0,0.4);
  }
  .tagline span { white-space: nowrap; }
  .tagline .bar {
    display: inline-block;
    width: 2px;
    height: 0.8em;
    margin: 0 0.5em;
    vertical-align: -0.04em;
    background: var(--gold);
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: clamp(20px, 2.4vw, 28px);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 52px;
    padding: 0 26px;
    border-radius: 2px;
    font: 800 20px/1 var(--display);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-decoration: none;
    transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease;
  }
  .btn-primary {
    background: var(--gold);
    color: var(--black);
    border: 2px solid var(--gold);
  }
  .btn-primary:hover { background: var(--brass); border-color: var(--brass); }
  .btn-secondary {
    background: transparent;
    color: var(--white);
    border: 2px solid rgba(255,255,255,0.85);
  }
  .btn-secondary:hover { background: var(--white); color: var(--black); border-color: var(--white); }

  .note {
    max-width: 52ch;
    margin: 20px 0 0;
    font-size: 15px;
    line-height: 1.55;
    color: var(--mist);
  }

  /* ---------- Chevron edge: the crest's V carried into the page ---------- */
  .chevron {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: var(--v);
    overflow: visible;
    z-index: 3;
    pointer-events: none;
  }
  .chevron polyline {
    fill: none;
    stroke: var(--gold);
    stroke-width: 4;
    stroke-linejoin: miter;
    vector-effect: non-scaling-stroke;
  }
  /* On load the gold edge opens outward from the point of the V */
  .js .chevron { clip-path: inset(-10px 50% -10px 50%); animation: open 1100ms cubic-bezier(.3,.7,.2,1) 250ms forwards; }
  @keyframes open { to { clip-path: inset(-10px 0 -10px 0); } }

  /* ---------- Club and partners band ---------- */
  .band {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(24px, 3.4vw, 48px);
    padding: 26px var(--pad-x) 30px;
    background: var(--white);
  }
  .wordmark { display: block; height: 62px; width: auto; }
  .band-rule {
    align-self: stretch;
    width: 1px;
    margin: 6px 0;
    background: var(--gold);
  }
  .partners {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 18px clamp(22px, 2.6vw, 38px);
  }
  .partners-label {
    font: italic 400 15px/1.2 var(--serif);
    color: var(--graphite);
  }
  .partner {
    display: block;
    line-height: 0;
    border-radius: 2px;
    transition: opacity 160ms ease;
  }
  .partner:hover { opacity: 0.75; }
  .partner img { display: block; width: auto; }
  .p-stack img { height: 34px; }
  .p-parsons img { height: 31px; }
  .p-cheron img { height: 34px; }

  /* ---------- Tablet and phone ---------- */
  @media (max-width: 760px) {
    .lockup { flex-direction: column; align-items: flex-start; gap: 22px; }
    .lockup-rule { display: none; }
    .crest { height: clamp(150px, 26vh, 220px); }
  }

  @media (max-width: 480px) {
    .tagline span:not(.bar) { display: block; }
    .tagline .bar { display: none; }
  }

  @media (max-width: 640px) {
    .stage-wrap { min-height: 560px; }
    .stage { padding-top: 84px; }
    .actions { flex-direction: column; }
    .btn { width: 100%; }
    .note { font-size: 14px; }
    .motion-toggle .motion-label { display: none; }
    .motion-toggle { padding: 9px 11px; }

    .band { flex-direction: column; gap: 16px; padding-top: 22px; }
    .wordmark { height: 52px; }
    .band-rule { align-self: center; width: 48px; height: 1px; margin: 2px 0; }
    .partners { justify-content: center; }
    .partners-label { width: 100%; text-align: center; }
    .p-stack img { height: 26px; }
    .p-parsons img { height: 23px; }
    .p-cheron img { height: 26px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .js .chevron { animation: none; clip-path: none; }
    .btn, .partner { transition: none; }
  }
</style>
</head>

<script>
(function () {
  var video = document.querySelector(".stage-video");
  var toggle = document.querySelector(".motion-toggle");
  var label = toggle.querySelector(".motion-label");
  var phone = window.matchMedia("(max-width: 700px) and (orientation: portrait)");
  var userPaused = false;

  /* Browsers only allow autoplay when the video is muted, so make sure it is */
  video.muted = true;
  video.defaultMuted = true;
  video.setAttribute("muted", "");

  function setToggle(paused) {
    toggle.setAttribute("aria-pressed", paused ? "true" : "false");
    toggle.setAttribute("aria-label", paused ? "Play background video" : "Pause background video");
    label.textContent = paused ? "Play video" : "Pause video";
  }
  function play() {
    if (userPaused) return;
    var p = video.play();
    if (p && p.catch) p.catch(function () {});
  }

  /* Phones in portrait get the vertical file; if it is missing, fall back to desktop */
  function pickSource() {
    var want = phone.matches ? video.dataset.mobile : video.dataset.desktop;
    if (video.getAttribute("src") !== want) {
      video.setAttribute("src", want);
      video.load();
    }
    play();
  }
  var stage = document.querySelector(".stage");
  video.addEventListener("error", function () {
    if (video.getAttribute("src") === video.dataset.mobile) {
      video.setAttribute("src", video.dataset.desktop);
      video.load();
      play();
    } else {
      stage.classList.add("no-video");
      video.style.display = "none";
    }
  });

  /* Keep retrying autoplay: when data arrives, when the tab comes back, and on the first tap or scroll */
  video.addEventListener("loadeddata", play);
  video.addEventListener("canplay", play);
  /* The button label always follows what the video is actually doing */
  video.addEventListener("pause", function () { setToggle(true); });
  video.addEventListener("playing", function () { setToggle(false); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) play(); });
  ["pointerdown", "touchstart", "scroll", "keydown"].forEach(function (evt) {
    window.addEventListener(evt, function once() {
      play();
      window.removeEventListener(evt, once);
    }, { passive: true });
  });

  toggle.addEventListener("click", function (e) {
    e.stopPropagation();
    if (video.paused) { userPaused = false; play(); }
    else { userPaused = true; video.pause(); }
  });
  if (phone.addEventListener) phone.addEventListener("change", pickSource);

  pickSource();
})();
</script>
